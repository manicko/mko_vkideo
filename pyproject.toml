[project]
name = "vkdownloader"
version = "0.1.0"
description = "VK Video Downloader - Download videos from VKontakte"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
    { name = "VK Video Downloader Team" }
]
keywords = ["vkontakte", "video", "downloader", "playwright"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "playwright>=1.45.0",
    "aiohttp>=3.9.0",
    "pydantic>=2.0.0",
    "pydantic_settings>=2.0.0",
    "typer>=0.12.0",
    "rich>=14.0.0",
    "structlog>=24.0.0",
    "yt-dlp>=2024.0.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
vkdownloader = "vkdownloader.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vkdownloader"]
# stealth.min.js is a runtime data file, not Python: the Playwright browser
# layer reads it from next to the package at runtime (infrastructure/browser.py
# resolves the path and passes it to page.add_init_script), so it must ship in
# both artefacts. It is named here so its presence is stated in the manifest
# instead of being implied by the directory sweep.
artifacts = ["src/vkdownloader/stealth.min.js"]

# A source distribution exists so that someone can build, test and run this
# project from the archive alone. This list is an allow-list: anything not
# named here is not shipped, so the next untracked development tree - vendored
# dependencies, agent worktrees, audit corpora, user data - cannot ride along
# on the builder's default.
[tool.hatch.build.targets.sdist]
include = [
    "/src/vkdownloader",
    # Runtime data file loaded by the browser layer; see the wheel target.
    "/src/vkdownloader/stealth.min.js",
    "/tests",
    "/docs",
    "/pyproject.toml",
    "/uv.lock",
    "/.python-version",
    "/README.md",
    # Configuration template: every setting is commented out, it carries no
    # secrets, and it is the documented way to configure the application.
    "/.env.example",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [".temp", ".ai/builders"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in argument defaults (Typer pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["vkdownloader"]

[tool.mypy]
python_version = "3.14"
strict = true
disallow_any_explicit = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "silent"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "vkdownloader.cli"
disallow_untyped_decorators = false

# Pydantic BaseModel.__init__(**data: Any) is upstream's signature, not ours.
# This override suppresses the inherited explicit-Any for model classes.
# Removable by: pydantic-stubs shipping a non-Any BaseModel.__init__.
[[tool.mypy.overrides]]
module = "vkdownloader.models.*"
disallow_any_explicit = false

# Settings(BaseSettings) inherits the same __init__(**data: Any) from
# pydantic-settings' BaseSettings. Same rationale as models.*.
[[tool.mypy.overrides]]
module = "vkdownloader.config"
disallow_any_explicit = false

[dependency-groups]
dev = [
    "ruff>=0.14.7",
    "mypy>=2.0.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "coverage>=7.16.2",
    "annotated-types>=0.7.0",
]
