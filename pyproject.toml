[project]
name = "vkdownloader"
version = "0.1.0"
description = "VK Video Downloader - Download videos from VKontakte"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "VK Video Downloader Team" }
]
keywords = ["vkontakte", "video", "downloader", "playwright"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "playwright>=1.45.0",
    "aiohttp>=3.9.0",
    "pydantic>=2.0.0",
    "pydantic_settings>=2.0.0",
    "ffmpeg-python>=0.2.0",
    "typer>=0.12.0",
    "structlog>=24.0.0",
    "tqdm>=4.68.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
vkdownloader = "vkdownloader.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vkdownloader"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in argument defaults (Typer pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["vkdownloader"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "silent"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "vkdownloader.cli"
disallow_untyped_decorators = false
