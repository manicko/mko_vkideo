---
name: Packaging Check

# The paths filter is derived from the `[tool.hatch.build.targets.sdist]`
# include list, which is the allow-list of everything the archives ship: the
# package tree, the test tree, the documentation tree and four root files. Every
# one of those is a change to the artefact contents, so every one of them has to
# fire this gate. A path that is not shipped must not appear here, and a shipped
# path must never be missing: either way the gate is wrong.
on:
  push:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "README.md"
      - "LICENSE"
      - ".env.example"
      - "src/**"
      - "tests/**"
      - "docs/**"
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "README.md"
      - "LICENSE"
      - ".env.example"
      - "src/**"
      - "tests/**"
      - "docs/**"

permissions:
  contents: read

jobs:
  packaging-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --locked
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The job runs with contents:read only; disable the comment and SARIF
          # artefact features that need pull-requests/actions write scopes so
          # this is a pure detect-and-fail gate (DEP-003 secret-scan class).
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Compile all Python
        run: uv run python -m compileall -q src tests
      - name: Lint
        run: uv run ruff check src tests
      - name: Format check
        run: uv run ruff format --check src tests
      - name: Type check
        run: uv run mypy src
      - name: Behavioural tests
        run: uv run pytest tests/ tests/integration/ -rs
      - name: Coverage measurement
        run: uv run coverage run -m pytest tests/
      - name: Coverage report
        run: uv run coverage report
      - name: Advisory scan
        if: runner.os == 'Linux'
        run: |
          set +e
          trap 'rm -f /tmp/vkr.txt' EXIT
          uv export --locked --group dev --no-emit-project -o /tmp/vkr.txt && uv run pip-audit -r /tmp/vkr.txt 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "No known vulnerabilities detected."
          elif [ "$rc" -eq 1 ]; then
            echo "::error::Known vulnerabilities found in dependencies"
          else
            echo "::error::Advisory scan or dependency export failed (exit $rc)"
          fi
          exit "$rc"
      - name: Build distribution artefacts
        run: uv build --out-dir dist/
      - name: Wheel entry-point smoke
        if: runner.os == 'Linux'
        run: |
          uv pip install --force-reinstall dist/*.whl
          python -c "import vkdownloader; print(vkdownloader.__file__)"
          vkdownloader --help >/dev/null
      - name: Upload distribution artefacts
        uses: actions/upload-artifact@v4
        with:
          name: vkdownloader-distribution
          path: dist/
          retention-days: 1
      - name: Build artefacts and assert they match the manifest
        run: uv run pytest tests/test_packaging.py -v
