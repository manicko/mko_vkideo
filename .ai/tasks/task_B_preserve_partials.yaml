# Task spec for Block B — Preserve partials / prohibit destructive cleanup
# Generated by Planner. id: block_b_preserve_partials

id: block_b_preserve_partials

title: "Block B — Preserve partials / prohibit destructive cleanup"

priority: P0

depends_on:
  - A

source_reference: .ai/plans/MKO_VKIDEO_Refactoring_Plan.md
source_section: "Block B — Preserve all existing partial data and prohibit destructive cleanup"
source_blocks:
  - "Block B — Preserve partials / prohibit destructive cleanup"

description: >
  Remove all destructive cleanup from failure/cancellation/merge-failure/token-refresh
  paths in the segment and yt-dlp downloaders. Partial artifacts (.part, .part-Frag*,
  .ytdl, segment directories) must survive every non-success exit so resume is
  possible. Successful merge cleanup is retained only after a verified merge.
  Scope is strictly Block B: no workspace (D), checkpoint (E), quality (F),
  state machine (G), FFmpeg transport (H), or progress (I) changes.

goals:
  - download_hls_with_resume never calls _cleanup_segments on failure, cancellation,
    timeout, disk-full, merge failure, or token refresh failure.
  - _tally_and_merge removes segment files only after a successful merge; never on
    an unverified or failed merge.
  - download_with_ytdlp_with_resume_fallback never unlinks .part after max retries.
  - _attempt_segment_resume never unlinks an existing yt-dlp .part when switching
    to the segment backend.
  - A missing or zero-size .part is not treated as proof that no recoverable
    .part-Frag*, .ytdl, or segment-directory artifacts exist.
  - Cancellation (CancelledError/BaseException) propagates without cleanup masking
    the original exception.

files:
  - path: src/vkdownloader/services/segment_downloader.py
    targets:
      - type: function
        name: download_hls_with_resume
      - type: function
        name: _tally_and_merge
      - type: function
        name: _log_preserve_segments
      - type: function
        name: _cleanup_segments
    semantic_anchors:
      insert_after:
        type: function_definition
        value: download_hls_with_resume
      insert_before:
        type: return_statement
        value: "return None  # non-success path inside download_hls_with_resume"
      notes: >
        Modify the finally block of download_hls_with_resume: keep _log_preserve_segments
        (logging only), remove the _cleanup_segments call. Remove the `success`-gated
        deletion entirely; success-path cleanup remains in _tally_and_merge only after
        a truthy merge result. Do not catch BaseException in a way that swallows
        CancelledError.

  - path: src/vkdownloader/services/ytdlp_downloader.py
    targets:
      - type: function
        name: download_with_ytdlp_with_resume_fallback
      - type: function
        name: _attempt_segment_resume
      - type: function
        name: _ytdlp_temp_name
    semantic_anchors:
      insert_after:
        type: function_definition
        value: _ytdlp_temp_name
      notes: >
        Add a small helper _has_recoverable_ytdlp_artifacts(output_file) next to
        _ytdlp_temp_name. Use it in download_with_ytdlp_with_resume_fallback's
        partial-file probe instead of `temp_file.exists() and size > 0`. Remove the
        max-retries unlink block. Remove the _ytdlp_temp_name(...).unlink() call in
        _attempt_segment_resume. Guard the stat() used for logging so a missing
        temp file does not raise.

changes:
  - action: modify_code
    description: >
      download_hls_with_resume: in the finally block, call _log_preserve_segments
      only; delete the _cleanup_segments invocation. Preserve the `success` flag
      semantics for return value, but no deletion on any path. Ensure CancelledError
      and other BaseException subclasses propagate after logging.
    code_hint: |
      success = False
      try:
          result = await _run_download_session(...)
          if result is not None:
              success = True
              return result
          return None
      finally:
          if not success:
              _log_preserve_segments(segments_dir)
              # NOTE: no _cleanup_segments call — partials are preserved for resume.

  - action: modify_code
    description: >
      _tally_and_merge: retain _cleanup_segments(segments_dir) ONLY inside the
      `if result:` branch after _merge_segments_batched succeeds. Confirm no
      cleanup on failed-segment or count-mismatch paths (already absent).
    code_hint: |
      if downloaded_count == len(segments):
          result = await _merge_segments_batched(segments_dir, output_file, len(segments))
          if result:
              _cleanup_segments(segments_dir)
          return result
      return None

  - action: add_code
    description: >
      Add _has_recoverable_ytdlp_artifacts(output_file) helper returning True when
      any of: non-empty .part, any .part-Frag*, any .ytdl, or a non-empty segment
      directory for that output exist. Used to avoid treating a missing/zero-size
      .part as proof of no recoverable data.
    code_hint: |
      def _has_recoverable_ytdlp_artifacts(output_file: Path) -> bool:
          temp_file = _ytdlp_temp_name(output_file)
          try:
              if temp_file.exists() and temp_file.stat().st_size > 0:
                  return True
          except OSError:
              pass
          parent = output_file.parent
          if any(parent.glob(output_file.name + ".part-Frag*")):
              return True
          if any(parent.glob(output_file.name + ".ytdl")):
              return True
          segments_dir = output_file.parent / f".{output_file.stem}_segments"
          try:
              if segments_dir.exists() and any(segments_dir.iterdir()):
                  return True
          except OSError:
              pass
          return False

  - action: modify_code
    description: >
      download_with_ytdlp_with_resume_fallback: replace the partial-file probe
      `if not temp_file.exists() or temp_file.stat().st_size == 0: return None`
      with `if not _has_recoverable_ytdlp_artifacts(validated_output): return None`.
      Remove the max-retries unlink block (temp_file.unlink) and instead log that
      partials are preserved. Do not delete .part, fragments, or .ytdl.
    code_hint: |
      if not _has_recoverable_ytdlp_artifacts(validated_output):
          return None
      ...
      # All retries exhausted without success
      logger.error("max_retries_exceeded", ...)
      logger.info("preserving_ytdlp_partials", path=str(validated_output))
      return None

  - action: modify_code
    description: >
      _attempt_segment_resume: remove the `_ytdlp_temp_name(output_file).unlink()`
      call and its comment. Preserve the yt-dlp partial. Guard the stat() used in
      the "download_interrupted_switching_to_segments" log so a missing temp file
      reports size 0 instead of raising. Update the docstring to state that partials
      are preserved, not discarded.
    code_hint: |
      temp_file = _ytdlp_temp_name(output_file)
      try:
          partial_size = temp_file.stat().st_size if temp_file.exists() else 0
      except OSError:
          partial_size = 0
      logger.warning(
          "download_interrupted_switching_to_segments",
          ...,
          size=partial_size,
      )
      ...
      # Preserve the yt-dlp partial; do NOT unlink it. The segment backend runs
      # in its own workspace and leaves the original artifact untouched.

