# Implementation task for P12-B10
# Block 10 in execution order (after P12-B1, which is already committed)
# Source plan: .ai/plans/12-filesystem-artifacts-audit-fixes_fix.md §6.10
# Decision A — closed. PoO chose option (b): separate resolution phase
# in batch_downloader before fan-out.

id: p12-b10

title: P12-B10 — deduplicate by resolved output filename, before dispatch (ART-006, Decision A)

priority: high

depends_on:
  - p12-b1   # B10 → B2 edge: pre-pass is the place the warning fires

status: done

assignee: Implementer

# ── Plan / Audit source ──
source_reference: .ai/plans/12-filesystem-artifacts-audit-fixes_fix.md
source_section: "§6.10 P12-B10 — dedup by resolved output filename, before dispatch"
source_audit_section: "§10 P12-B10 Auditor context (context_a)"

# ── Task description (returned to Tech Lead) ──
description: >
  Replace the single-URL-string `seen_urls` dedup inside the fill-phase loop
  with a two-tier dedup scheme: Tier 1 (exact-URL, already present) is KEEPT
  as-is; Tier 2 (resolved-output-filename) is ADDED as a separate resolution
  phase that runs before the fan-out.

  Decision A is closed: dedup by resolved output filename BEFORE any media
  dispatch; the LAST occurrence in list order wins; earlier occurrences are
  skipped, reported via ProgressStatus.SKIPPED, and must not perform any media
  transfer (no dispatch, no permit, no subprocess, no segment fetch, no .part,
  no working tree).

  PoO decision: option (b) — a separate resolution phase in
  `batch_downloader._run_batch_with_progress` that extracts and resolves every
  URL, builds a filename→index registry (last-wins), and dispatches only
  survivors. The extraction for each entry is performed once and handed forward
  to `download_video` via new `video_data` / `selected_stream` parameters so
  that the dispatched survivor does not re-extract.

  The single-URL `download` command is unchanged and does not carry a
  registry.

# ── Goals ──
goals:
  - Two entries resolving to the same output path → exactly one dispatch, and it is the LAST in list order
  - A skipped entry performs no media transfer (no dispatch, no permit, no subprocess, no segment fetch, no .part, no working tree)
  - The skip is visible through existing channels: ProgressStatus.SKIPPED in results, and a dedup summary line distinct from the invalid-URL line
  - The dedup key is the resolved output path — both directions: sanitised-title collisions ARE deduped; same id with different output_index and no title are NOT
  - Idempotence on re-run (dedup is a function of the list, not of the filesystem)
  - The single-URL `download` command is unchanged and does not carry a registry
  - The mkdir side effect (C9) is asserted, not assumed: _resolve_output_file creates the output directory for every resolved entry including skipped ones
  - Existing bounded-fan-out and semaphore tests pass unchanged
  - No media transfer occurs for a skipped entry — asserted by patching each transfer surface and asserting not-called

# ── Implementation sequence ──
implementation_sequence:
  - phase: 1
    step: 1
    action: modify_production
    target: services/downloader.py → download_video → signature
    description: >
      Add `video_data: VideoWithStreams | None = None` and `selected_stream:
      Stream | None = None` as keyword-only parameters to `download_video`.
      When BOTH are provided, skip the `extractor.extract_streams(url)` call
      and use the pre-extracted `video_data` directly, mirroring the existing
      contract in `perform_download` (params at downloader.py:141-142,
      used at 195-197: `if video_data is not None and selected_stream is not
      None: streams = video_data.streams; m3u8_url = str(selected_stream.url)`).
      Update the docstring to document the new params and the skip-extraction
      behaviour. This is B10's sole write to `download_video` (plan row 18b).

  - phase: 1
    step: 2
    action: modify_production
    target: services/downloader.py → download_video → extraction site
    description: >
      Reorder the pipeline so that when pre-extracted data is provided,
      `extract_streams` is NOT called, but the title_callback still fires
      with the sanitized title from the pre-extracted video_data. The
      stream selection (`selector.select`) and `_resolve_output_file` must
      still run on the pre-extracted data. When neither param is provided,
      behaviour is identical to today (extract_streams, then proceed).

  - phase: 2
    step: 3
    action: modify_production
    target: services/batch_downloader.py → _run_batch_with_progress → pre-pass
    description: >
      Insert a resolution phase before the fill-phase loop. For each URL in
      `urls`, call `VKVideoExtractor.extract_streams(url)` to obtain the
      `VideoWithStreams` (title + id), then call `_resolve_output_file(video,
      output, settings, output_index)` to obtain the resolved Path. Record
      the mapping `resolved_path → index` in a dict with LAST-WINS semantics
      (later entries overwrite earlier ones). Entries that lose the collision
      are terminalised as `by_index[i] = (url, "", ProgressStatus.SKIPPED.value)`
      and reported via `reporter.start_task(i)` + `reporter.finish_task(i,
      ProgressStatus.SKIPPED)` — BEFORE any `asyncio.create_task`.
      Survivors (last occurrence of each resolved path) carry their
      pre-extracted `video_data` and `selected_stream` forward for dispatch.

  - phase: 2
    step: 4
    action: modify_production
    target: services/batch_downloader.py → _download_single → dispatch wiring
    description: >
      Extend `DownloadContext` with optional `video_data: VideoWithStreams |
      None` and `selected_stream: Stream | None` fields. Thread them through
      `_download_single` into the `download_video(...)` call so the survivor
      does not re-extract. Survivors that have no pre-extracted data (should
      not occur in the pre-pass, but kept as a fallback for the existing
      non-dedup path) follow the current extract-then-download behaviour.
      The `output_index` passed to `download_video` must match the one the
      pre-pass used for resolution, so the survivor's resolved path matches
      the key the dedup ran on.

  - phase: 3
    step: 5
    action: modify_production
    target: services/batch_downloader.py → _download_single → download_video call
    description: >
      Forward `video_data` and `selected_stream` from the DownloadContext into
      the `download_video(...)` call. The single dispatch point must consult
      the registry implicitly — only survivors reach this point because the
      pre-pass terminalised losers before task creation. Assert this by
      structure: no `asyncio.create_task` is created for a skipped index.

  - phase: 4
    step: 6
    action: modify_production
    target: models/enums.py → ProgressStatus docstring
    description: >
      Update the `SKIPPED` docstring (currently says "produced by the
      batch-level dedup check ... when an exact-URL duplicate is detected").
      It must now state that SKIPPED is produced by BOTH the exact-URL
      dedup (Tier 1) and the filename-collision dedup (Tier 2, Decision A).
      This is the only change to enums.py; the enum member itself is NOT
      redefined — it already exists and is already wired into the progress
      display at progress_display.py:92 (ProgressStatus.SKIPPED → ⊘).

  - phase: 4
    step: 7
    action: verify_production
    target: services/batch_downloader.py → _print_batch_summary
    description: >
      Confirm the existing four-bucket accounting (successful, cancelled,
      skipped, failed) already isolates ProgressStatus.SKIPPED into its own
      bucket and renders "Skipped (duplicates): {count}" as a distinct line
      from "Skipped (invalid URLs): {skipped_count}". No new reporting
      channel is invented — the summary already has the spine; the filename-
      dedup skip just needs to populate the existing SKIPPED bucket. Verify
      by reading the code, not by assuming.

  - phase: 5
    step: 8
    action: add_tests
    target: tests/test_cli.py → TestBatchCommand
    description: >
      Add the oracle set for filename-collision dedup. The whole oracle set
      is new (§2.5 confirms no existing test asserts anything about duplicates
      beyond exact-URL). Reuse the existing perform_download mock fixture
      shape (MagicMock with id, title, streams). Five test methods:
      (a) two entries resolving to same path → exactly one dispatch and it
          is the last; (b) skipped entry: no media transfer — patch
          download_video/perform_download/subprocess/segment fetch and
          assert not-called for the skipped index; (c) skip visible at both
          levels — ProgressStatus.SKIPPED in results and a distinct dedup
          summary line; (d) key is resolved path both directions — sanitised-
          title collision deduped, same-id-different-index-no-title NOT
          deduped; (e) idempotence on re-run.

  - phase: 5
    step: 9
    action: add_tests
    target: tests/test_batch_downloader.py (extension of TestBatchDedupSkip)
    description: >
      Extend the existing TestBatchDedupSkip class with the filename-collision
      no-transfer assertions. The existing tests patch RichProgressReporter
      and stub download_video — they do NOT assert that no extraction / media
      transfer ran for the skipped entry. B10's filename-dedup oracle must add
      the no-transfer not-called assertions layered on top: patch
      download_video's internal extract_streams and perform_download for the
      batch path and assert they are NOT called for a filename-collision
      skip. Also assert the mkdir side effect (C9): the output directory
      exists for a skipped entry.

  - phase: 5
    step: 10
    action: add_tests
    target: tests/test_cli.py → TestBatchCommand (single-URL regression)
    description: >
      Add one test asserting the single-URL `download` command does not carry
      a registry and produces no SKIPPED status for a single URL. This
      pins §6.10 acceptance criterion 6.

  - phase: 5
    step: 11
    action: verify
    target: standing gate §7.1
    description: >
      Run pytest, ruff check src tests, ruff format --check src tests,
      mypy src, mypy src tests, ruff check . — confirm G1/G2/G4/G6 exit 0,
      G5 non-increasing, G3 unchanged from green at 12af960, skip count 3 at
      rest. Re-measure skip composition at execution time (§10.0 B10's own
      gate accounting): the plan §7.1 names the D-11 oracles, but the live
      skip set is three POSIX-only killpg tests. Do not inherit §2.0's
      "3 at rest" wording without confirming the live composition.

# ── Architectural constraints ──
architectural_constraints:
  two_tier_dedup: >
    Tier 1 (exact-URL, via seen_urls) is KEPT unchanged inside the fill-phase
    loop. Tier 2 (resolved-output-filename) is ADDED as a pre-pass BEFORE
    the fill-phase loop. The existing URL dedup must not be removed — it
    prevents redundant network calls for true duplicate URLs (Decision A says
    "no media transfer for skipped"; an exact-URL duplicate is the cheapest
    case and stays). The filename dedup is the NEW tier that closes ART-006.

  batch_only: >
    The pre-pass lives in `_run_batch_with_progress` (batch_downloader.py),
    invoked only from `run_batch`. The single-URL `download` command calls
    `download_video` directly with `output_index=0`, no semaphore, no reporter,
    no dedup. It must NOT gain a registry, must NOT call the pre-pass, and
    must NOT produce SKIPPED for a single URL.

  last_wins: >
    The registry is `dict[Path, int]` mapping resolved output path to the
    index of the LAST occurrence in list order. When a collision is detected
    (a path already in the registry), the earlier entry (the current registry
    value) is terminalised as SKIPPED and the registry is overwritten with
    the new index. Survivors are dispatched exactly once; the survivor is
    always the last occurrence.

  no_media_transfer_for_skipped: >
    A skipped entry (whether Tier 1 URL or Tier 2 filename collision) must not
    trigger any media transfer: no asyncio.create_task, no download_video
    dispatch, no semaphore permit acquired, no yt-dlp subprocess spawned,
    no segment fetch, no .part file, no working tree. This is the substance
    of Decision A's "no network at all" clause as it is achievable (§3.8,
    §5.1 I10). The pre-pass must terminalise losers BEFORE task creation.

  key_is_resolved_path: >
    The dedup key is the resolved Path returned by _resolve_output_file,
    NOT (title, id). Two reasons: (1) different titles can sanitise to the
    same filename (e.g. "a?b" and "a:b" both → "a_b"), so a (title, id) key
    would miss the collision; (2) output_index discriminates same-id entries
    with different indices and no title — a (title, id) key would over-dedup
    those. The resolved path gets it right for free.

  output_index_preservation: >
    output_index is the positional enumerate index, not a survivor count.
    After dedup, survivors keep their original enumerate indices so that
    `by_index[i]` ordering and `results = [by_index[i] for i in range(len(urls))]`
    restoration at batch_downloader.py:420 still work. Only the dispatched
    tasks are created; skipped indices are terminalised in by_index directly.

  existing_reporting_reused: >
    ProgressStatus.SKIPPED already exists in enums.py:103 and is wired into
    the progress display at progress_display.py:92 (→ ⊘ glyph). _print_batch_summary
    already renders "Skipped (duplicates): {count}" as a distinct line from
    "Skipped (invalid URLs): {skipped_count}". No new reporting channel is
    invented; no new exception-to-status mapping is added. _map_exception_to_status
    in exceptions.py:216 is NOT the vehicle (a dedup skip is not an exception)
    and must NOT be touched.

  read_only_anchors: >
    _resolve_output_file (utils/security.py) is READ for its resolved Path output;
    it is NOT modified by B10 (Decision A disambiguates no names, so no suffix
    is added; the function's composition is unchanged). perform_download already
    accepts video_data / selected_stream (downloader.py:141-142, C10) — the
    contract already exists; B10 just extends it to the download_video entry
    point so the batch path can hand the buffered extraction forward.

  mkdir_side_effect_asserted: >
    _resolve_output_file calls validated_output.mkdir(parents=True, exist_ok=True)
    for EVERY entry it is called on (security.py:112, C9). A skipped entry's
    output directory is still created. The directory is shared by every entry
    in the batch, so this is harmless but observable — it must be ASSERTED in
    a test, not assumed. On Windows, if the resolved path exists as a file,
    FileExistsError [WinError 183] can be raised (exist_ok=True does not
    suppress it); this is I7, recorded and asserted, not silently handled.

  no_name_mutex: >
    A name-level mutex for within-batch collisions is structurally impossible
    after Decision A and therefore NOT introduced. Unique resolved paths by
    construction (the dedup key IS the path), one permit per survivor, output
    file computed before the permit is taken, and .part derived from the output
    path means no two concurrently dispatched tasks can share a name. No lock
    file, no lock primitive. The cross-run case is a recorded residual (§5.7
    item 4), not solved here. The plan's prohibition on os.replace durability
    assumptions (C5) still applies.

  no_new_import_cycle: >
    batch_downloader.py already imports download_video from services.downloader
    (line 30). The pre-pass needs VKVideoExtractor — check whether it is already
    accessible. _resolve_output_file is already imported in downloader.py
    (line 23). No new import may introduce a cycle; C1/C2 govern any new
    dependency.

