    changes:
      - action: add_code
        target: _run_batch_with_progress
        description: >
          Insert a resolution phase before the fill-phase loop. For each
          URL, call VKVideoExtractor.extract_streams to obtain the
          VideoWithStreams, then _resolve_output_file to obtain the key.
          Build a dict[Path, int] with last-wins semantics. Terminalise
          losers as (url, "", SKIPPED.value) via reporter.start_task +
