# ── Required tests ──
required_tests:
  acceptance_criteria_mapped: >
    The 9 acceptance criteria from §3.8 are mapped to test cases below.

  criterion_1_last_dispatcher: >
    Test: test_dedup_filename_collision_dispatch_only_last.
    Two entries resolving to the same output path produce EXACTLY ONE dispatch,
    and it is the LAST in list order. Assert both dispatch call count (==1)
    AND the identity of the dispatched entry (the last URL's index).

  criterion_2_no_media_transfer: >
    Test: test_dedup_filename_collision_skipped_entry_no_transfer.
    A skipped entry performs NO media transfer — no dispatch, no permit, no
    subprocess, no segment fetch, no .part, no working tree. Patch each of
    these surfaces and assert not-called for the skipped entry. This is the
    load-bearing clause from Decision A — it gets an explicit oracle rather
    than an inference from the dispatch count.

  criterion_3_visible_at_both_levels: >
    Test: test_dedup_filename_collision_visible_in_results_and_summary.
    Skip visible at both levels: ProgressStatus.SKIPPED in the results list
    (per-item), and a "Skipped (duplicates):" summary line DISTINCT from the
    "Skipped (invalid URLs):" line. Both asserted.

  criterion_4_key_is_resolved_path: >
    Test: test_dedup_key_sanitised_title_collision_deduped — different titles
    that sanitise to the same filename ARE deduped (assert exactly one
    dispatch, the last).
    Test: test_dedup_key_same_id_different_index_no_title_not_deduped —
    same id, different output_index, no title are NOT deduped (assert both
    dispatch, two distinct output paths).
    Both directions assert the key is the resolved path, not (title, id).

  criterion_5_idempotence: >
    Test: test_dedup_filename_collision_idempotent_on_rerun.
    Running the same URL file into the same directory twice: the same entries
    are skipped, the same one dispatches. Dedup is a function of the list, not
    of the filesystem.

  criterion_6_single_url_unchanged: >
    Test: test_single_url_download_no_registry.
    The single-URL download command is unchanged and does not carry a
    registry. Assert no SKIPPED status is produced for a single URL and
    that download_video is called exactly once.

  criterion_7_bounded_fanout_unchanged: >
    Existing tests TestBatchDownloaderSemaphore, TestBatchLiveTaskBounding,
    and the bounded-fan-out classes in test_segment_downloader.py (TestSegmentFanoutCompletion,
    TestSegmentFanoutBoundedProduction, TestConnectorCeilingsFollowTheSetting)
    must pass UNCHANGED. B10 changes WHAT is dispatched, not HOW it is bounded.
    These are regression guards, not new additions.

  criterion_8_mkdir_side_effect: >
    Test: test_dedup_filename_collision_mkdir_side_effect (in TestBatchCommand).
    The _resolve_output_file mkdir side effect (C9) is asserted: every resolved
    entry — including a skipped one — has its output directory created. Assert
    the directory exists for a skipped entry and that it is the shared batch
    directory.

  criterion_9_gate_accounting: >
    The standing gate §7.1: G1/G2/G4/G6 exit 0, G5 non-increasing, G3
    unchanged (green at 12af960 per §10.0), skip count 3 at rest. B10 adds
    one test so the skip count is 4 inside B10's commit and returns to 3 at
    rest (per §2.1 rule 2). Re-measure skip composition at execution time
    — the live three skips are POSIX-only killpg tests, NOT the D-11 oracles
    the plan's §7.1 names.

  no_new_tests_for_legacy: >
    Do NOT write any test that asserts against _map_exception_to_status output.
    That function has zero production call sites and is not the vehicle for a
    dedup skip. The TestMapExceptionToStatus class in tests/test_exceptions.py
    pins the legacy format and is not extended.

  existing_dedup_tests_unaffected: >
    TestBatchDedupSkip's two existing tests (test_duplicate_url_marked_skipped_not_downloaded,
    test_duplicate_skip_summary_reports_skipped_not_failed) test exact-URL (Tier 1)
    dedup. They must pass UNCHANGED — B10 augments, does not replace, Tier 1.
    TestBatchSummarySkippedAggregation's test must also pass unchanged.

# ── Honest judgement required ──
honest_judgement:
  pre_pass_shape:
    question: >
      Option (a) — per-entry pre-pass inside download_video, registering
      each entry's resolved path as it resolves and being told whether it
      survives; vs. option (b) — a separate resolution phase in
      batch_downloader before the fan-out that resolves all entries first,
      then dispatches survivors only.
    criterion: >
      Decision A's "must not load the network at all" clause: under (a) every
      entry is extracted regardless (the registry must see the path before
      knowing if it survives), so (a) extracts every URL. Under (b) extraction
      for every entry completes before any download starts — the two are
      equivalent on extraction count, but (b) gives the registry a clean
      lifetime and is the shape in which "no media transfer for skipped" is
      even approximately true. The plan records this as an open choice and
      notes that a strict no-network reading forces (b).
    resolution: >
      PoO decision recorded in §3.8: option (b). The pre-pass is a separate
      resolution phase in batch_downloader._run_batch_with_progress before
      the fill-phase fan-out. Extraction for every entry completes before any
      download starts; this changes the batch's latency profile (the screen
      shows resolution for all N, then downloads) and needs its own bounding
      decision — extraction is currently interleaved with downloads under the
      shared semaphore. The Implementer must decide whether extraction needs
      its own bounding (it is currently gated by the per-video semaphore
      inside download_video → perform_download, but the pre-pass extracts
      before that gate). This is R9 in §5.1.
    commit_body_note: >
      The commit body must record the pre-pass shape chosen and, if the
      no-network clause was narrowed to "no media transfer", that narrowing
      and why.

  no_network_clause_conflict:
    question: >
      download_video calls extract_streams BEFORE _resolve_output_file, so the
      resolved filename is not knowable without a network call (title and id
      arrive with the extraction). Decision A's key and a literal "no network
      at all" reading are jointly unsatisfiable.
    resolution: >
      This is DEF-6, already escalated to the Product Owner. B10 delivers the
      achievable form — no MEDIA TRANSFER for a skipped entry — and records
      the gap. The commit body must state that the no-network clause is
      narrowed to "no media transfer" and why: the resolved filename requires
      title and id, which arrive via extract_streams (downloader.py:324),
      which is itself a metadata fetch, not a media transfer.

  mkdir_risk:
    question: >
      _resolve_output_file calls mkdir(parents=True, exist_ok=True) for every
      entry (security.py:112, C9). A skipped entry's output directory is still
      created. On Windows, if the resolved path exists as a file,
      FileExistsError [WinError 183] can be raised (exist_ok=True does not
      suppress it).
    resolution: >
      The directory is shared by every entry in the batch, so the mkdir for
      a skipped entry is harmless in practice. The Implementer must assert
      this in a test (C9), not assume it. The FileExistsError-on-file case is
      recorded as I7 in §5.1 — it is out of scope for B10 (no refusal,
      Decision B) but must be documented in the commit body if observed.

  pre_pass_extraction_bounding:
    question: >
      Under option (b), the pre-pass extracts every entry before any download
      starts. Extraction currently runs inside download_video → performer_download
      under the shared per-video semaphore. The pre-pass extracts outside that
      semaphore.
    resolution: >
      The pre-pass runs extraction sequentially (or with its own lightweight
      bounding if needed). Extraction is a metadata call, not a media transfer,
      so it does not count toward "max_concurrent_downloads" (C6 — that semaphore
      bounds video downloads, not extractions). However, the Implementer must
      decide: does the pre-pass need its own concurrency bound? The plan says
      "needs its own bounding decision" (§3.8 line 588). At minimum, the pre-pass
      must not deadlock or exceed reasonable memory for very large batches.

  test_mock_shape:
    question: >
      The existing TestBatchCommand tests use MagicMock(id=..., title="Test
      Title", streams=[MagicMock(quality="720")]) for perform_download. A
      filename-collision oracle must make two URLs yield equal sanitized_title
      + equal id.
    resolution: >
      Reuse the existing mock fixture shape — two MagicMocks with the same
      id and titles that sanitise to the same safe_title (e.g. "Title?A" and
      "Title:A" both → "Title_A"). The mock for extract_streams (already
      patched in existing tests as VKVideoExtractor.extract_streams) must
      return these per-URL. Do NOT invent a new reader mock.

# ── Deliverable ──
deliverable:
  shape: One commit
  scope: >
    src/vkdownloader/services/downloader.py (download_video param addition +
    skip-extract) + src/vkdownloader/services/batch_downloader.py (pre-pass
    + dispatch wiring + DownloadContext fields + docstring) +
    src/vkdownloader/models/enums.py (SKIPPED docstring update only) +
    tests/test_cli.py (TestBatchCommand extensions: 7 new test methods) +
    tests/test_batch_downloader.py (TestBatchDedupSkip extensions: 2 new test
    methods)
  commit_constraints:
    - One commit only
    - No test in TestBatchDedupSkip, TestBatchSummarySkippedAggregation,
      TestBatchDownloaderSemaphore, TestBatchLiveTaskBounding, or any
      bounded-fan-out class is edited — only extended with new methods
    - _map_exception_to_status (exceptions.py:216) is NOT touched
    - _resolve_output_file (security.py) is NOT modified
    - The single-URL download() command is NOT modified
    - perform_download's existing video_data/selected_stream contract is NOT
      changed (only download_video gains the params)
    - No new lock file, no temp-dir abstraction, no fsync, no clobber policy,
      no name suffix, no temp sweep (C5, C7)
    - Commit subject: "fix(batch): deduplicate by resolved output filename
      before dispatch" or equivalent behaviour-describing subject
    - Commit body names: (1) the pre-pass shape (option b), (2) the mkdir
      side effect (C9), (3) the narrowing of the no-network clause to "no
      media transfer" and why, (4) any edited or preserved existing tests

