files:
  - path: src/vkdownloader/services/downloader.py
    targets:
      - type: function
        name: download_video
    semantic_anchors:
      signature:
        type: function_signature
        match: "async def download_video("
        description: >
          The shared orchestration entry for single and batch download.
          Currently accepts no pre-extracted data — always calls
          extract_streams at downloader.py:324. Must gain video_data and
          selected_stream keyword-only params.
      extraction_call:
        type: function_call
        match: "await extractor.extract_streams(url)"
        description: >
          Line 324. Must be skipped when both video_data and selected_stream
          are provided. The title_callback invocation at line 326-327 must
          still fire using video_data.title.
      resolve_call:
        type: function_call
        match: "_resolve_output_file(video, output, settings, output_index)"
        description: >
          Line 345. Must run on the pre-extracted video_data when provided,
          and the result must be the same Path the pre-pass key is derived
          from.
      perform_download_call:
        type: function_call
        match: "perform_download(url, str(quality), output_file, method, extractor, settings,"
        description: >
          Line 347. Already forwards video_data=video and selected_stream=stream
          (lines 357-358 when data comes from extract_streams). When pre-extracted
          data is provided, must forward it instead.
    changes:
      - action: modify_code
        target: signature
        description: >
          Add `video_data: VideoWithStreams | None = None` and
          `selected_stream: Stream | None = None` as keyword-only params
          (after `title_callback`).
      - action: modify_code
        target: extraction_call
        description: >
          Wrap the extract_streams call in `if video_data is None or
          selected_stream is None:` — exactly mirroring perform_download's
          guard at downloader.py:195. When skipped, use video_data directly.

  - path: src/vkdownloader/services/batch_downloader.py
