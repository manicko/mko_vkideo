# ── Required tests ──
required_tests:
  six_tests_unchanged: >
    TestSanitizeFilenameComponent's (formerly TestSanitizeTitle's) six existing
    tests stay green unchanged — same assertions, same expected values. Only the
    function name reference changes.
  edge_cases_unchanged: >
    TestValidateOutputPathEdgeCases (3 tests) pass unchanged.
  import_graph_unchanged: >
    test_package_root_does_not_reexport_symbols passes with the updated symbol name.
  behavior_preserved: >
    The function's output for any given input is byte-for-byte identical to
    before the rename.

# ── Honest judgement required ──
honest_judgement:
  question: >
    Option (a) — rename the utility to make the contract honest (no behavior change)
    vs. option (b) — make it a real sanitiser (strip/prefix device names, strip trailing dots).
  criterion: >
    Is a second, non-appending caller foreseeable? Verified: the only filesystem-
    facing call site (_resolve_output_file) always appends `_{video.id}.mp4`. The
    display caller (downloader.title_callback) does not write to the filesystem.
    The suffix invariant is real. Prefer (a) — it removes the misleading name without
    changing any output. Choose (b) only with explicit acceptance that the display
    string changes.
  resolution: >
    Option (a) chosen. The suffix invariant is real. No second non-appending
    filesystem caller exists. The rename makes the contract honest without
    altering any behavior.

