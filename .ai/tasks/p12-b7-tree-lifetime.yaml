assignee: Implementer

# ── Plan / Audit source ──
source_reference: .ai/plans/12-filesystem-artifacts-audit-fixes_fix.md
source_section: "§3.5 P12-B7 — the working tree's lifetime"
source_spec_section: "§6.7 P12-B7 — the working tree's lifetime"
source_audit_section: "§9 P12-B6 Auditor context"

# ── Task description ──
description: >
  The segment working directory (segments_dir) is currently created before the
  playlist is fetched and removed only after a successful merge. B7 changes this:
  (1) create the tree only after the playlist is parsed and segments enumerated,
  (2) remove the tree on every non-success exit — not only after a merge-stage
  failure, but also on playlist-fetch failure, fan-out failure, and FileNotFoundError
  from the merge's existence check.

  The shared insertion point is download_hls_with_resume's finally block.

# ── Goals ──
goals:
  - segments_dir.mkdir moved from download_hls_with_resume to inside _run_download_session, after playlist parse
  - finally block in download_hls_with_resume calls _cleanup_segments on non-success exits
  - No working directory exists before the playlist is parsed
  - Every non-success exit removes the tree
  - Merge success path unchanged (tree removed after successful merge)
  - TestPreserveSegmentsReporter's three tests pass unchanged
  - Bounded fan-out tests pass unchanged

# ── Implementation sequence ──
implementation_sequence:
  - step: 1
    action: modify_code
    target: _run_download_session
    description: >
      Add segments_dir.mkdir(parents=True, exist_ok=True) after the
      `logger.info("found_segments", count=len(segments))` line and before
      _clear_stale_segments(segments_dir, segments). Update _run_download_session's
      docstring to note it creates the tree.
  - step: 2
    action: modify_code
    target: download_hls_with_resume
    description: >
      Remove the segments_dir.mkdir(parents=True, exist_ok=True) call (line 1215).
      Extend the finally block to call _log_preserve_segments then _cleanup_segments
      on non-success exits. Update docstring to describe the tree lifetime.

  - step: 3
    action: add_tests
    target: tests/test_segment_downloader.py
    description: >
      Add TestTreeLifetime class with 4 oracles:
      (a) test_no_tree_before_playlist_parsed — _fetch_playlist_with_retry
      returns None → segments_dir does not exist.
      (b) test_tree_removed_after_failed_session — session returns None → tree
      cleaned up.
      (c) test_tree_removed_after_merge_failure — exception in
      _process_downloaded_segments → tree cleaned up, exception propagates.
      (d) test_tree_removed_after_file_not_found — FileNotFoundError in
      _process_downloaded_segments → tree cleaned up, exception propagates.

  - step: 4
    action: verify
    target: standing gate §7.1
    description: Run pytest, ruff check, ruff format, mypy, full suite.

# ── Architectural constraints ──
architectural_constraints:
  single_insertion_point: >
    Option (a) from §3.5: one removal point in download_hls_with_resume's finally,
    extended to remove rather than report. The operator never wants the tree
    preserved — today the only failure action is a log record, nothing reads
    the tree.
  report_before_cleanup: >
    _log_preserve_segments runs BEFORE _cleanup_segments in the finally block.
    The reporter sees the tree's state as-is, then _cleanup_segments removes it.
    TestPreserveSegmentsReporter tests _log_preserve_segments directly and is
    unaffected by ordering.
  no_new_call_sites_in_cleanup_segments: >
    _cleanup_segments is still called under if result: in _tally_and_merge
    (line 875) AND now also in download_hls_with_resume's finally. B6 added the
    is_file() guard; B7 uses it at the new call site.
  do_not_touch: >
    _clear_stale_segments short-circuit, _tally_and_merge count, _merge_segments_batched
    logic, any count gate. TestPreserveSegmentsReporter UNCHANGED. Bounded fan-out
    classes UNCHANGED.
  no_new_imports: >
    _cleanup_segments and _log_preserve_segments are already imported at the top
    of segment_downloader.py (same module).

# ── Files ──
files:
  - path: src/vkdownloader/services/segment_downloader.py
    targets:
      - type: function
        name: download_hls_with_resume
      - type: function
        name: _run_download_session
      - type: function
        name: _cleanup_segments
    changes:
      - action: modify_code
        target: _run_download_session
        description: Add segments_dir.mkdir after playlist parse, before _clear_stale_segments.
      - action: modify_code
        target: download_hls_with_resume
        description: Remove mkdir from here; extend finally to call _cleanup_segments.

  - path: tests/test_segment_downloader.py
    changes:
      - action: add_test_class
        description: TestTreeLifetime with 4 oracle methods.

# ── Required tests ──
required_tests:
  no_tree_before_playlist_parsed: >
    _fetch_playlist_with_retry returns None → segments_dir does not exist.
    This is the strongest oracle: fails if mkdir stays in download_hls_with_resume.
  tree_removed_after_failed_session: >
    _process_downloaded_segments returns None → tree is cleaned up by finally.
  tree_removed_after_merge_failure: >
    _process_downloaded_segments raises → tree is cleaned up, exception propagates.
  tree_removed_after_file_not_found: >
    _process_downloaded_segments raises FileNotFoundError → tree cleaned up.
  preserve_reporter_unchanged: >
    TestPreserveSegmentsReporter's 3 tests green, unchanged.
  bounded_fanout_unchanged: >
    TestSegmentFanoutCompletion, TestSegmentFanoutBoundedProduction,
    TestConnectorCeilingsFollowTheSetting all green, unchanged.

# ── Honest judgement required ──
honest_judgement:
  removal_point:
    question: >
      One removal point in download_hls_with_resume's finally, or three points at
      the layer that knows why it failed (_run_download_session, _process_downloaded_segments, _tally_and_merge)?
    criterion: >
      Does the operator ever want the tree preserved for manual inspection? Today
      the only failure action is a log record telling them to clear the directory —
      nothing reads the tree. That argues for the single point.
    recommendation: >
      Single removal point in finally. Smallest diff, matches existing structure.

  reporter_count_before_cleanup:
    question: >
      If the tree is removed before the reporter runs, working_dir_ts_count reads 0.
      Should the reporter move with the removal?
    criterion: >
      Run _log_preserve_segments BEFORE _cleanup_segments. The reporter sees the
      actual count; then cleanup removes the tree. TestPreserveSegmentsReporter
      tests _log_preserve_segments directly and is unaffected.
    recommendation: >
      Report before cleanup. No reporter relocation needed. This is declared in
      the commit body.

  signature_short_circuit:
    question: >
      Does the .ts.tmp sweep in _clear_stale_segments need to run even when the
      signature matches (currently the short-circuit returns before any glob)?
    criterion: >
      _ts.tmp residue is created during an active download. If the signature
      matches, the playlist hasn't changed, so no new .ts.tmp files are created.
      A matching signature + .ts.tmp residue only happens if a crash occurred
      during a download whose playlist matches a PREVIOUS run's signature.
    recommendation: >
      Keep the .ts.tmp sweep inside the clearing path (after the signature check),
      per B6's recommendation. Do not touch the short-circuit logic. Declare the
      residual case in the commit body.

# ── Deliverable ──
deliverable:
  shape: One commit
  scope: >
    src/vkdownloader/services/segment_downloader.py (mkdir relocation + finally
    extension + docstrings), tests/test_segment_downloader.py (new test class).
  commit_constraints:
    - One commit only
    - TestPreserveSegmentsReporter's 3 tests green, UNCHANGED
    - Bounded fan-out tests green, UNCHANGED
    - _cleanup_segments call in _tally_and_merge unchanged (success-path only)
    - .signature short-circuit logic unchanged
    - Commit body names: (1) D-4 = option (i) confirmation, (2) removal point
      decision (single finally), (3) reporter runs before cleanup, (4) signature
      short-circuit sweep placement

