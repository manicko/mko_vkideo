id: p12-b7

title: P12-B7 — the working tree lives only while the merge needs it (ART-005 lifetime, ART-013 lifetime half)

priority: high

depends_on:
  - p12-b6  # B6's is_file() guard exists before B7's new call sites use _cleanup_segments

