# ── Architectural constraints ──
architectural_constraints:

  byte_identical_move: >
    The 5 retry symbols are MOVED, not rewritten. _compute_backoff_delay's max()
    floor semantics and every other symbol's body must be byte-identical after the move.
    G/P-1: test_retry_after_overrides_delay and test_retry_after_ignored_when_smaller
    pin the floor by name and assertion — a "fix the comment to match the name" refactor
    that replaces max() with the header value would turn a correct 429 wait into one
    shorter than its own backoff schedule. Both tests must pass with no name or expectation
    change.

  three_patch_rewrites_only: >
    Exactly 3 patch() strings change — the three naming downloader_throttle._wait_with_shutdown
    (the old module's own namespace). The 12 naming importing-module re-exported attributes
    (segment_downloader.* and ytdlp_downloader.*) must NOT be changed. Rewriting them would
    be churn that also breaks tests patching those attributes for reasons unrelated to location.
    A git diff on the test files must show no other patch-target rewrite.

  no_ffmpeg_symbol_moves: >
    No ffmpeg symbol is moved, deleted, or even referenced across the new module boundary.
    Per ruling A, ffmpeg_utils.py is permanent product code with a fixed three-part shape
    (group A subprocess infra, check_ffmpeg_available, group C merge engine). B4 moves
    symbols between two modules and has no reason to touch a third. git diff over
    ffmpeg_utils.py must be EMPTY.

  progress_manager_not_dead: >
    ProgressManager is documented-as-retained, exercised by 6 test instantiations, and
    tests/test_cli.py asserts its ABSENCE from batch_downloader. G-9: it is never filed as
    dead and never deleted. It stays in downloader_throttle.py.

  facade_is_not_the_fix: >
    services/downloader.py is a re-export facade. Per §2.4 item 5 and plan 12, editing a
    re-export line is never the remedy — the owning module is. B4 moves the owner and
    updates the facade as a CONSEQUENCE, not as a substitute. The facade's __all__ length
    stays at 19 entries (all unique).

  frozenset_in_same_commit: >
    If a new file is created under src/ (D7 default: services/retry_policies.py),
    tests/test_packaging.py's EXPECTED_SDIST_ENTRIES (69→70) and EXPECTED_WHEEL_ENTRIES
    (32→33) must be edited in the SAME commit. §2.4 item 1: the packaging frozensets are
    a single-writer shared anchor; a missed edit turns the suite red for a reason that
    reads like "the fix broke packaging."

  module_docstring_updated: >
    downloader_throttle.py's module docstring (currently "Throttle utilities for VK Video
    Downloader with retry logic for rate limiting.") describes both concerns. After the
    split it must describe only the residue (shutdown signalling + coordination), or it
    is deleted if it becomes inaccurate. retry_policies.py must have its own module
    docstring describing the retry policy.

  english_only: >
    All comments, logs, docstrings, error messages, and documentation must be in clear
    English. Per project rule 1.

