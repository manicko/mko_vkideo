# Block 4 in the phased execution order (external gates P12-B6/B7/B8 and P11-B2/B5 resolved)
# Source plan: .ai/plans/14-code-quality-audit-fixes_fix.md §3.4 (B4 block), §6.6 (B4 task spec)
# Execution spec: .ai/plans/23-plan-14-execution.md §3.2 (adapted to current state at HEAD 56a1854)
# Decisions: D7 (default — new module retry_policies.py, downloader_throttle.py keeps its name)
#            D8 (default — RETRYABLE_STATUS_CODES moves, api-reference.md corrected in same commit)
#
# Context: downloader_throttle.py (447 lines) holds 5 retry-policy symbols and 5
# residue symbols (shutdown signalling + URLBackoffCoordinator + ProgressManager).
# The retry symbols have 4 production importers + 1 test importer; the residue has
# 7 importers (the 7-most-imported module in the tree after exceptions.py).
# This is a spine-module narrowing, not an unused-module extraction (§2.5 correction 5).
# 15 patch() strings bind the retry symbols: 3 break on a move, 12 are move-robust.
# The retirement d572d96 introduced a facade defect in downloader.py (§2.5 correction 12):
# the symbol-ownership comment lost 4 groups and _attempt_segment_resume is named but
# unexported — a live mypy src tests error. B4 fixes it because B4 already edits
# both the comment and __all__.

