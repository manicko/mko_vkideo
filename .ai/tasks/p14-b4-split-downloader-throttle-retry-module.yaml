# ── Task description (returned to Tech Lead) ──
description: >
  Split downloader_throttle.py into two modules at the concern boundary between
  HTTP retry policy and process-wide shutdown signalling / coordination.

  The five retry-policy symbols move to a NEW module (D7 default: services/retry_policies.py;
  downloader_throttle.py keeps its name). The five residue symbols —
  get_shutdown_event, URLBackoffCoordinator, ProgressManager, _resource_key, _shutdown_event_ctx —
  stay in downloader_throttle.py.

  Then fix the facade defect the ffmpeg retirement introduced: services/downloader.py's
  symbol-ownership comment lost four groups (segment_downloader, downloader_throttle, cookies,
  signal_handlers) while __all__ still exports 10 names those modules own, and _attempt_segment_resume
  is named in the comment but ABSENT from __all__ — a live mypy src tests error
  ("Module does not explicitly export attribute _attempt_segment_resume").

  Acceptance: all 12 importers (7 residue + 5 retry) import correctly; exactly 3 patch()
  strings repoint to the new module; 12 move-robust patches unchanged; api-reference.md's
  RETRYABLE_STATUS_CODES row corrected to the live 7-member set; packaging frozensets
  updated in the same commit if a new file is created; _compute_backoff_delay arithmetic
  byte-identical; git diff over ffmpeg_utils.py is empty.

# ── Goals ──
goals:
  - The five retry symbols (RETRYABLE_STATUS_CODES, _retry_429_with_backoff, _parse_retry_after,
    _compute_backoff_delay, _wait_with_shutdown) defined in exactly one module — the new retry module
  - The five residue symbols (get_shutdown_event, URLBackoffCoordinator, ProgressManager,
    _resource_key, _shutdown_event_ctx) stay in downloader_throttle.py
  - All 7 residue importers (cli.py, batch_downloader.py, downloader.py, extractor.py,
    segment_downloader.py, ytdlp_downloader.py, signal_handlers.py) unchanged and import successfully
  - All 5 retry-policy importers (segment_downloader.py, ytdlp_downloader.py, downloader.py,
    test_downloader_throttle.py, retry_policies.py itself) import correctly from the new module
  - Exactly 3 patch() strings changed (the downloader_throttle.* namespace ones);
    12 move-robust patch() strings unchanged
  - services/downloader.py's symbol-ownership comment restored to name every module that
    owns an exported name; _attempt_segment_resume present in __all__ OR absent from comment (must agree)
  - api-reference.md's RETRYABLE_STATUS_CODES row states the live 7-member set {408, 425, 429, 500, 502, 503, 504}
  - _compute_backoff_delay arithmetic byte-identical — max() floor semantics intact
  - downloader_throttle.py module docstring updated to reflect post-split contents
  - retry_policies.py gets a module docstring describing the retry logic
  - git diff over services/ffmpeg_utils.py is empty
  - Packaging frozensets updated in the same commit if a new file is created

# ── Decisions (D7, D8) ──
decisions:

  - id: D7
    question: >
      How to split — new module for the retry policy, or rename the residue?
    default: "New module named for retrying (services/retry_policies.py); downloader_throttle.py keeps its name."
    criterion: >
      The residue has 7 importers — among the most-imported names in the tree, and
      cli.py (the entry layer) imports it. Renaming the residue converts a 5-importer
      change into a 12-importer change and puts cli.py, signal_handlers.py,
      batch_downloader.py and extractor.py in the blast radius for a name change that is
      not the finding. Renaming only pays if the residue's honest name is worth 7 extra
      import edits — a vocabulary judgement the project has not made.
    resolution: >
      Default chosen: new module services/retry_policies.py for the retry symbols;
      downloader_throttle.py keeps its name and keeps the residue. This is the 5-to-7
      cost asymmetry in action.

  - id: D8
    question: >
      Does RETRYABLE_STATUS_CODES move with the retry policy, or stay behind?
    default: "Moves with the retry policy; api-reference.md corrected in the same commit."
    criterion: >
      A constant travels with the code that uses it — it is used by _retry_429_with_backoff,
      which moves. TestRetryableStatusCodes asserts 9 membership facts including 408 and
      425 (both in the live set, both absent from the stale doc). A doc edit in the same
      commit is not optional tidiness — it is the only way the documented value stays
      true while the constant is being moved. "Fix the doc later" lets the drift recur.
    resolution: >
      Moves with the retry policy. api-reference.md's RETRYABLE_STATUS_CODES row is
      corrected from the stale 5-member set to the live 7-member set in the same commit.

