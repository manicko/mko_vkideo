# ── Honest judgement required ──
honest_judgement:

  split_boundary:
    question: >
      Is the boundary between retry policy and shutdown signalling the correct seam,
      or should ProgressManager or _resource_key move with the retry symbols?
    criterion: >
      ProgressManager is documented-as-retained with 6 test instantiations and tests/test_cli.py
      asserts its absence from batch_downloader — it is coordination infrastructure, not retry
      policy. _resource_key normalises URLBackpressureCoordinator's key, not retry behavior.
      The artifact's own premise is that these four concerns "share no state and no caller" —
      but §2.5 correction 5 refutes "no caller" (7 importers). The seam is still correct:
      retry policy is HTTP-status + backoff + Retry-After; everything else is shutdown/coordination.
    resolution: >
      The 5-symbol split is correct. ProgressManager and _resource_key stay with the
      coordinator and shutdown event.

  retry_policies_vs_policies_naming:
    question: >
      D7's default names the new module retry_policies.py. Is "policies" too abstract
      for what is really backoff+retry logic, or is retry_policies the project's
      established vocabulary?
    criterion: >
      The project uses dense decision-carrying comments with D-/SEC-/INT-/STR- tags. There
      is no existing "policies" module to align with. retry_policies.py named for retrying
      is the default. The alternative (renaming the residue) is rejected by the 7:5
      importer cost asymmetry.
    resolution: >
      retry_policies.py per D7 default. The name states the concern clearly; no evidence
      contradicts the project's vocabulary.

