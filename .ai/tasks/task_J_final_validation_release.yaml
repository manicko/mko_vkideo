description: >
  Final validation gate only. No new features. Run the complete verification matrix,
  record every required result, and allow the implementer to apply only targeted fixes
  for defects found by the matrix. Cover documentation, migration, rollback, and feature
  flags. Any failure in preservation, exact-quality selection, or secret redaction blocks
  release. There must be no known path that deletes valid downloaded bytes after a
  transient error.

scope:
  - final validation only
  - no new features
  - targeted fixes only when a matrix item fails
  - no production-code changes in the planning step

goals:
  - every required acceptance-matrix item has a recorded result
  - verification commands pass or have a documented, approved waiver
  - documentation, migration, rollback, and feature-flag checklist complete
  - release tag and migration/rollback note prepared
  - no known path deletes valid downloaded bytes after a transient error

# ── Release checklist ────────────────────────────────────────────────────────
release_checklist:
  documentation:
    - "Update README, installation guide, CLI reference, and troubleshooting guide for tmp, retention, resume, --log-file, optional --method ffmpeg, and exact-quality failures."
    - "Explain that the familiar command still works and that the first new run uses per-job tmp automatically."
    - "Provide explicit commands to view the log location and a redacted diagnostics bundle; never require sharing cookies or full signed URLs."
    - "Explain how to inspect and manually clean abandoned job folders with a safe dry-run; no irreversible automatic cleanup of incomplete jobs."
    - "Add --keep-temp or equivalent only if its interaction with default preservation semantics is clear; by default failed jobs always keep usable temp data."
  migration:
    - "Existing final output filename: no silent overwrite or corruption."
    - "Existing 15 GiB legacy .part + fragments: not deleted/moved unsafely; deliberate compatible recovery or explicit warning."
    - "Reverting application code must not delete job workspaces created by the newer version."
  rollback:
    - "Preserve feature flags / independent backend selection so direct FFmpeg can be disabled without reverting checkpoint/tmp improvements."
    - "Tag the first validated release and publish a migration/rollback note."
    - "Rollback procedure must leave newer-version workspaces intact and recoverable."
  feature_flags:
    - "Direct FFmpeg backend independently selectable and disableable."
    - "yt-dlp-first and auto policies remain available."
    - "Checkpoint and tmp improvements remain active when FFmpeg is disabled."

# ── Verification commands ────────────────────────────────────────────────────
verification_commands:
  - "uv sync"
  - "uv run pytest -q"
  - "uv run ruff check ."
  - "uv run ruff check src tests"
  - "uv run ruff format --check ."
  - "uv run ruff format --check src tests"
  - "uv run mypy src"
  - "git diff --check"
  - "uv run pytest tests -q"
  - "ffprobe -v error -show_entries format=duration,size -show_entries stream=index,codec_type,codec_name,width,height -of json \"C:\\data\\Video\\Shows\\<completed-file>.mp4\""
  - "uv build --out-dir dist/"
  - "uv run pytest tests/test_packaging.py -v"

# ── Acceptance matrix (plan J1) ──────────────────────────────────────────────
acceptance_matrix:
  - test: "Basic HLS VOD, same CLI invocation"
    required_result: "Completed valid MP4 in output root; all work files only under tmp."
    status: "NOT RUN"
  - test: "Kill process at 30% then rerun"
    required_result: "Resume available; previously verified artifacts survive unchanged."
    status: "NOT RUN"
  - test: "Kill process at 90% then rerun"
    required_result: "Does not start from zero or delete a large valid partial."
    status: "NOT RUN"
  - test: "Manifest token/query refresh, identical media"
    required_result: "Reuses compatible fragments; no destructive invalidation."
    status: "NOT RUN"
  - test: "Manifest changed, same fragment index but different media"
    required_result: "Does not mix bytes; preserves old generation."
    status: "NOT RUN"
  - test: "Exact --quality 1440 with fresh matching URL"
    required_result: "Downloads the new 1440 stream, never old expired URL."
    status: "NOT RUN"
  - test: "Exact 1440 unavailable or ambiguous"
    required_result: "Clear error; no silent downgrade; all partials preserved."
    status: "NOT RUN"
  - test: "HTTP 403/410"
    required_result: "Bounded URL refresh, logged reason; no infinite loop."
    status: "NOT RUN"
  - test: "HTTP 429 + Retry-After"
    required_result: "Respects cooldown, no retry storm."
    status: "NOT RUN"
  - test: "HTTP 5xx/timeouts"
    required_result: "Bounded retries of failing items; no blanket restart."
    status: "NOT RUN"
  - test: "Invalid/truncated segment"
    required_result: "Detects and redownloads only corrupt item."
    status: "NOT RUN"
  - test: "Disk full / read-only dir"
    required_result: "Error without data deletion or corrupted checkpoint."
    status: "NOT RUN"
  - test: "Failed FFmpeg merge"
    required_result: "Segments still present; output root not polluted."
    status: "NOT RUN"
  - test: "Cancellation"
    required_result: "Child reaped; job recoverable and logs flushed."
    status: "NOT RUN"
  - test: "Concurrent same job"
    required_result: "One writer only; second is rejected/attaches read-only."
    status: "NOT RUN"
  - test: "Concurrent different jobs"
    required_result: "Separate workspaces and independent progress."
    status: "NOT RUN"
  - test: "1,895 HLS segments"
    required_result: "Stable memory/disk behavior; no broken merge; correct fragment counts."
    status: "NOT RUN"
  - test: "Windows with Cyrillic, spaces, brackets, long names"
    required_result: "No shell-quoting, path-escape, or rename failures."
    status: "NOT RUN"
  - test: "Existing final output filename"
    required_result: "No silent overwrite or corruption."
    status: "NOT RUN"
  - test: "Existing 15 GiB legacy .part + fragments"
    required_result: "Not deleted/moved unsafely; deliberate compatible recovery or explicit warning."
    status: "NOT RUN"
  - test: "Credential canary in URL/cookies"
    required_result: "Zero secret values in JSONL, console and checkpoint."
    status: "NOT RUN"
  - test: "FFmpeg optional backend"
    required_result: "Success/failure and cancellation obey same artifact invariants."
    status: "NOT RUN"
  - test: "Parser receives false TiB estimate/negative ETA"
    required_result: "Shows known verified bytes and ETA: unknown."
    status: "NOT RUN"
  - test: "Repeated --log-file runs"
    required_result: "No duplicate handlers; logs have cause+attempt+sanitized details."
    status: "NOT RUN"

