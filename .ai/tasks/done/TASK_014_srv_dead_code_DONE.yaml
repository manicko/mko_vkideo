id: TASK_014_srv_dead_code

title: Remove dead code SegmentRetryResult and ProgressManager.get_progress

priority: low

# ── Plan/Audit report source ──
source_reference: .ai/audit/99-validation/03-audit-services-validated-findings.md
source_section: SRV-001, SRV-002 (LOW, advisory)
source_blocks:
  - "SRV-001: SegmentRetryResult enum is dead code"
  - "SRV-002: ProgressManager.get_progress is never called"

description: >
  Two confirmed dead symbols:
  - `SegmentRetryResult` (StrEnum) in models/enums.py is never imported or referenced
    anywhere in src/ or tests/.
  - `ProgressManager.get_progress(self, url_index)` in downloader_throttle.py is never
    called anywhere (only update_sync / get_formatted_progress / clear are used).

  Remove both to reduce surface area. NOTE: QLT-002 (Phase 08) was REJECTED — it
  incorrectly claimed BOTH update() and get_progress() are dead; only get_progress() is
  dead. Do NOT remove `update()`. Keep `ProgressManager.update()` (it has test coverage).

goals:
  - remove unused SegmentRetryResult enum
  - remove unused ProgressManager.get_progress method
  - preserve ProgressManager.update() and other used methods

files:
  - path: src/vkdownloader/models/enums.py

    targets:
      - type: class
        name: SegmentRetryResult

    semantic_anchors:
      insert_after:
        type: return_statement
        value: "end of SegmentRetryResult class"

    changes:
      - action: modify_code
        description: >
          Delete the SegmentRetryResult class definition entirely.

  - path: src/vkdownloader/services/downloader_throttle.py

    targets:
      - type: method
        name: ProgressManager.get_progress

    semantic_anchors:
      insert_after:
        type: function_call
        value: get_progress

    changes:
      - action: modify_code
        description: >
          Delete the get_progress method only; keep update(), update_sync(),
          get_formatted_progress(), clear().

acceptance_criteria:
  - no references to SegmentRetryResult remain in src/ or tests/
  - no references to ProgressManager.get_progress remain
  - ProgressManager.update() still present and tested
  - ruff + mypy clean
