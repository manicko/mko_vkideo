id: task_005_remove_dead_code_functions
title: Remove unused get_video_duration and _parse_target_duration functions
priority: low
depends_on: []
source_reference: \.ai\audit\99-validation\03-services-validated.md
source_section: SRV-002
description: >
  Remove dead code - the functions get_video_duration (line 578) and
  _parse_target_duration (line 607) in downloader.py are never called
  anywhere in the codebase. The get_video_duration function attempts to run
  ffprobe on an m3u8 URL which is unlikely to work as intended (ffprobe
  typically needs a media file, not a playlist URL).

goals:
  - Remove get_video_duration function (lines 578-604)
  - Remove _parse_target_duration function (lines 607-622)
  - Verify no callers exist

files:
  - path: src/vkdownloader/services/downloader.py
    targets:
      - type: function
        name: get_video_duration
      - type: function
        name: _parse_target_duration
    semantic_anchors:
      - remove_functions: lines 578-622
    changes:
      - action: remove_code
        description: >
          Remove both functions entirely. These are dead code with no callers
          and incorrect implementations (ffprobe on m3u8 URL won't work).

acceptance_criteria:
  - Functions removed without breaking any imports or callers
  - Module still imports cleanly
  - All tests pass