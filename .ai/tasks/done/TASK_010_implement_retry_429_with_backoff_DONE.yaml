id: task_010_implement_retry_429_with_backoff
title: Create internal _retry_429_with_backoff function

priority: high

depends_on: []

type: implementation

source_reference: .ai\plans\PLAN_1.md
source_section: task_1

description: >
  Create new downloader_throttle.py module with retry function implementing
  AWS Full Jitter exponential backoff for 429/5xx errors. Function reads
  response content and returns bytes to avoid lifecycle issues with context manager.

objectives:
  - Create new module downloader_throttle.py
  - Implement async function with AWS Full Jitter backoff (1s base delay)
  - Respect Retry-After header when present
  - Return bytes | None instead of response object
  - Log with structured fields: attempt, status, retry_after, segment_index, url

files:
  - path: src\vkdownloader\services\downloader_throttle.py
    targets:
      - type: module
        name: downloader_throttle

    semantic_anchors:
      create_new: true

changes:
  - action: add_module
    description: Create new downloader_throttle.py module with _retry_429_with_backoff

    code_hint: |
      async def _retry_429_with_backoff(
          session: aiohttp.ClientSession,
          segment_url: str,
          headers: dict[str, str],
          segment_index: int,
          max_retries: int = 3
      ) -> bytes | None:
          # AWS Full Jitter: random.uniform(0, base_delay * 2^attempt)
          # Base delay: 1s for RETRY BACKOFF (distinct from 1.5s inter-segment delay)
          # Retry codes: 429 and 5xx (500, 502, 503, 504)
          # Cap max delay at 30 seconds

acceptance_criteria:
  - Function signature matches spec
  - Implements AWS Full Jitter backoff
  - Returns bytes on success, None on permanent failure
  - Reads response content inside retry loop
  - Only retries on 429 and 5xx status codes
  - Structured logging with required fields

notes:
  - 1s base delay is for RETRY BACKOFF (different from 1.5s inter-segment anti-detection delay)
  - Creates new file, no existing code modified