id: task_011_modify_download_segment_throttling
title: Modify _download_segment function for single-thread mode throttling

priority: high

depends_on:
  - task_010_implement_retry_429_with_backoff

depends_on_previous_task_in_chain:
  - task_010_implement_retry_429_with_backoff  # Both modify downloader.py

type: implementation

source_reference: .ai\plans\PLAN_1.md
source_section: task_2

description: >
  Update _download_segment to delegate to _retry_429_with_backoff when
  max_concurrent_downloads=1, receiving bytes and writing to output.
  Add progress_callback parameter.

objectives:
  - Import _retry_429_with_backoff from downloader_throttle module
  - Add max_concurrent_downloads and segment_index parameters
  - When max_concurrent_downloads=1: call _retry_429_with_backoff and write bytes
  - When max_concurrent_downloads > 1: use existing direct download logic
  - Maintain backward compatibility for existing callers

files:
  - path: src\vkdownloader\services\downloader.py
    targets:
      - type: function
        name: _download_segment

    semantic_anchors:
      modify:
        type: function
        name: _download_segment

      insert_after:
        type: function
        name: MAX_RESUME_RETRIES

changes:
  - action: add_import
    description: Import _retry_429_with_backoff from downloader_throttle

    code_hint: |
      from .downloader_throttle import _retry_429_with_backoff

  - action: modify_signature
    description: >
      Add max_concurrent_downloads and segment_index parameters with defaults

    code_hint: |
      async def _download_segment(
          session: aiohttp.ClientSession,
          segment_url: str,
          output_path: Path,
          headers: dict[str, str],
          max_concurrent_downloads: int = 1,
          segment_index: int = 0,
      ) -> bool:

  - action: add_conditional_logic
    description: >
      When max_concurrent_downloads=1: call retry function, write bytes, return bool

    code_hint: |
      if max_concurrent_downloads == 1:
          content = await _retry_429_with_backoff(
              session, segment_url, headers, segment_index
          )
          if content is not None:
              with open(output_path, "wb") as f:
                  f.write(content)
              return True
          return False
      # Existing logic for parallel mode

acceptance_criteria:
  - _retry_429_with_backoff imported correctly
  - Function signature has new parameters with correct defaults
  - Sequential mode (max_concurrent_downloads=1) uses retry function
  - Parallel mode (max_concurrent_downloads > 1) unchanged
  - Existing callers work without modification
  - Returns bytes on success, None on failure

risk_assessment:
  risk_level: medium
  factors:
    - Modifies existing _download_segment function
    - Backward compatibility must be preserved
    - Import path must avoid circular dependencies