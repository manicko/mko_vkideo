id: TASK_013_quality_none_height_handling

title: Handle height=None explicitly in BEST/WORST quality selection

priority: low

# ── Plan/Audit report source ──
source_reference: .ai/audit/99-validation/03-audit-services-validated-findings.md
source_section: SRV-006 (LOW, advisory)
source_blocks:
  - "SRV-006: _get_fallback_stream / WORST selection is arbitrary when stream heights are None"

# Consolidated with QLT-006 (Phase 08) — identical root cause (height=None ranking).

description: >
  `QualitySelector._get_fallback_stream` uses `max(streams, key=lambda s: s.height or 0)`
  and the `WORST` case uses `min(streams, key=lambda s: s.height or float("inf"))`.
  When `height=None` (browser-derived streams), None collapses to 0/inf, yielding an
  ARBITRARY element rather than a meaningful best/worst. Handle `height is None`
  explicitly so the ranking is deterministic and documented (e.g. treat None-height
  streams as lowest priority, or raise a clear error when ALL heights are None and a
  numeric quality is requested).

  This becomes less critical after TASK_011 (BROWSER path stops re-selecting), but
  remains a latent correctness gap for height=None streams in general.

goals:
  - deterministic BEST/WORST selection with mixed None/known heights
  - no silent arbitrary choice
  - behavior documented

files:
  - path: src/vkdownloader/services/quality.py

    targets:
      - type: method
        name: QualitySelector._get_fallback_stream
      - type: method
        name: QualitySelector.select

    semantic_anchors:
      # The max/min key lambdas referencing s.height or 0 / float("inf").
      insert_before:
        type: return_statement
        value: "max(streams, key=lambda s: s.height or 0)"

    changes:
      - action: modify_code
        description: >
          Add explicit height-None handling in _get_fallback_stream and WORST branch so
          None-height streams are ranked deterministically (e.g. lowest priority).

acceptance_criteria:
  - BEST/WORST with a mix of None and known heights is deterministic
  - existing test_get_fallback_stream_handles_none_height still passes
  - ruff + mypy clean
