id: TASK_010_qlt_008_hlsdownloadrequest_research
source_reference: .ai/audit/99-validation/08-quality-validated.md
source_section: QLT-008
source_finding: QLT-008
secondary_reference:
  - .ai/audit/99-validation/02-config-validated.md
  - .ai/audit/99-validation/03-services-validated.md
secondary_section: CFG-004, SRV-005

title: Research HLSDownloadRequest refactoring approach
priority: high
status: blocked
blocked_by: null
type: research

description: >
  HLSDownloadRequest carries live service objects (Settings, VKVideoExtractor, URLBackoffCoordinator,
  asyncio.Semaphore, Callable) and uses a monkeypatched __init__ to work around forward references.
  This pattern (CFG-004, QLT-008, SRV-005) defeats Pydantic validation, hides type errors, and is
  fragile under subclassing. Research needed to identify all call sites, assess impact, and recommend
  safest refactoring approach.

goals:
  - Identify all HLSDownloadRequest instantiation sites in segment_downloader.py
  - Identify all attribute access sites (settings, extractor, backoff_coordinator, semaphore, progress_callback extraction)
  - Identify if HLSDownloadRequest is used outside segment_downloader in other modules
  - Review download_hls_with_resume signature and internal usage
  - Evaluate two approaches:
    1. Keep data fields in Pydantic model, extract services in function signature
    2. Use TYPE_CHECKING imports + model_rebuild without monkeypatch

files_to_analyze:
  - path: src/vkdownloader/models/dtos.py
    targets:
      - type: class
        name: HLSDownloadRequest
  - path: src/vkdownloader/services/segment_downloader.py
    targets:
      - type: function
        name: download_hls_with_resume
    semantic_anchors:
      find: HLSDownloadRequest instantiation
      find: .settings, .extractor, .backoff_coordinator, .semaphore, .progress_callback access
  - path: src/vkdownloader/services/downloader.py
    targets:
      - type: all_references
        name: HLSDownloadRequest
  - path: src/vkdownloader/services/downloader_throttle.py
    targets:
      - type: all_references
        name: HLSDownloadRequest

research_steps:
  - grep: "HLSDownloadRequest" across all source files
  - analyze: Attribute access pattern after instantiation
  - analyze: Function signature changes required
  - analyze: Test file mock patterns for HLSDownloadRequest
  - evaluate: Breakage risk of each approach
  - recommend: Go/no-go with specific implementation path

pass_criteria:
  - All HLSDownloadRequest call sites catalogued
  - Risk assessment completed
  - Recommended approach documented

failure_action: return to planner with refined scope

rollback_task: null