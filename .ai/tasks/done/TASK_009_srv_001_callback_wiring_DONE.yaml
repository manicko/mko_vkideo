id: TASK_009_srv_001_callback_wiring
source_reference: .ai/audit/99-validation/03-services-validated.md
source_section: SRV-001
source_finding: SRV-001
secondary_reference: .ai/audit/99-validation/06-data-flow-validated.md
secondary_section: DF-002

title: Wire progress_callback and backoff_coordinator into YTDLP/AUTO download paths
priority: high
status: pending

description: >
  perform_download() accepts backoff_coordinator, semaphore, and progress_callback documenting them
  as enabling shared rate limiting and progress tracking for batch downloads. However, YTDLP and AUTO
  branches call download_with_ytdlp_with_resume_fallback() without passing any of these values.
  The FFMPEG branch correctly passes them. The omission is inconsistent and breaks batch progress.

goals:
  - Thread backoff_coordinator, semaphore, and progress_callback through download_with_ytdlp_with_resume_fallback
  - Ensure batch progress display works for all download methods
  - Ensure shared rate limiting works for all methods

files:
  - path: src/vkdownloader/services/downloader.py
    targets:
      - type: function
        name: download_with_ytdlp_with_resume_fallback
    semantic_anchors:
      update:
        type: function_signature
      update:
        type: function_call
        value: download_hls_with_resume
  - path: src/vkdownloader/services/downloader.py
    targets:
      - type: function
        name: perform_download
    semantic_anchors:
      within:
        type: match_case
        value: DownloadMethod.YTDLP
      within:
        type: match_case
        value: DownloadMethod.AUTO

changes:
  - action: modify_signature
    description: >
      Add backoff_coordinator, semaphore, progress_callback parameters to download_with_ytdlp_with_resume_fallback.
    code_hint: |
      async def download_with_ytdlp_with_resume_fallback(
          url: str, m3u8_url: str, output_file: Path, quality: str, extractor: VKVideoExtractor,
          settings: Settings, *, backoff_coordinator: URLBackoffCoordinator | None = None,
          semaphore: asyncio.Semaphore | None = None, progress_callback: Callable | None = None
      ):

  - action: modify_call
    description: >
      Pass these arguments to internal download_hls_with_resume call.
    code_hint: |
      segment_result = await download_hls_with_resume(
          ..., backoff_coordinator=backoff_coordinator, semaphore=semaphore,
          progress_callback=progress_callback
      )

  - action: modify_call
    description: >
      In perform_download YTDLP case, pass the coordinator/callback.
    code_hint: |
      result = await download_with_ytdlp_with_resume_fallback(
          ..., backoff_coordinator=backoff_coordinator, semaphore=semaphore,
          progress_callback=progress_callback
      )

acceptance_criteria:
  - Batch progress works with YTDLP/AUTO methods
  - Rate limiting applies to all download paths
  - No regression in FFMPEG method