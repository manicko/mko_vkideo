id: TASK_003_sec_003_url_sanitization
source_reference: .ai/audit/99-validation/04-security-validated.md
source_section: SEC-003
source_finding: SEC-003

title: Replace blocklist URL sanitization with allowlist redaction
priority: high
status: completed

description: >
  _strip_auth_params uses a blocklist of known-sensitive query parameter names, which fails to redact
  VK CDN signed URLs that embed tokens in the path or use unknown parameter names. This risks signing
  URLs leaking into logs.

goals:
  - Replace blocklist strategy with allowlist (scheme + host only)
  - Redact high-entropy path segments and all query values
  - Ensure no signed URLs leak in INFO logs

files:
  - path: src/vkdownloader/utils/url_sanitizer.py
    targets:
      - type: function
        name: _strip_auth_params
    semantic_anchors:
      replace: _strip_auth_params function

changes:
  - action: refactor
    description: >
      Rewrite _strip_auth_params to use allowlist strategy: log only scheme+host, replace path
      and all query values with redacted markers.
    code_hint: |
      def _strip_auth_params(url: str) -> str:
          """Redact URL for logging - show only scheme and host."""
          try:
              parsed = urlsplit(url)
              return f"{parsed.scheme}://{parsed.netloc}/***REDACTED***"
          except Exception:
              return "***REDACTED***"

acceptance_criteria:
  - Signed URLs no longer appear in logs
  - Log format remains parseable (URL structure preserved with redaction)
  - All existing log emission sites work with new sanitization

implementation_notes:
  - Removed AUTH_PARAMS frozenset (blocklist approach)
  - Changed to urlsplit for simpler parsing
  - Now returns only scheme://host/***REDACTED*** for any URL
  - Invalid/malformed URLs return ***REDACTED*** as fallback
  - Updated tests to match new behavior