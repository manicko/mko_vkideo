id: task_002_move_sanitize_title_to_security
title: Move _sanitize_title function to utils/security.py
priority: medium
depends_on: []
source_reference: \.ai\audit\99-validation\01-cli-validated.md
source_section: CLI-002
description: >
  Move the _sanitize_title function (lines 25-33 in cli.py) to the
  utils/security.py module where other security/utility functions reside.
  This enforces proper separation of concerns between CLI layer and utility layer.

goals:
  - Move _sanitize_title to utils/security.py
  - Update cli.py imports and usage
  - Maintain identical functionality

files:
  - path: src/vkdownloader/utils/security.py
    targets:
      - type: module
        name: security
    semantic_anchors:
      - insert_before:
          type: function
          value: validate_output_path
    changes:
      - action: add_code
        description: Add _sanitize_title function before validate_output_path
        code_hint: |
          def _sanitize_title(title: str) -> str:
              """Sanitize title for filesystem safety.
              
              Replaces characters that are invalid on Windows/Unix filesystems with underscores,
              strips whitespace, and limits length to 100 characters.
              """
              for char in '/\\:*?"<>|':
                  title = title.replace(char, "_")
              return title.strip()[:100]

  - path: src/vkdownloader/cli.py
    targets:
      - type: function
        name: _sanitize_title
      - type: import
        name: validate_output_path
    semantic_anchors:
      - remove_function: _sanitize_title
      - add_import: _sanitize_title
    changes:
      - action: remove_code
        description: Remove _sanitize_title function definition from cli.py (lines 24-33)
      - action: modify_code
        description: Add _sanitize_title to imports from utils.security
        code_hint: |
          # Change: from .utils.security import validate_output_path
          # To: from .utils.security import _sanitize_title, validate_output_path

acceptance_criteria:
  - Function moved successfully with identical behavior
  - CLI imports _sanitize_title from utils.security
  - All usages in cli.py lines 136, 263 work correctly
  - Tests pass