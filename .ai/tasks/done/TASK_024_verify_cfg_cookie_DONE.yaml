id: TASK_024_verify_cfg_cookie

title: Verify — cookie_source validation + config changes

type: verification

status: pending

priority: high

depends_on:
  - TASK_001_cfg_cookie_source_validator
  - TASK_002_cli_cookie_help_text
  - TASK_007_cfg_docs_and_defaults

verifies:
  - TASK_001_cfg_cookie_source_validator
  - TASK_002_cli_cookie_help_text
  - TASK_007_cfg_docs_and_defaults

verification_steps:
  - build: "uv run ruff check src/vkdownloader/config.py src/vkdownloader/cli.py && uv run mypy src/vkdownloader"
  - test: "uv run pytest tests/ -q"
  - smoke_check: "uv run python -c \"from vkdownloader.config import Settings, CookieSource; import pytest.raises; \nimport sys\n# file must now raise\ntry:\n    Settings(cookie_source='file')\n    sys.exit('FAIL: file accepted')\nexcept ValueError:\n    pass\n# none/browser must still work\nSettings(cookie_source='browser'); Settings(cookie_source='none')\nprint('OK cookie_source validator')\""

pass_criteria:
  - ruff + mypy clean
  - full test suite passes (217+)
  - Settings(cookie_source='file') raises ValueError
  - CookieSource.FILE enum member still importable
  - CLI --help shows updated cookie-source text

failure_action: return TASK_001_cfg_cookie_source_validator to rework
