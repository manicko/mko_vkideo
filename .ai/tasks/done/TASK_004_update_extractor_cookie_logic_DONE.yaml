# Update extractor to conditionally launch browser based on cookie_source setting

id: TASK_004_update_extractor_cookie_logic
title: Update extractor to conditionally launch browser based on cookie_source
priority: high
type: implementation
status: done

depends_on:
  - TASK_003_research_cookie_extraction_consumers

description: |
  Modify VKVideoExtractor.extract_streams_with_cookies() to check settings.cookie_source
  before launching browser. When CookieSource.NONE, return empty cookies without browser.
  Based on research findings for hidden consumer handling.

goals:
  - Check settings.cookie_source in extract_streams_with_cookies()
  - Skip browser launch when cookie_source=NONE
  - Maintain existing behavior when cookie_source=BROWSER
  - Handle FILE mode as placeholder for future implementation
  - Implement solution compatible with _fetch_playlist_with_retry token refresh

files:
  - path: src/vkdownloader/services/extractor.py
    targets:
      - type: method
        name: extract_streams_with_cookies
    semantic_anchors:
      insert_after:
        type: function_def
        name: extract_streams_with_cookies

changes:
  - action: modify_code
    description: |
      Add conditional check at start of extract_streams_with_cookies():
        1. If cookie_source == NONE: extract streams via _extract_with_ytdlp(), return (streams, None)
        2. If cookie_source == BROWSER: proceed with current _extract_with_browser() logic
        3. If cookie_source == FILE: placeholder for future (return streams without browser for now)
        4. Added force_browser parameter for token refresh scenarios in recovery paths

    code_hint: |
      async def extract_streams_with_cookies(
          self, url: str, force_browser: bool = False
      ) -> tuple[list[Stream], str | None]:
          # Check cookie source setting first (unless forced)
          if not force_browser and self.settings.cookie_source == CookieSource.NONE:
              streams = await self._extract_with_ytdlp(url, video_id_full)
              return streams, None

          if not force_browser and self.settings.cookie_source == CookieSource.FILE:
              streams = await self._extract_with_ytdlp(url, video_id_full)
              return streams, None

          # Existing browser launch logic for BROWSER mode or forced
          streams, cookies = await self._extract_with_browser(url, video_id_full)

acceptance_criteria:
  - Browser not launched when cookie_source=NONE - VERIFIED
  - Browser launched when cookie_source=BROWSER - VERIFIED
  - Cookies returned correctly for BROWSER mode - VERIFIED
  - Compatible with token refresh in _fetch_playlist_with_retry - VERIFIED
  - Tests updated for conditional browser behavior - VERIFIED