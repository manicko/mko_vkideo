id: task_003_add_enum_exports
title: Add DownloadMethod and CookieSource to models package exports
priority: medium
depends_on: [task_002_move_sanitize_title_to_security]
source_reference: \.ai\audit\99-validation\02-config-validated.md
source_section: CFG-002
description: >
  Add DownloadMethod and CookieSource enums to the public API exports in
  src/vkdownloader/models/__init__.py. Currently only 4 of 6 enums are exported,
  forcing consumers to import directly from submodules.

goals:
  - Add DownloadMethod and CookieSource to imports
  - Add to __all__ list
  - Provide complete public API for models package

files:
  - path: src/vkdownloader/models/__init__.py
    targets:
      - type: import_statement
        name: from .enums import
      - type: variable
        name: __all__
    semantic_anchors:
      - modify_import:
          type: import
          value: from .enums import DownloadStatus, LogLevel, QualityEnum, StreamFormat
      - modify_all: add missing enums
    changes:
      - action: modify_code
        description: Add DownloadMethod and CookieSource to the enum import statement
        code_hint: |
          # Before:
          # from .enums import DownloadStatus, LogLevel, QualityEnum, StreamFormat
          # After:
          from .enums import CookieSource, DownloadMethod, DownloadStatus, LogLevel, QualityEnum, StreamFormat
          
          # And add to __all__:
          __all__ = [
              ...
              "CookieSource",
              "DownloadMethod",
              ...
          ]

acceptance_criteria:
  - DownloadMethod and CookieSource can be imported from vkdownloader.models
  - All existing imports still work
  - Tests pass