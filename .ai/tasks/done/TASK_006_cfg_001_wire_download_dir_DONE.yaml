id: TASK_006_cfg_001_wire_download_dir
source_reference: .ai/audit/99-validation/02-config-validated.md
source_section: CFG-001
source_finding: CFG-001

title: Wire settings.download_dir into CLI output path defaults
priority: high
status: done

description: >
  The Settings.download_dir field is documented and configured but never consumed. CLI download/batch
  commands use --output with default "." instead of falling back to settings.download_dir. Users who
  configure an output location get files placed elsewhere silently.

goals:
  - Make --output default to settings.download_dir when not supplied
  - Resolve download_dir as absolute path
  - Ensure backward compatibility for explicit -o flag

files:
  - path: src/vkdownloader/cli.py
    targets:
      - type: function
        name: download
      - type: function
        name: batch_download
    semantic_anchors:
      update:
        type: option_default
        value: --output default

changes:
  - action: modify_logic
    description: >
      Changed --output default from "." to use settings.download_dir, resolving to absolute path.
      Added logic in download command to apply settings.download_dir when output is ".".
  - action: modify_logic
    description: >
      Same change in batch_download command.
      Added logic in _download_single to apply settings.download_dir when output is ".".

acceptance_criteria:
  - --output defaults to configured download_dir
  - Files are written to the configured directory
  - Explicit -o flag still overrides the setting