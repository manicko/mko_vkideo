id: task_hls_download_request_refactor
title: Remove monkey-patch workaround from HLSDownloadRequest
priority: medium
source_reference: .ai/audit/99-validation/08-quality-validated-findings.md
source_section: QLT-004
description: >
  HLSDownloadRequest embeds runtime service objects (settings, extractor,
  backoff_coordinator, semaphore) in a Pydantic model, creating circular
  imports and requiring monkey-patch workarounds. Refactor to separate data
  from runtime dependencies.
files:
  - path: src/vkdownloader/models/dtos.py
    targets:
      - type: class
        name: HLSDownloadRequest
semantic_anchors:
      - after:
          type: class
          name: HLSDownloadRequest
changes:
  - action: modify_code
    description: >
      Remove service object fields from HLSDownloadRequest. Keep only:
      video_url, m3u8_url, output_file, quality, cookies, progress_callback.
      Pass service dependencies as plain function arguments instead.
  - action: modify_code
    description: >
      Remove _lazy_init monkey-patch and related type ignore markers.
goals:
  - Circular import dependency eliminated
  - Monkey-patch removed
  - Clean models layer with no code dependencies
  - Service objects passed as function arguments
acceptance_criteria:
  - HLSDownloadRequest is pure data holder
  - No forward refs to Settings/extractor/throttle
  - No _lazy_init workaround
  - All tests pass
  - Mypy passes clean