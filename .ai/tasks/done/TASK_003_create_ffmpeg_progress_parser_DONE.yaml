id: task_003_create_ffmpeg_progress_parser
title: Create FFmpegProgressParser for real-time progress parsing

priority: high

depends_on:
  - task_001_research_ffmpeg_progress_architecture

type: implementation

source_reference: .ai\plans\progress_implementation_hints.md
source_section: 2. Async Progress Reader (Python 3.10+)

description: >
  Create FfmpegProgress dataclass and ProgressParser class to parse KEY=VALUE
  output from ffmpeg -progress pipe in real-time. Implement async generator
  for streaming progress updates.

objectives:
  - Create FfmpegProgress dataclass for progress state
  - Create ProgressParser with static parse_line method
  - Implement async read_progress generator function
  - Handle out_time_us for percentage calculation
  - Extract speed multiplier for display

files:
  - path: src\vkdownloader\services\downloader.py
    targets:
      - type: module_level
        name: FfmpegProgress

    semantic_anchors:
      insert_after:
        type: constant
        name: MAX_RESUME_RETRIES

changes:
  - action: add_code
    description: >
      Add FfmpegProgress dataclass and ProgressParser class with read_progress
      async generator

    code_hint: |
      @dataclass
      class FfmpegProgress:
          frame: Optional[int] = None
          fps: Optional[float] = None
          speed: Optional[float] = None  # multiplier (e.g., 1.2x = 1.2)
          total_size: Optional[int] = None
          out_time_us: Optional[int] = None
          out_time_ms: Optional[int] = None
          out_time: Optional[str] = None
          progress: Optional[str] = None  # "continue" or "end"

      class ProgressParser:
          @staticmethod
          def parse_line(line: str) -> tuple[str, str] | None:
              if "=" in line:
                  key, value = line.strip().split("=", 1)
                  return key, value
              return None

      async def read_progress(
          stderr: asyncio.StreamReader,
          duration_ms: int | None = None
      ) -> AsyncIterator[FfmpegProgress]:
          # Parse ffmpeg progress output in real-time

acceptance_criteria:
  - FfmpegProgress dataclass with all key fields
  - ProgressParser.parse_line handles KEY=VALUE format
  - read_progress is async generator yielding FfmpegProgress
  - Handles "N/A" values gracefully
  - Resets progress object on "progress=end"

notes:
  - Import dataclass and AsyncIterator from typing required
  - Duration injection enables percentage calculation without ffprobe call