id: TASK_027_str_005_perform_download_refactor
source_reference: .ai/audit/99-validation/09-structural-quality-validated.md
source_section: STR-005
source_finding: STR-005

title: Extract duplicated cookie resolution from perform_download
priority: low
status: pending

description: >
  perform_download duplicates the exact same cookie-resolution block in both YTDLP and FFMPEG match
  cases (lines 523-529 and 535-541). This violates single-responsibility.

goals:
  - Extract _resolve_cookies helper function
  - Remove duplication between match cases
  - Reduce nesting depth

files:
  - path: src/vkdownloader/services/downloader.py
    targets:
      - type: function
        name: perform_download
    semantic_anchors:
      extract:
        type: duplicate_block
        value: cookie resolution

changes:
  - action: extract_function
    description: >
      Create _resolve_cookies that returns (m3u8_url, cookies).
    code_hint: |
      def _resolve_cookies(
          extractor: VKVideoExtractor, settings: Settings, url: str, m3u8_url: str
      ) -> tuple[str, str | None]:
          if settings.cookie_source == CookieSource.BROWSER:
              browser_streams, cookies = await extractor.extract_streams_with_cookies(url)
              if browser_streams:
                  m3u8_url = str(browser_streams[0].url)
              return m3u8_url, cookies
          return m3u8_url, None

acceptance_criteria:
  - Cookie resolution logic extracted to single location
  - Both match cases use the helper
  - Same behavior preserved
  - Tests pass