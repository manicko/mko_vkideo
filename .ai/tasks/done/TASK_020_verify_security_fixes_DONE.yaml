id: verify_security_fixes
type: verification
status: pending

title: Verify security fixes and exit code changes

depends_on:
  - research_ffmpeg_header_safety
  - fix_ffmpeg_cookie_exposure
  - fix_git_env_tracking
  - fix_batch_exit_code

verifies:
  - research_ffmpeg_header_safety
  - fix_ffmpeg_cookie_exposure
  - fix_git_env_tracking
  - fix_batch_exit_code

verification_steps:
  - build: uv run ruff check src/ && uv run mypy src/
  - test: uv run pytest tests/ -q
  - smoke_check: >
      uv run python -c "
      from vkdownloader.config import Settings
      from vkdownloader.services.downloader import HLSDownloader
      print('Imports OK')
      "

pass_criteria:
  - all ruff checks pass
  - mypy passes in strict mode
  - all 216 tests pass
  - no ImportError or runtime issues

failure_action: return_security_tasks_to_rework

rollback_notes: >
  If ffmpeg cookie fix breaks downloads, revert TASK_003 and implement
  safer header passing mechanism.