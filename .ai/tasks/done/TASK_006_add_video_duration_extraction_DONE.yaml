id: task_006_add_video_duration_extraction
title: Add video duration extraction for ETA calculation

priority: medium

depends_on:
  - task_001_research_ffmpeg_progress_architecture

type: implementation

source_reference: .ai\plans\RESEARCH.md
source_section: 5. Getting Video Duration (Optional for ETA)

description: >
  Add optional ffprobe-based duration extraction before download for accurate
  ETA calculation. Implement get_video_duration helper and integrate into
  download flow. Handle ffprobe unavailability gracefully.

objectives:
  - Create get_video_duration async function using ffprobe
  - Parse m3u8 playlist for target duration as fallback
  - Integrate duration into progress percentage calculation
  - Handle missing ffprobe gracefully with fallback

files:
  - path: src\vkdownloader\services\downloader.py
    targets:
      - type: function
        name: download_hls_with_resume
      - type: module_level
        name: get_video_duration

    semantic_anchors:
      insert_after:
        type: function
        name: _download_segment

changes:
  - action: add_function
    description: >
      Add async get_video_duration function using ffprobe

    code_hint: |
      async def get_video_duration(m3u8_url: str) -> Optional[int]:
          """Get duration in milliseconds using ffprobe."""
          try:
              cmd = [
                  "ffprobe", "-v", "quiet",
                  "-show_entries", "format=duration",
                  "-of", "csv=p=0",
                  m3u8_url
              ]
              proc = await asyncio.create_subprocess_exec(
                  *cmd,
                  stdout=asyncio.subprocess.PIPE,
                  stderr=asyncio.subprocess.PIPE,
              )
              stdout, _ = await proc.communicate()
              if stdout:
                  return int(float(stdout.decode()) * 1000)
          except FileNotFoundError:
              logger.warning("ffprobe_not_found", fallback_to_manual=True)
          return None

  - action: add_fallback_parser
    description: >
      Add _parse_target_duration fallback using m3u8 playlist

    code_hint: |
      def _parse_target_duration(content: str) -> Optional[int]:
          """Parse #EXT-X-TARGETDURATION from m3u8 content."""
          for line in content.splitlines():
              if line.startswith("#EXT-X-TARGETDURATION:"):
                  try:
                      return int(line.split(":")[1]) * 1000
                  except (IndexError, ValueError):
                      return None
          return None

acceptance_criteria:
  - get_video_duration function exists with ffprobe call
  - FileNotFoundError handled gracefully
  - Returns None when ffprobe unavailable
  - Fallback parser for m3u8 target duration works
  - Duration passed to progress parser for percentage calculation