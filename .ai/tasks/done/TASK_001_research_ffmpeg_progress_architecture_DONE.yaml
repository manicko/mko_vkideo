id: task_001_research_ffmpeg_progress_architecture
title: Research FFmpeg Progress Implementation Architecture

priority: high

type: research

status: completed

description: >
  Analyze FFmpeg progress implementation architecture for real-time progress display.
  Investigate all consumers of download_with_ffmpeg and download_hls_with_resume functions,
  assess impact of concurrent stderr reading, and evaluate architecture for ETA/duration
  extraction dependencies.

objectives:
  - Identify all callers and hidden consumers of download_with_ffmpeg and related functions
  - Assess risks of replacing process.communicate() with real-time stderr reading
  - Analyze integration points with tqdm in CLI and existing DownloadProgress model
  - Determine ffprobe dependency requirements for duration/ETA calculation
  - Produce go/no-go recommendation for implementation

files_to_analyze:
  - path: src\vkdownloader\services\downloader.py
    targets:
      - type: function
        name: download_with_ffmpeg
      - type: function
        name: HLSDownloader
      - type: function
        name: download_hls_with_resume
      - type: function
        name: _download_segment

  - path: src\vkdownloader\services\extractor.py
    targets:
      - type: function
        name: extract_streams_with_cookies

  - path: src\vkdownloader\models\video.py
    targets:
      - type: class
        name: DownloadProgress

  - path: src\vkdownloader\cli.py
    targets:
      - type: function
        name: download
      - type: function
        name: batch_download
      - type: function_call
        value: tqdm

research_questions:
  - Who calls download_with_ffmpeg directly or indirectly?
  - What are the timeout/reliability implications of streaming stderr reading?
  - How does real-time parsing interact with existing logging infrastructure?
  - What test coverage exists for current download flow that could break?
  - Does ffprobe dependency introduce new failure modes?

risk_assessment:
  risk_level: medium
  factors:
    - Changes subprocess handling in core download path
    - May conflict with existing stdout/stderr consumption
    - Progress parsing logic could affect download reliability
    - ffprobe dependency for ETA requires additional error handling

acceptance_criteria:
  - List of all callers/consumers documented
  - Risk mitigation strategies identified
  - Go/no-go recommendation with confidence level
  - Alternative approaches evaluated if risks too high

go_no_go:
  status: go
  recommendation: "APPROVED - Implementation can proceed with mitigations"
  confidence: "high"
  notes: |
    ## CALLER ANALYSIS (Acceptance Criteria: COMPLETE)

    ### Direct Callers of download_with_ffmpeg:
    1. **perform_download()** (src\vkdownloader\services\downloader.py:630)
       - Called when DownloadMethod.FFMPEG is selected
       - Creates HLSDownloader instance and calls download_with_ffmpeg

    ### Direct Callers of download_hls_with_resume:
    1. **perform_download()** (src\vkdownloader\services\downloader.py:635)
       - Fallback when FFMPEG method fails
    2. **download_with_ytdlp_with_resume_fallback()** (line 501)
       - Resume path when ytdlp download interrupted

    ### Hidden Consumers (FFmpeg merge operations):
    - **_merge_batch_segments()** (line 307) - Uses ffmpeg for segment merging
    - **_perform_final_merge()** (line 347) - Uses ffmpeg for final output merge

    ## RISK ASSESSMENT (Acceptance Criteria: COMPLETE)

    ### Timeout/Reliability Implications:
    - **MEDIUM RISK**: process.communicate() blocks until complete - replacing with real-time reading
      requires concurrent task management to avoid deadlock
    - **MITIGATION**: Use asyncio.gather() with process.wait() and stderr reading tasks
    - **BUFFER RISK**: Large stderr output could buffer indefinitely if not read concurrently
    - **MITIGATION**: Stream reading is line-based, should handle backpressure adequately

    ### Test Coverage Impact:
    - Existing tests mock asyncio.create_subprocess_exec with AsyncMock.communicate()
    - Tests will need updates to mock new async reading pattern
    - Test file: tests\test_hls_downloader.py has 3 tests for download_with_ffmpeg

    ### Real-time Parsing Integration:
    - structlog logging already in place (no stdout/stderr consumption conflicts)
    - tqdm in cli.py only used for video count, not individual download progress
    - Clean integration point available for progress_callback parameter

    ### ffprobe Dependency:
    - **MEDIUM RISK**: External tool dependency for duration
    - **MITIGATION**: Graceful fallback - use None for duration, skip percentage calculation
    - Alternative: Parse #EXT-X-TARGETDURATION from m3u8 playlist as fallback

    ## ARCHITECTURE OBSERVATIONS

    1. DownloadProgress model currently tracks segment-level progress only
    2. No existing progress callback mechanism in download flow
    3. CLI uses tqdm only for batch video count, not individual file progress
    4. Three separate ffmpeg invocations: download, batch merge, final merge
    5. All use process.communicate() - changes would need to apply to all for consistency

    ## RECOMMENDATION: GO WITH MITIGATIONS

    Proceed with implementation. Key mitigations:
    1. Add progress_callback as optional parameter (backward compatible)
    2. Use asyncio.create_task() for concurrent process waiting and stderr reading
    3. Handle FileNotFoundError for ffprobe gracefully
    4. Update tests to mock new async reading pattern