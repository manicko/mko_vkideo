id: TASK_001_sec_001_cookie_file_cleanup
source_reference: .ai/audit/99-validation/04-security-validated.md
source_section: SEC-001
source_finding: SEC-001

title: Clean up browser session cookie files after download
priority: high
status: pending

description: >
  When cookie_source=BROWSER, Playwright captures session cookies and writes them to a Netscape cookie file
  in the output directory. These files are never deleted after download completes or fails, and they are
  not covered by .gitignore. This leaves authentication secrets on disk and in potential version control.

goals:
  - Delete cookie file after yt-dlp download completes (success or failure)
  - Add *_cookies.txt to .gitignore for defense-in-depth
  - Ensure cleanup does not break yt-dlp execution

files:
  - path: src/vkdownloader/services/downloader.py
    targets:
      - type: function
        name: _download_with_ytdlp
    semantic_anchors:
      insert_before:
        type: function_call
        value: asyncio.create_subprocess_exec
  - path: .gitignore

changes:
  - action: modify_logic
    description: >
      Wrap yt-dlp execution in try/finally to delete cookie file after completion.
    code_hint: |
      cookie_file = output_file.parent / f".{output_file.stem}_cookies.txt"
      try:
          # ... existing yt-dlp download logic ...
      finally:
          if cookie_file.exists():
              cookie_file.unlink()

  - action: add_line
    description: >
      Add *_cookies.txt to .gitignore to prevent accidental commit.
    code_hint: |
      # Cookie files for authenticated downloads
      *_cookies.txt

acceptance_criteria:
  - Cookie file is deleted after yt-dlp completes
  - No regression in download functionality
  - .gitignore updated to exclude cookie files