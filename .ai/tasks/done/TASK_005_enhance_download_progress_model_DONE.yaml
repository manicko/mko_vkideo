id: task_005_enhance_download_progress_model
title: Enhance DownloadProgress model with speed and eta_seconds

priority: medium

depends_on:
  - task_001_research_ffmpeg_progress_architecture

type: implementation

source_reference: .ai\plans\RESEARCH.md
source_section: Step 3: Enhance DownloadProgress model

description: >
  Add speed and eta_seconds fields to DownloadProgress model to support
  progress display with speed and ETA information. Enable percentage
  calculation when duration is known.

objectives:
  - Add speed field (bytes/sec) to DownloadProgress
  - Add eta_seconds field for ETA display
  - Add percent field for percentage completion
  - Ensure backward compatibility with existing code

files:
  - path: src\vkdownloader\models\video.py
    targets:
      - type: class
        name: DownloadProgress

    semantic_anchors:
      modify:
        type: class
        name: DownloadProgress

changes:
  - action: add_fields
    description: Add speed, eta_seconds, and percent fields to DownloadProgress

    code_hint: |
      class DownloadProgress(BaseModel):
          video_id: str
          downloaded_bytes: int
          total_bytes: int | None = None
          segments_downloaded: int
          segments_total: int
          speed: float | None = None  # bytes/sec
          eta_seconds: int | None = None
          percent: float | None = None
          status: DownloadStatus
          error: str | None = None

acceptance_criteria:
  - DownloadProgress has speed field
  - DownloadProgress has eta_seconds field
  - DownloadProgress has percent field
  - All fields are optional with None defaults
  - Model validates correctly