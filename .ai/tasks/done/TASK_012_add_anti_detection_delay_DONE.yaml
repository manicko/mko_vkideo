id: task_012_add_anti_detection_delay
title: Add anti-detection delay after semaphore release

priority: high

depends_on:
  - task_010_implement_retry_429_with_backoff

depends_on_previous_task_in_chain:
  - task_011_modify_download_segment_throttling  # Both modify downloader.py (different functions)

type: implementation

source_reference: .ai\plans\PLAN_1.md
source_section: task_3

description: >
  Add 1.5s base delay with jitter (0-0.5s) between successful segment requests
  when in sequential mode. Delay must apply AFTER semaphore release in download_segment_concurrent.

objectives:
  - Pass max_concurrent_downloads to _download_segment call
  - Pass segment_index to _download_segment for logging context
  - Apply 1.5s + jitter delay AFTER _download_segment returns True
  - Apply delay AFTER async with semaphore exits (after release)
  - Only apply delay when max_concurrent_downloads=1 (sequential mode)

files:
  - path: src\vkdownloader\services\downloader.py
    targets:
      - type: function
        name: download_hls_with_resume
      - type: function
        name: download_segment_concurrent (nested in download_hls_with_resume)

    semantic_anchors:
      modify:
        type: function
        name: download_segment_concurrent

changes:
  - action: modify_nested_function
    description: >
      Update download_segment_concurrent to pass parameters and apply delay
      after semaphore release

    code_hint: |
      async def download_segment_concurrent(idx: int, segment_url: str) -> bool:
          """Download segment with semaphore rate limiting."""
          async with semaphore:
              full_url = segment_url
              if not segment_url.startswith("http"):
                  full_url = urljoin(request.m3u8_url, segment_url)
              segment_path = segments_dir / f"{idx:05d}.ts"
              if not segment_path.exists():
                  result = await _download_segment(
                      session, full_url, segment_path, headers,
                      max_concurrent_downloads=settings.max_concurrent_downloads,
                      segment_index=idx,
                  )
              else:
                  result = True
          # Anti-detection delay AFTER semaphore release (outside context block)
          # Delay only in sequential mode (max_concurrent_downloads == 1)
          if result and settings.max_concurrent_downloads == 1:
              delay = 1.5 + random.uniform(0, 0.5)
              await asyncio.sleep(delay)
          return result

acceptance_criteria:
  - max_concurrent_downloads passed to _download_segment
  - segment_index passed to _download_segment
  - 1.5s + jitter delay applied AFTER semaphore release
  - Delay only when max_concurrent_downloads == 1
  - Delay placement: outside async with semaphore context block
  - Parallel mode performance preserved

notes:
  - The delay is for anti-detection, NOT retry backoff (1s base)
  - Two different purposes, two different delays
  - Parallel mode (max_concurrent_downloads > 1) unaffected