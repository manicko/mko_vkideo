# Research task to identify all hidden consumers of extract_streams_with_cookies

id: TASK_003_research_cookie_extraction_consumers
title: Research hidden consumers of extract_streams_with_cookies
priority: high
type: research

description: |
  Analyze all code paths that call extract_streams_with_cookies to identify hidden
  consumers that may break when the method becomes conditional. This is required
  before modifying extractor logic.

objectives:
  - Identify all direct and indirect callers of extract_streams_with_cookies
  - Identify callers of _fetch_playlist_with_retry which internally calls extract_streams_with_cookies
  - Assess impact of conditional browser launch on _fetch_playlist_with_retry token refresh
  - Evaluate alternatives for FILE mode implementation planning
  - Produce go/no-go recommendation for implementation

files_to_analyze:
  - path: src/vkdownloader/services/extractor.py
    targets:
      - type: method
        name: extract_streams_with_cookies
      - type: method
        name: _extract_with_browser
  - path: src/vkdownloader/services/downloader.py
    targets:
      - type: function
        name: perform_download
      - type: function
        name: download_with_ytdlp_with_resume_fallback
      - type: function
        name: _fetch_playlist_with_retry

research_questions:
  - Who calls extract_streams_with_cookies directly?
  - Who calls _fetch_playlist_with_retry which calls extract_streams_with_cookies?
  - What happens when cookie_source=NONE in token refresh scenarios?
  - Does _fetch_playlist_with_retry need cookie handling or can it skip?
  - Are there any test expectations that assume browser is always launched?

risk_assessment:
  risk_level: medium
  factors:
    - Changes to extract_streams_with_cookies may affect hidden consumers
    - _fetch_playlist_with_retry uses cookies for token refresh on 403/401
    - Token refresh without cookies could cause resume failures

go_no_go:
  status: go
  recommendation: "GO with modifications. Add conditional browser launch to extract_streams_with_cookies based on cookie_source setting. Token refresh paths (_fetch_playlist_with_retry and download_with_ytdlp_with_resume_fallback) require special handling - they should either force browser launch or use an internal method that always extracts."
  confidence: 90

callers_identified:
  direct:
    - perform_download:840 (YTDLP method branch)
    - perform_download:849 (FFMPEG method branch)
    - download_with_ytdlp_with_resume_fallback:712 (token refresh on resume)
    - _fetch_playlist_with_retry:364 (token refresh on 403/410)
  indirect:
    - download_hls_with_resume calls _fetch_playlist_with_retry which calls extract_streams_with_cookies

acceptance_criteria:
  - List of all callers documented
  - Impact assessment for token refresh without cookies
  - Go/no-go recommendation with confidence level
  - Implementation approach documented for each caller