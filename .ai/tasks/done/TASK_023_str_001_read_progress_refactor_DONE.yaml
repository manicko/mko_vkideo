id: TASK_023_str_001_read_progress_refactor
source_reference: .ai/audit/99-validation/09-structural-quality-validated.md
source_section: STR-001
source_finding: STR-001

title: Refactor read_progress if/elif chain to lookup table
priority: medium
status: pending

description: >
  read_progress has CC=21 (rank D) due to an 11-branch if/elif chain mapping ffmpeg progress keys
  to field assignments. This is a lookup anti-pattern that increases complexity and reduces testability.

goals:
  - Replace if/elif chain with a key→setter lookup table
  - Reduce cyclomatic complexity from 21 to ~3
  - Improve testability of parser logic

files:
  - path: src/vkdownloader/services/ffmpeg_utils.py
    targets:
      - type: function
        name: read_progress
    semantic_anchors:
      replace:
        type: if_elif_chain
        value: lines 76-96

changes:
  - action: refactor
    description: >
      Replace if/elif chain with dict mapping and field setter functions.
    code_hint: |
      # Create lookup table at module level:
      _PROGRESS_KEY_HANDLERS: dict[str, Callable[[str, Progress], None]] = {
          "frame": lambda v, p: setattr(p, "frame", int(v)),
          "fps": lambda v, p: setattr(p, "fps", float(v)),
          "speed": lambda v, p: setattr(p, "speed", v),
          "total_size": lambda v, p: setattr(p, "total_size", int(v)),
          "out_time_us": lambda v, p: setattr(p, "out_time_us", int(v)),
          "out_time_ms": lambda v, p: setattr(p, "out_time_ms", int(v)),
          "out_time": lambda v, p: setattr(p, "out_time", float(v)),
          "progress": lambda v, p: setattr(p, "progress", v),
      }

acceptance_criteria:
  - Cyclomatic complexity reduced
  - All progress keys still parsed correctly
  - Tests pass