# Update downloader to respect cookie_source setting for both methods

id: TASK_005_update_downloader_cookie_logic
title: Update downloader to respect cookie_source setting
priority: high
type: implementation
status: done

depends_on:
  - TASK_004_update_extractor_cookie_logic

description: |
  Modify perform_download() in downloader.py to conditionally call extract_streams_with_cookies()
  based on cookie_source setting. For YTDLP and FFMPEG methods, check setting before calling.
  Also update _fetch_playlist_with_retry to handle token refresh appropriately.

goals:
  - Check cookie_source in YTDLP branch of perform_download()
  - Check cookie_source in FFMPEG branch of perform_download()
  - Maintain AUTO method behavior (no browser)
  - Handle token refresh in _fetch_playlist_with_retry gracefully
  - Pass cookies to download functions when available

files:
  - path: src/vkdownloader/services/downloader.py
    targets:
      - type: function
        name: perform_download
      - type: function
        name: _fetch_playlist_with_retry
    semantic_anchors:
      insert_after:
        type: match_case
        value: DownloadMethod.YTDLP

changes:
