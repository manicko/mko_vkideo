source_blocks:
  - "Block C — Make diagnostics actionable; log the exact cause of restart"

description: >
  Make restart/failure diagnostics actionable and secret-safe. Configure logging
  handlers deterministically and idempotently, fix userinfo leakage in URL
  redaction, deepen recursive sanitization, sanitize exception objects, standardize
  diagnostic event names/fields, add a bounded streaming child-transcript sink
  with per-line caps and progress rate limiting, add retention and an explicit
  disable option, make auto-sink creation non-fatal, and thread an attempt index
  through download/restart paths. Block C does NOT implement per-job workspaces
  (Block D); it defines the ChildTranscriptSink(path=...) contract and an interim
  Settings.diagnostic_log_dir (default None). Auto-sink is opt-in in Block C and
  becomes default-on in Block D via workspace.log_path.

goals:
  - setup_logging() is idempotent: repeated calls do not duplicate handlers or records.
  - _strip_auth_params removes userinfo (and keeps only scheme://host[:port]).
  - redact_log_event recurses beyond depth-1 with a bounded depth and cycle guard.
  - Exception objects passed as event values are sanitized, never raw .args.
  - Structured events use the standardized field contract and event-name list.
  - ChildTranscriptSink streams sanitized lines with per-line caps and progress rate limiting; 100,000 progress lines do not exhaust memory.
  - Retention is enforced via RotatingFileHandler (logs only).
  - diagnostics_enabled=False disables persistence; auto-sink failures are non-fatal.
  - Every restart carries a monotonically increasing attempt_id and one reason.
  - No raw URLs, tokens, cookies, exception args, or subprocess argv are logged.

files:
  - path: src/vkdownloader/config.py
    targets:
      - type: class
        name: Settings
      - type: function
        name: setup_logging
    semantic_anchors:
      add_fields_after: log_file
      handler_setup: logging.basicConfig call inside setup_logging
    notes: >
      Add diagnostics_enabled (default True) and diagnostic_log_dir (Path | None,
      default None) to Settings with the same empty-string coercion as log_file.
      Replace FileHandler with RotatingFileHandler for log_file persistence so
      retention applies to logs only. Make handler setup idempotent (force=True or
      explicit handler clearing) so repeated setup_logging() calls do not duplicate
      records.

  - path: src/vkdownloader/utils/url_sanitizer.py
    targets:
      - type: function
        name: _strip_auth_params
      - type: function
        name: _sanitize_collection
      - type: function
        name: redact_log_event
    semantic_anchors:
      userinfo_boundary: netloc parsing inside _strip_auth_params
      collection_recursion: _sanitize_collection container handling
      exception_values: redact_log_event value dispatch
    notes: >
      Strip userinfo from netloc. Recurse collections with a depth cap and cycle
      guard. Coerce BaseException values to a sanitized string. Keep structural keys
      untouched.

  - path: src/vkdownloader/services/diagnostics.py
    targets:
      - type: class
        name: ChildTranscriptSink
      - type: constant
        name: STRUCTURED_DIAGNOSTIC_EVENTS
      - type: constant
        name: STRUCTURED_DIAGNOSTIC_FIELDS
    semantic_anchors:
      constructor: ChildTranscriptSink.__init__(path=...)
      streaming_write: ChildTranscriptSink.write_line
      retention: RotatingFileHandler owned by the sink
    notes: >
      New module. Defines the ChildTranscriptSink(path=...) contract and the
      standardized event/field constants. No production behavior beyond this
      contract in Block C.

  - path: src/vkdownloader/services/downloader.py
    targets:
      - type: function
        name: perform_download
      - type: function
        name: download_video
    semantic_anchors:
      job_start_log: logger.info("starting_download", ...) inside perform_download
      backend_dispatch: match method block inside perform_download
    notes: >
      Emit job_started/backend_started/backend_stopped/child_exit-style events with
      the field contract. Thread job_id, attempt_id, and optional
      ChildTranscriptSink through perform_download and onward. Create the auto-sink
      only when settings.diagnostics_enabled and settings.diagnostic_log_dir is not
      None; sink creation must be non-fatal.

  - path: src/vkdownloader/services/ytdlp_downloader.py
    targets:
      - type: function
        name: _download_with_ytdlp
      - type: function
        name: download_with_ytdlp_with_resume_fallback
      - type: function
        name: _attempt_segment_resume
      - type: function
        name: _echo_ytdlp_line
    semantic_anchors:
      child_output_loop: async for line in iter_process_lines inside _download_with_ytdlp
      transcript_retention: _retain_transcript_line
      restart_reason_log: logger.error("download_failed", ...) inside _download_with_ytdlp
      max_retries_log: logger.error("max_retries_exceeded", ...) inside fallback
    notes: >
      Stream child lines through ChildTranscriptSink when supplied, with per-line
      caps and progress rate limiting. Emit child_exit with returncode,
      elapsed_seconds, last_error_code. Thread attempt_id. Keep the bounded
      transcript tail. Sanitize before any sink write. Non-fatal sink errors.

  - path: src/vkdownloader/services/segment_downloader.py
    targets:
      - type: function
        name: download_hls_with_resume
      - type: function
        name: _run_download_session
      - type: function
        name: _download_segment
      - type: function
        name: _refresh_token_and_retry
      - type: function
        name: _fetch_playlist_with_retry
    semantic_anchors:
      segment_failure_log: logger.warning("segment_download_failed", ...) inside download path
      token_refresh_log: logger.warning("failed_to_refresh_token", ...) inside _attempt_segment_resume
      merge_log: logger.info("merging_segments", ...) inside _tally_and_merge
    notes: >
      Emit segment_request_failed, retry_scheduled, refresh_requested,
      refresh_completed, backend_switch_blocked, resume_checkpoint_loaded,
      progress_estimate_unreliable, media_verified, job_failed_preserved,
      job_committed with the field contract. Thread attempt_id. Sanitize host/path.

  - path: src/vkdownloader/cli.py
    targets:
      - type: function
        name: download
      - type: function
        name: batch_download
    semantic_anchors:
      preamble: _run_command_preamble inside download/batch_download
    notes: >
      No new CLI flags in Block C. diagnostics_enabled and diagnostic_log_dir are
      ordinary Settings fields (env/.env). Auto-sink construction stays in the
      service layer. Keep preamble behavior intact.

