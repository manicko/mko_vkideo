# Task spec for Block H — restore direct FFmpeg transport as isolated optional adapter
# Generated by Planner. id: block_h_ffmpeg_transport

id: block_h_ffmpeg_transport

title: "Block H — Restore direct FFmpeg transport as isolated, optional adapter"

priority: P1

depends_on:
  - block_d_workspace
  - block_e_checkpoint
  - block_f_quality_refresh
  - block_g_retry_state_machine

source_reference: .ai/plans/MKO_VKIDEO_Refactoring_Plan.md
source_section: "Block H — Restore direct FFmpeg transport as an isolated, optional adapter"
source_blocks:
  - "Block H — Restore direct FFmpeg transport as an isolated, optional adapter"

description: >
  Restore the historical direct FFmpeg HLS download path as an isolated, optional
  transport adapter behind a DownloadTransport Protocol. Add FFMPEG to DownloadMethod,
  make the CLI accept --method ffmpeg, and route the FFMPEG branch in perform_download
  through FfmpegTransport while preserving the existing yt-dlp-first and auto policies.
  The transport writes only to workspace.staging_dir; perform_download publishes the
  staged artifact through publish_verified_file and records the backend on the state
  machine. FFmpeg partial output is never claimed to be resumable. Scope is strictly
  Block H: no Block I progress/ETA rendering and no Block J final validation.

goals:
  - DownloadMethod includes FFMPEG in models/enums.py.
  - CLI accepts --method ffmpeg and advertises it as a valid choice.
  - DownloadTransport is a Protocol with name and async download(binding, workspace).
  - FfmpegTransport is implemented in services/ffmpeg_transport.py.
  - perform_download FFMPEG branch selects the transport, produces a staged artifact, publishes it, and records backend="ffmpeg".
  - Restored ffmpeg helpers (FfmpegProgress, ProgressParser, read_progress, and argfile helper) live in ffmpeg_utils.py.
  - FFmpeg is invoked with argument arrays, never shell=True; signed URLs/cookies stay out of argv.
  - FFmpeg transport failure preserves artifacts and does not delete another backend's data.
  - Cancellation reaps the FFmpeg subprocess.
  - No FFmpeg partial MP4 is claimed to be resumable.
  - Packaging manifest includes the new module and its test.

files:
  - path: src/vkdownloader/models/enums.py
    targets:
      - type: enum
        name: DownloadMethod
    semantic_anchors:
      add_value: "FFMPEG = \"ffmpeg\""
    notes: >
      Add FFMPEG alongside YTDLP and AUTO. Keep StrEnum and do not alter existing values.

  - path: src/vkdownloader/cli.py
    targets:
      - type: constant
        name: _METHOD_OPTION_HELP
      - type: constant
        name: _METHOD_REJECTION_MESSAGE
      - type: function
        name: _validate_method
    semantic_anchors:
      help_text: "Download method: yt-dlp, auto, or ffmpeg."
      rejection_message: "Choose from 'yt-dlp', 'auto', or 'ffmpeg'."
    notes: >
      Remove the retirement wording for the download loader and accept ffmpeg as a valid
      DownloadMethod. Keep the note that ffmpeg remains required for segment merge.

  - path: src/vkdownloader/services/ffmpeg_utils.py
    targets:
      - type: dataclass
        name: FfmpegProgress
      - type: class
        name: ProgressParser
      - type: function
        name: read_progress
      - type: function
        name: _temp_argfile
    semantic_anchors:
      progress_parser: "ProgressParser.parse_line returns KEY=VALUE pairs"
      progress_reader: "read_progress yields FfmpegProgress from ffmpeg -progress pipe output"
      argfile: "_temp_argfile writes ffmpeg args with 0o600 and is removed after use"
    notes: >
      Restore the direct-FFmpeg progress parser and reader that were retired, adapted to
      the current iter_process_lines signature. Add an async _temp_argfile context manager
      so signed URLs and cookie file paths never appear in process argv. Reuse existing
      cancel_subprocess and security helpers; do not duplicate them.

  - path: src/vkdownloader/services/ffmpeg_transport.py
    targets:
      - type: protocol
        name: DownloadTransport
      - type: class
        name: FfmpegTransport
      - type: method
        name: download
    semantic_anchors:
      protocol: "class DownloadTransport(Protocol): name; async download(binding, workspace) -> Path | None"
      transport: "FfmpegTransport(settings).download(binding, workspace)"
      output: "workspace.staging_dir / workspace.final_path.name"
      cookie_handling: "_create_temp_cookie_file from ytdlp_downloader"
      subprocess: "asyncio.create_subprocess_exec(*cmd, ...)"
    notes: >
      New module. Define DownloadTransport as a typing.Protocol with `name: str` and
      `async def download(self, binding, workspace) -> Path | None`. Implement FfmpegTransport
      by extracting the stable direct-FFmpeg path: resolve cookie files, append the cookies
      protocol option, build headers, use _temp_argfile, run ffmpeg with -progress pipe:1
      or pipe:2 and -nostats, parse progress via read_progress, reap the process on
      cancellation, sanitize stderr, and return the staged path on success. Output goes to
      workspace.staging_dir only. Do not claim partial MP4 resumability. Optional
      FfmpegTransport fallback to SegmentTransport must use a separate non-destructive
      workspace generation and preserve the original artifact.

  - path: src/vkdownloader/services/downloader.py
    targets:
      - type: function
        name: perform_download
    semantic_anchors:
      transport_selection: "case DownloadMethod.FFMPEG"
      publish: "publish_verified_file(staged, workspace.final_path)"
      state_machine_backend: "state_machine.backend = \"ffmpeg\""
      cleanup: "cleanup_owned_job_artifacts(workspace)"
    notes: >
      Add a DownloadMethod.FFMPEG branch. Resolve cookies via _resolve_cookies, build a
      StreamBinding from the selected stream, instantiate FfmpegTransport, call download(),
      and treat a None result as failure. On success, publish the staged artifact with
      publish_verified_file and cleanup_owned_job_artifacts, mirroring the yt-dlp path.
      Load or create the DownloadStateMachine as for other methods and set its backend to
      "ffmpeg". Do not silently switch yt-dlp or auto to FFmpeg. Emit backend_started and
      backend_stopped with attempt_id.

  - path: src/vkdownloader/services/ytdlp_downloader.py
    targets:
      - type: function
        name: _create_temp_cookie_file
      - type: function
        name: _await_first_and_cancel_others
    semantic_anchors:
      reuse: "import _create_temp_cookie_file and _await_first_and_cancel_others"
    notes: >
      Reuse existing helpers from this module instead of duplicating cookie-file or task
      coordination logic. No behavioral change required here.

  - path: tests/test_packaging.py
    targets:
      - type: constant
        name: EXPECTED_SDIST_ENTRIES
      - type: constant
        name: EXPECTED_WHEEL_ENTRIES
    semantic_anchors:
      add_entries: "src/vkdownloader/services/ffmpeg_transport.py and tests/test_ffmpeg_transport.py"
    notes: >
      Add the new module and its test to both manifest sets.

changes:
  - action: add_code
    description: >
      Add FFMPEG to DownloadMethod.
    code_hint: |
      class DownloadMethod(StrEnum):
          YTDLP = "yt-dlp"
          AUTO = "auto"
          FFMPEG = "ffmpeg"

  - action: modify_code
    description: >
      Update CLI method validation and help text to accept ffmpeg.
    code_hint: |
      _METHOD_OPTION_HELP = (
          "Download method: yt-dlp, auto, or ffmpeg. "
          "ffmpeg is still required to merge downloaded segments."
      )

  - action: add_code
    description: >
      Restore FfmpegProgress, ProgressParser, read_progress, and _temp_argfile in ffmpeg_utils.py.
    code_hint: |
      @dataclass
      class FfmpegProgress: ...

      class ProgressParser:
          @staticmethod
          def parse_line(line: str) -> tuple[str, str] | None: ...

      async def read_progress(stderr, ..., shutdown_event=None, on_shutdown=None): ...

      @asynccontextmanager
      async def _temp_argfile(args: list[str]) -> AsyncIterator[Path]: ...

  - action: add_code
    description: >
      Create services/ffmpeg_transport.py with the DownloadTransport Protocol and FfmpegTransport.
    code_hint: |
      from typing import Protocol, runtime_checkable

      @runtime_checkable
      class DownloadTransport(Protocol):
          name: str
          async def download(
              self, binding: StreamBinding, workspace: DownloadWorkspace
          ) -> Path | None: ...

      class FfmpegTransport:
          name = "ffmpeg"
          def __init__(self, settings: Settings | None = None) -> None: ...
          async def download(self, binding, workspace) -> Path | None: ...

  - action: modify_code
    description: >
      Add the DownloadMethod.FFMPEG branch to perform_download.
    code_hint: |
      case DownloadMethod.FFMPEG:
          m3u8_url, cookies, raw_cookies = await _resolve_cookies(...)
          binding = binding_from_selected(selected_stream or streams[0], requested_quality=quality, cookies=cookies, raw_cookies=raw_cookies)
          transport = FfmpegTransport(settings=settings)
          if state_machine is not None:
              state_machine.backend = "ffmpeg"  # or constructor-provided backend
          staged = await transport.download(binding, workspace)
          if staged is None:
              return None
          if workspace is not None:
              staged = workspace.staging_dir / workspace.final_path.name
              if staged.exists():
                  from .workspace import cleanup_owned_job_artifacts, publish_verified_file
                  publish_verified_file(staged, workspace.final_path, final_lock=final_lock)
                  cleanup_owned_job_artifacts(workspace)
                  return workspace.final_path
          return staged

  - action: modify_code
    description: >
      Add ffmpeg_transport.py and test_ffmpeg_transport.py to the packaging manifests.
    code_hint: |
      "src/vkdownloader/services/ffmpeg_transport.py",
      "tests/test_ffmpeg_transport.py",
      "vkdownloader/services/ffmpeg_transport.py",

