# Task spec for Block F — exact quality refresh
# Generated by Planner. id: block_f_quality_refresh

id: block_f_quality_refresh

title: "Block F — exact quality refresh without silent downgrade"

priority: P0

depends_on:
  - block_e_checkpoint

source_reference: .ai/plans/MKO_VKIDEO_Refactoring_Plan.md
source_section: "Block F — Refresh expired tokens while preserving exact requested quality"
source_blocks:
  - "Block F — Refresh expired tokens while preserving exact requested quality"

description: >
  Implement one explicit refresh_stream() operation that returns a validated,
  frozen StreamBinding instead of merely refreshed cookies. Selection must
  resolve an exact requested height through authoritative variant metadata and
  reject browser-captured UNKNOWN-height streams as a fresh exact stream unless
  independently verified. QualityMismatchError (ErrorCode.QUALITY_MISMATCH)
  replaces any silent downgrade. Update all token/cookie refresh call sites so
  a refreshed, verified URL plus credentials and variant identity propagate to
  the segment downloader and to the Block E checkpoint. Adapters (yt-dlp, custom
  segment, optional FFmpeg) reuse the same binding, and inexact quality fails
  explicitly without deleting or mixing any artifacts. Scope is strictly Block F:
  no state machine (Block G), no FFmpeg transport (Block H), and no progress
  (Block I).

goals:
  - StreamBinding is a frozen dataclass with media_playlist_url, requested_quality, actual_height, variant_id, codecs, and opaque cookies.
  - refresh_stream returns a StreamBinding or raises QualityMismatchError/QualityNotAvailableError.
  - select_exact_or_fail never accepts an unverified (None/unknown/non-matching) height for an exact numeric request.
  - binding_from_selected maps Stream or HLSVariantIdentity fields into StreamBinding, including variant_id.
  - QualityMismatchError is a VKDownloadError with ErrorCode.QUALITY_MISMATCH.
  - _resolve_cookies does not keep a stale m3u8_url for an exact request merely because quality is not BEST.
  - _attempt_segment_resume obtains and forwards a verified binding instead of the BEST-only branch.
  - _refresh_token_and_retry, _handle_token_refresh, and _fetch_playlist_with_retry propagate the new verified URL, credentials, and variant identity.
  - adapters and download_hls_with_resume reuse the same binding/variant_id.
  - checkpoint stream_variant_id is updated from the binding and verified before cached segments are reused.
  - inexact or unverifiable quality raises an explicit error and performs no cleanup.
  - browser-captured streams labelled "unknown" with height=None are rejected for exact numeric requests.

