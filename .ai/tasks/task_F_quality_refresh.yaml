  - path: src/vkdownloader/models/enums.py
    targets:
      - type: enum
        name: ErrorCode
    semantic_anchors:
      add_member: QUALITY_MISMATCH = "quality_mismatch"
    notes: >
      Add the machine-readable code used by QualityMismatchError. Keep the
      existing StrEnum ordering and values intact.

  - path: src/vkdownloader/exceptions.py
    targets:
      - type: class
        name: QualityMismatchError
    semantic_anchors:
      base_class: VKDownloadError
      error_code: ErrorCode.QUALITY_MISMATCH
      constructor: accepts a message and optional requested/available/actual_height context
    notes: >
      New domain exception. Mirror QualityNotAvailableError's structured
      attributes where useful, but the plan's call sites raise it with a
      message. Never embed URLs, tokens, cookies, or headers in the message.

  - path: src/vkdownloader/services/quality_refresh.py
    targets:
      - type: dataclass
        name: StreamBinding
      - type: function
        name: refresh_stream
      - type: function
        name: select_exact_or_fail
      - type: function
        name: binding_from_selected
    semantic_anchors:
      stream_binding_fields:
        - "media_playlist_url: str"
        - "requested_quality: str"
        - "actual_height: int | None"
        - "variant_id: str"
        - "codecs: str | None"
        - "cookies: object | None"
      frozen: true
      refresh_signature: "refresh_stream(original_vk_url, requested_quality, previous, extractor)"
      select_signature: "select_exact_or_fail(candidates, requested_quality)"
      binding_signature: "binding_from_selected(selected, *, requested_quality=None, cookies=None)"
      height_guard: "requested_quality.isdecimal() implies actual_height == int(requested_quality)"
    notes: >
      New module. StreamBinding is a frozen dataclass (not Pydantic) per the
      plan snippet; media_playlist_url and cookies are sensitive and must never
      be logged or serialized. refresh_stream uses extractor.extract_streams
      (or extract_streams_with_cookies when cookies are required) plus
      select_exact_or_fail and binding_from_selected, then applies the height
      guard. Reuse QualitySpec, QualitySelector, and HLSVariantIdentity rather
      than duplicating selection logic. For exact numeric requests, a candidate
      with height None, height <= 0, quality "unknown", or a mismatched height
      must raise QualityMismatchError instead of being accepted. Keyword
      requests (best/worst) may delegate to QualitySelector.

  - path: src/vkdownloader/services/quality.py
    targets:
      - type: class
        name: QualitySelector
    semantic_anchors:
      reuse: "_find_quality_match, select, _get_fallback_stream"
    notes: >
      No structural change required; quality_refresh imports and reuses the
      existing selector. Do not duplicate the ranker or placeholder rules.

  - path: src/vkdownloader/services/hls_parser.py
    targets:
      - type: class
        name: HLSVariantIdentity
      - type: function
        name: parse_master_playlist
      - type: function
        name: compute_playlist_fingerprint
    semantic_anchors:
      authoritative_metadata: "variant_id, codecs, resolution, bandwidth"
    notes: >
      No structural change required; refresh_stream and binding_from_selected
      consume these for authoritative variant identity. If a master playlist is
      available, its variant metadata overrides browser-captured unknown data.

  - path: src/vkdownloader/services/ytdlp_downloader.py
    targets:
      - type: function
        name: _resolve_cookies
      - type: function
        name: _attempt_segment_resume
    semantic_anchors:
      resolve_cookies: "do not retain m3u8_url for exact quality merely because quality is not BEST"
      attempt_segment_resume: "replace the QualityKind.BEST-only refresh branch with a verified refresh path"
      binding_usage: "use refresh_stream/binding_from_selected and pass binding.media_playlist_url"
    notes: >
      _resolve_cookies must either refresh through refresh_stream or otherwise
      verify that an exact requested height is still represented by the binding.
      _attempt_segment_resume must not follow the old branch where EXACT keeps
      the stale address while only BEST gets a fresh URL. Both functions must
      propagate the binding's URL, cookies, and variant identity to the segment
      backend. Preserve the existing partial artifacts; never unlink .part.

  - path: src/vkdownloader/services/segment_downloader.py
    targets:
      - type: dataclass
        name: PlaylistFetchResult
      - type: function
        name: _refresh_token_and_retry
      - type: function
        name: _handle_token_refresh
      - type: function
        name: _fetch_playlist_with_retry
      - type: function
        name: download_hls_with_resume
    semantic_anchors:
      refresh_return: "propagate verified URL, cookies, and variant identity (not just address/cookies)"
      playlist_result: "add an optional stream_binding or variant_id field without breaking existing callers"
      fetch_retry: "on 403/410 use the refreshed binding's media_playlist_url and cookies; update checkpoint-relevant variant identity"
      download_entry: "thread stream_variant_id / stream_binding from the request into _run_download_session"
    notes: >
      _refresh_token_and_retry must use refresh_stream/select_exact_or_fail so a
      token refresh cannot silently change the requested quality. _handle_token_refresh
      forwards the same parameters unchanged. _fetch_playlist_with_retry applies
      refreshed credentials and URL, distinguishes playlist-level 403/410 from
      segment-level 403, and records the refreshed variant identity. Cached
      segments are reused only after the Block E checkpoint verifies the new
      variant id and fingerprint; otherwise quarantine_generation starts a new
      generation. No files are deleted on mismatch.

  - path: src/vkdownloader/models/dtos.py
    targets:
      - type: class
        name: HLSDownloadRequest
    semantic_anchors:
      optional_fields: "add stream_binding (optional) alongside stream_variant_id/video_id/playlist_fingerprint"
    notes: >
      Keep backward compatibility. Adapters read media_playlist_url, cookies,
      and variant_id from the binding when present, falling back to the
      existing loose fields.

  - path: src/vkdownloader/services/downloader.py
    targets:
      - type: function
        name: perform_download
    semantic_anchors:
      cookie_resolution: "propagate the binding returned by _resolve_cookies into the backend call"
    notes: >
      Thread the verified binding (or at least its URL/cookies/variant_id)
      through yt-dlp, auto, and segment paths so a backend switch cannot lose
      the requested quality. Do not add new backend-selection behavior here
      (Block H).

  - path: src/vkdownloader/services/checkpoint.py
    targets:
      - type: class
        name: JobCheckpoint
      - type: function
        name: verify_checkpoint
      - type: function
        name: quarantine_generation
    semantic_anchors:
      variant_identity: "stream_variant_id is the Block F binding's variant_id"
    notes: >
      No structural change required; Block F populates stream_variant_id through
      refresh_stream. Reuse verify_checkpoint before cached segment reuse and
      quarantine_generation on mismatch. Do not delete artifacts.

changes:
  - action: add_code
    description: >
      Add ErrorCode.QUALITY_MISMATCH to models/enums.py.
    code_hint: |
      QUALITY_MISMATCH = "quality_mismatch"

  - action: add_code
    description: >
      Add QualityMismatchError to exceptions.py with ErrorCode.QUALITY_MISMATCH.
    code_hint: |
      class QualityMismatchError(VKDownloadError):
          error_code = ErrorCode.QUALITY_MISMATCH
          requested: str | None = None
          available: list[str] = []
          actual_height: int | None = None

          def __init__(
              self,
              message: str | None = None,
              *,
              requested: str | None = None,
              available: list[str] | None = None,
              actual_height: int | None = None,
          ) -> None:
              self.requested = requested
              self.available = list(available) if available else []
              self.actual_height = actual_height
              super().__init__(
                  message if message is not None
                  else "Exact quality is unavailable or unverified"
              )

  - action: add_code
    description: >
      Create services/quality_refresh.py with the frozen StreamBinding dataclass
      and refresh/select/binding helpers.
    code_hint: |
      from dataclasses import dataclass

      @dataclass(frozen=True)
      class StreamBinding:
          media_playlist_url: str
          requested_quality: str
          actual_height: int | None = None
          variant_id: str = ""
          codecs: str | None = None
          cookies: object | None = None

      def select_exact_or_fail(candidates, requested_quality):
          # exact numeric requests require a verified matching height;
          # browser-captured "unknown"/height=None candidates are rejected.
          ...

      def binding_from_selected(selected, *, requested_quality=None, cookies=None):
          ...

      async def refresh_stream(original_vk_url, requested_quality, previous, extractor):
          fresh = await extractor.extract_streams(original_vk_url)
          selected = select_exact_or_fail(fresh.streams, requested_quality)
          result = binding_from_selected(
              selected, requested_quality=requested_quality, cookies=getattr(previous, "cookies", None)
          )
          if requested_quality.isdecimal() and result.actual_height != int(requested_quality):
              raise QualityMismatchError(
                  "Exact quality is unavailable or unverified",
                  requested=requested_quality,
                  available=[...],
                  actual_height=result.actual_height,
              )
          return result

