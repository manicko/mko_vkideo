id: block_e_checkpoint

title: "Block E — durable per-segment checkpoint and safe content identity"

priority: P0

depends_on:
  - block_b_preserve_partials
  - block_d_workspace

source_reference: .ai/plans/MKO_VKIDEO_Refactoring_Plan.md
source_section: "Block E — Durable per-segment checkpoint and safe content identity"
source_blocks:
  - "Block E — Durable per-segment checkpoint and safe content identity"

description: >
  Replace the destructive URL-hash stale-segment gate with a versioned,
  atomic, per-segment checkpoint that records content identity and SHA-256
  for every persisted segment. Add an HLS structure parser that derives a
  media identity (variant, codecs, resolution, media sequence, discontinuity
  sequence, init-map, playlist type, live/endlist) instead of hashing signed
  URLs. Persist checkpoint entries only after a segment is fully written to
  its .tmp and atomically renamed. Verify reused segments by size and
  streaming SHA-256; on mismatch or ambiguous identity, quarantine the old
  generation (rename, never delete) and start an isolated new generation.
  Thread the checkpoint through download_hls_with_resume and
  _run_download_session, using workspace.state_path or a derived legacy path.
  Define the Block F interface: checkpoint stores stream_variant_id;
  refresh_stream must produce a new variant id and the checkpoint must verify
  before cached segments are reused. Scope is strictly Block E: no quality
  refresh implementation (Block F), state machine (Block G), FFmpeg transport
  (Block H), or progress (Block I).

goals:
  - SegmentRecord and JobCheckpoint are Pydantic v2 BaseModel with extra="forbid".
  - Checkpoint writes are atomic (temp file + flush + fsync + os.replace + best-effort parent fsync).
  - Segment hashes use streaming SHA-256 in fixed chunks; no read_bytes() on large artifacts.
  - relative_file is confined to the owned segments directory; traversal/symlink escape is rejected.
  - schema_version is validated on load; unknown/malformed checkpoints fail closed without deleting files.
  - _clear_stale_segments URL-hash deletion is no longer called; checkpoint identity verification plus generation quarantine replaces it.
  - Token-only URL refresh reuses verified segments; changed bytes/variant quarantines old artifacts instead of mixing.
  - Crash before/after checkpoint publication leaves a recoverable state; corrupt segments are redownloaded individually.
  - No tokens, signed URLs, cookies, headers, or key material are stored in the checkpoint.

