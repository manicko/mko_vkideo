  - "Segment SHA-256 is computed with streaming reads; no read_bytes() on segment artifacts."
  - "relative_file confinement rejects absolute paths, '..' components, and resolved escapes."
  - "Unknown or malformed checkpoint fields fail closed without deleting files."
  - "schema_version mismatch prevents checkpoint reuse."
  - "Token-only URL refresh reuses verified segments when stream_variant_id and fingerprint match."
  - "Changed bytes or variant id does not reuse cached segments; the old generation is quarantined, not deleted."
  - "Crash before or after checkpoint publication leaves a recoverable state."
  - "Corrupt segment redownloads only that segment."
  - "No temporary or corrupt partial is marked verified."
  - "No tokens, signed URLs, cookies, headers, or key material are stored in the checkpoint."
