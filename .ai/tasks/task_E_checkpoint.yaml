changes:
  - action: add_code
    description: >
      Create services/checkpoint.py with SegmentRecord and JobCheckpoint Pydantic
      v2 models (extra="forbid"), CHECKPOINT_SCHEMA_VERSION, streaming SHA-256,
      relative-path confinement, atomic fsync write, safe load, segment
      verification, checkpoint compatibility verification, generation
      quarantine, and upsert helper.
    code_hint: |
      from pydantic import BaseModel, ConfigDict, Field

      CHECKPOINT_SCHEMA_VERSION = 1

      class SegmentRecord(BaseModel):
          model_config = ConfigDict(extra="forbid", frozen=True)
          sequence: int = Field(ge=0)
          relative_file: str
          size: int = Field(ge=0)
          sha256: str = Field(pattern=r"^[0-9a-f]{64}$")
          duration_seconds: float | None = None
          byte_range: str | None = None
          discontinuity_sequence: int = 0
          generation_id: str

      class JobCheckpoint(BaseModel):
          model_config = ConfigDict(extra="forbid")
          schema_version: int = CHECKPOINT_SCHEMA_VERSION
          video_id: str
          quality_requested: str
          stream_variant_id: str
          playlist_fingerprint: str
          generation_id: str = "gen-0"
          media_sequence: int | None = None
          discontinuity_sequence: int = 0
          init_map_identity: str | None = None
          codecs: str | None = None
          resolution: str | None = None
          is_live: bool = False
          endlist: bool = False
          segments: dict[str, SegmentRecord] = Field(default_factory=dict)
          updated_at: str | None = None

  - action: add_code
    description: >
      Create services/hls_parser.py with Pydantic models and parsers for master
      and media playlists, plus compute_playlist_fingerprint. Reject unsupported
      features explicitly.
    code_hint: |
      class UnsupportedHLSFeatureError(ValueError):
          pass

      def parse_media_playlist(text, *, base_url=None) -> HLSMediaPlaylist: ...
      def parse_master_playlist(text) -> list[HLSVariantIdentity]: ...
      def compute_playlist_fingerprint(variant, playlist) -> str: ...
      def normalize_segment_uri(uri, base_url=None) -> str: ...

  - action: modify_code
    description: >
      Add checkpoint-related parameters to download_hls_with_resume and
      _run_download_session. Derive state_path from workspace or legacy
      segments_dir. Reconcile existing segments with checkpoint identity; on
      mismatch or ambiguity, quarantine the old generation and create a new
      empty segments directory. Do not call _clear_stale_segments.
    code_hint: |
      if state_path is None:
          state_path = (
              workspace.state_path if workspace is not None
              else segments_dir / "state.json"
          )
      checkpoint = _reconcile_checkpoint(
          segments_dir=segments_dir,
          state_path=state_path,
          video_id=video_id,
          quality_requested=request.quality,
          stream_variant_id=stream_variant_id,
          playlist_fingerprint=playlist_fingerprint,
          segments=segments,
      )

  - action: modify_code
    description: >
      Extend DownloadPolicy with checkpoint fields and an asyncio.Lock. In
      _run_download_session, parse durations and fingerprint with hls_parser,
      write an initial checkpoint, and pass the lock and metadata into policy.
      In _download_segment_concurrent, after a successful segment write, upsert
      and atomically persist its SegmentRecord under checkpoint_lock.
    code_hint: |
      policy = DownloadPolicy(
          ...
          state_path=state_path,
          stream_variant_id=stream_variant_id,
          video_id=video_id,
          quality_requested=request.quality,
          playlist_fingerprint=playlist_fingerprint,
          generation_id=generation_id or "gen-0",
          segment_durations=segment_durations,
          checkpoint=checkpoint,
          checkpoint_lock=asyncio.Lock(),
      )

  - action: modify_code
    description: >
      Make _iter_pending_segment_tasks skip segments whose checkpoint record
      verifies (size and streaming SHA-256), while still downloading segments
      with missing or corrupt records.
