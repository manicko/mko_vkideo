assignee: Implementer

# ── Plan / Audit source ──
source_reference: .ai/plans/12-filesystem-artifacts-audit-fixes_fix.md
source_section: "§3.10 P12-B4 — say what the length bound bounds"

# ── Task description ──
description: >
  Decision D-2 is open. The criterion measured that a 777-character path is
  accepted on this host, so the platform does not enforce a limit that the
  product can rely on. Option (b) (bound the composed path) is rejected: the
  effective limit is host-dependent (260 for many APIs regardless of os
  reports), and the artifact has no evidence of a real long-path failure in
  the field. Option (a) is chosen: clarify the docstring to state that the
  title *component* is limited to 100 characters and that the composed
  output path is not length-bounded by this function.

# ── Goals ──
goals:
  - sanitize_title docstring names the title component as the bounded thing
  - sanitize_title docstring says plainly that the resulting path is not length-bounded
  - test_limits_length_to_100_characters passes unchanged
  - No production code change to the bound itself
  - Standing gate: G1/G2/G4/G6 exit 0, G5 non-increasing, G3 unchanged, skip count 3

# ── Implementation sequence ──
implementation_sequence:
  - step: 1
    action: modify_production
    target: src/vkdownloader/utils/security.py → sanitize_title docstring
    description: >
      Reword the docstring: "limits the result to 100 characters" →
      "limits the title component to 100 characters". Add a sentence stating
      plainly that the composed output path (including the ID suffix and
      output directory) is not length-bounded by this function — the platform
      enforces any path-length limit, not this code.
  - step: 2
    action: verify
    target: standing gate §7.1
    description: >
      Run pytest tests/test_security.py, ruff check src tests, ruff format
      --check src tests, mypy src, ruff check . — confirm exit 0 where applicable.

# ── Architectural constraints ──
architectural_constraints:
  docstring_only: >
    Option (a) is a docstring change only. No production code logic changes.
    The [:100] truncation and its position are untouched.
  no_test_edits: >
    TestSanitizeTitle::test_limits_length_to_100_characters passes unchanged.
    No tests are edited.
  honest_label: >
    The docstring explicitly names the *component* as the bounded thing, not
    "the result" which is ambiguous between the title and the full path.

# ── Files ──
files:
  - path: src/vkdownloader/utils/security.py
    targets:
      - type: function
        name: sanitize_title
    changes:
      - action: modify_docstring
        description: >
          Replace "limits the result to 100 characters" with "limits the
          title component to 100 characters". Replace "The length bound
          applies to this title component only, not to the full output path."
          with an explicit statement that the composed file path is not
          length-bounded by this function — the platform enforces any
          path-length limit.

# ── Required tests ──
required_tests:
  pinned_unmoved: >
    TestSanitizeTitle::test_limits_length_to_100_characters must pass
    unchanged — the bound value (100) and behaviour (truncate the component)
    are not altered.
  edge_cases_unchanged: >
    TestValidateOutputPathEdgeCases (3 tests) pass unchanged.
  traversal_tests_unchanged: >
    All traversal tests pass unchanged.

# ── Honest judgement required ──
honest_judgement:
  question: >
    Option (a) — record the bound as a title-component bound (docstring only)
    vs. option (b) — move the bound to the composed output path.
  criterion: >
    Does the product intend a path-length guarantee? Measured: a 777-character
    path is accepted on this host; a 260-character path is rejected on some
    APIs regardless of what os reports. The effective limit is host-dependent
    and not something the product can control. The artifact has no evidence of
    a real long-path failure in the field. This argues for (a).
  resolution: >
    Option (a) chosen. The docstring is clarified; no code change to the bound.
    Option (b) would require re-scoping the pinned test and adding a
    platform-dependent oracle — neither is justified by the measured evidence.

# ── Deliverable ──
deliverable:
  shape: One commit
  scope: >
    src/vkdownloader/utils/security.py (sanitize_title docstring only)
  commit_constraints:
    - One commit only
    - No test files edited
    - No production logic changed — docstring only
    - Commit subject describes the behaviour, not a file:line
    - Commit body notes D-2 resolution (option a chosen) and why

