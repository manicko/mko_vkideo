acceptance_criteria:
  - "JobPhase is a StrEnum with the five planned values."
  - "ProgressSnapshot is frozen and immutable."
  - "ProgressTracker never returns negative or non-finite ETA; returns None when insufficient data."
  - "snapshot_to_legacy distinguishes segments vs bytes by available counters."
  - "yt-dlp parser rejects pct outside [0, 100] and never reports downloaded > total."
  - "False TiB estimate and negative ETA samples are flagged is_estimate=True and eta_seconds=None."
  - "progress_callback API remains working via adapter."
  - "ProgressManager renders 1,895 segments as segments, not bytes."
  - "Rich reporter update_snapshot renders phase and ETA: unknown when None; no negative ETA."
  - "Multi-run anchoring preserves verified_segments from checkpoint/state machine on child restart."
  - "Batch progress isolation: two indices do not share snapshots."
  - "Malformed/non-progress lines do not crash parser or monitor."
