# Task spec for Block I - trustworthy progress, bytes, speed and ETA
# Generated by Planner. id: block_i_progress_eta

id: block_i_progress_eta

title: "Block I - Trustworthy progress, bytes, speed and ETA"

priority: P1

depends_on:
  - block_c_diagnostics
  - block_e_checkpoint
  - block_g_retry_state_machine

source_reference: .ai/plans/MKO_VKIDEO_Refactoring_Plan.md
source_section: "Block I - Trustworthy progress, bytes, speed and ETA"
source_blocks:
  - "Block I - Trustworthy progress, bytes, speed and ETA"

description: >
  Separate the overloaded (downloaded, total) progress callback into explicit
  units (segments vs bytes) and introduce a frozen ProgressSnapshot with a
  JobPhase, verified bytes on disk, network bytes this session, transfer rate,
  ETA, estimate flag, and attempt id. Add a sliding-window ProgressTracker for
  ETA. Preserve the legacy progress_callback API through an adapter until all
  callers (including batch) migrate. Replace the ProgressManager heuristic
  (total > 1024) with explicit unit-aware storage. Harden the yt-dlp parser
  against false TiB totals, out-of-bounds percentages, and negative/unknown ETA.
  Consume DownloadJobState counters (Block G) and checkpoint verified bytes
  (Block E) for multi-run anchoring; never roll job counters back on a child
  restart. Scope is strictly Block I: no Block J final validation.

goals:
  - JobPhase is a StrEnum with DOWNLOADING, REFRESHING_TOKEN, WAITING, MERGING, VERIFYING.
  - ProgressSnapshot is a frozen dataclass with the planned fields and safe defaults.
  - ProgressTracker computes transfer rate and ETA over a sliding window using verified samples.
  - Adapter converts ProgressSnapshot to the legacy (downloaded, total) tuple without losing units.
  - yt-dlp parser validates pct bounds, clamps downloaded <= total, flags estimates, parses ETA defensively.
  - progress_callback API is preserved through an adapter until all callers migrate.
  - ProgressManager no longer uses the total > 1024 heuristic; units are explicit.
  - Rich reporter gains update_snapshot with phase-aware, non-negative ETA rendering.
  - Batch and segment paths report snapshots anchored to checkpoint/state-machine counters.
  - Packaging manifest includes services/progress.py and tests/test_progress.py.

files:
  - path: src/vkdownloader/models/enums.py
    targets:
      - type: enum
        name: JobPhase
    semantic_anchors:
      add_after: ProgressStatus
    notes: >
      Add JobPhase StrEnum alongside existing enums. Keep it separately in models
      per project rule 10. Do not alter existing enum values. services/progress.py
      re-exports it for convenience.

  - path: src/vkdownloader/services/progress.py
    targets:
      - type: enum
        name: JobPhase
      - type: dataclass
        name: ProgressSnapshot
      - type: class
        name: ProgressTracker
      - type: function
        name: snapshot_to_legacy
      - type: function
        name: parse_ytdlp_eta
    semantic_anchors:
      snapshot: "ProgressSnapshot is frozen=True"
      tracker: "ProgressTracker.observe / transfer_rate_bytes_per_sec / eta_seconds"
      adapter: "snapshot_to_legacy(snapshot) -> tuple[int, int]"
    notes: >
      New module. Define JobPhase (or re-export from models.enums), ProgressSnapshot
      frozen dataclass, ProgressTracker with a sliding window (default 60s, clamped
      to 30-90s guidance), and adapter helpers. ProgressSnapshot fields: job_id,
      phase, verified_segments, expected_segments (int | None), verified_bytes_on_disk,
      network_bytes_this_session, transfer_rate_bytes_per_sec (float | None),
      eta_seconds (float | None), is_estimate, attempt_id, child_fragment_index,
      child_fragment_count, measured_at. ProgressTracker must never emit negative or
      non-finite ETA; return None when insufficient data. Provide eta_from_snapshot
      validation helper that clamps tiny/negative to None unless genuinely complete.

  - path: src/vkdownloader/services/ytdlp_downloader.py
    targets:
      - type: dataclass
        name: ProgressState
      - type: function
        name: _parse_ytdlp_progress_state
      - type: function
        name: _parse_ytdlp_progress
      - type: function
        name: _parse_ytdlp_eta
    semantic_anchors:
      progress_state_fields: "downloaded, total, fragment_index, fragment_count, is_estimate, eta_seconds"
      parser_validation: "pct in [0, 100]; downloaded <= total; eta_seconds None for dash/Unknown/negative"
      monitor: "_monitor_progress / _drain_output build ProgressSnapshot and invoke callbacks"
    notes: >
      Add eta_seconds field to ProgressState. Harden _parse_ytdlp_progress_state:
      validate pct bounds (return None if outside 0..100), clamp downloaded to total
      and mark is_estimate=True when derived downloaded exceeds total, flag is_estimate
      True for ~ and TiB totals (>= 1 TiB), parse ETA defensively via _parse_ytdlp_eta.
      Add progress_snapshot_callback parameter to download functions. In _monitor_progress
      and _drain_output, build a ProgressSnapshot from parsed state plus state-machine
      counters (verified_segments, expected_segments, verified_bytes, network_bytes,
      attempt_id) and job_id; invoke progress_snapshot_callback if provided and
      legacy progress_callback via snapshot_to_legacy adapter if provided. Do not
      roll back job-level counters on child restart (anchoring to checkpoint/state
      machine). Handle malformed lines without crashing.

  - path: src/vkdownloader/services/downloader.py
    targets:
      - type: function
        name: perform_download
    semantic_anchors:
      snapshot_callback_param: "progress_snapshot_callback"
      state_machine_counters: "verified_segments, expected_segments, verified_bytes, network_bytes_this_session, attempt_id"
    notes: >
      Thread progress_snapshot_callback through perform_download and into yt-dlp /
      segment calls. Build job_id from workspace or url. Pass state machine counters
      into snapshot construction. Preserve progress_callback adapter path.

  - path: src/vkdownloader/services/progress_display.py
    targets:
      - type: class
        name: RichProgressReporter
      - type: method
        name: update
      - type: method
        name: update_snapshot
    semantic_anchors:
      update_snapshot: "update_snapshot(index, snapshot) renders phase and non-negative ETA"
      legacy_adapter: "update remains and delegates to update_snapshot-derived values"
    notes: >
      Add update_snapshot(index, snapshot). Store last snapshot per index. Render phase
      text in description when not DOWNLOADING. Never show active transfer speed during
      waits/refresh/merge/verify. Render ETA as unknown when None; never negative.
      Keep update as adapter deriving (downloaded, total) via snapshot_to_legacy.
      Avoid rich TimeRemainingColumn misleading ETA during waits (custom column or
      description suffix).

  - path: src/vkdownloader/services/downloader_throttle.py
    targets:
      - type: class
        name: ProgressManager
    semantic_anchors:
      storage: "dict[int, tuple[int, int, str]] or ProgressSnapshot keyed by unit"
      remove_heuristic: "no total > 1024 branch"
    notes: >
      Replace heuristic with explicit unit-aware storage. Store value, total, and unit
      (or ProgressSnapshot). get_formatted_progress renders segments vs bytes based on
      stored unit, so 1,895 segments renders as segments even though > 1024. Unknown
      total renders downloaded only. Preserve async lock and update/update_sync/clear.

  - path: src/vkdownloader/services/batch_downloader.py
    targets:
      - type: function
        name: _on_progress
    semantic_anchors:
      snapshot: "_on_progress accepts ProgressSnapshot; passes to reporter.update_snapshot"
      legacy_adapter: "keep (video_id, downloaded, total) adapter"
    notes: >
      Make _on_progress accept either (video_id, downloaded, total) or a snapshot.
      Route snapshots to reporter.update_snapshot; keep legacy adapter for callers that
      still pass tuples. Ensure batch isolation: per-index snapshots do not share state.

  - path: src/vkdownloader/services/segment_downloader.py
    targets:
      - type: function
        name: _download_segment_concurrent
      - type: function
        name: download_segments
    semantic_anchors:
      verified_counts: "report ProgressSnapshot with verified segment counts from checkpoint/state machine"
    notes: >
      Report ProgressSnapshot with verified segment counts sourced from checkpoint/state
      machine, not raw counts only. Pass state machine/counters through. Do not claim
      byte totals when segments have variable sizes unless marked is_estimate.

  - path: src/vkdownloader/services/state_machine.py
    targets:
      - type: class
        name: DownloadJobState
      - type: class
        name: DownloadStateMachine
    semantic_anchors:
      convenience: "update_progress_counters() and progress snapshot accessor"
    notes: >
      Add convenience accessor update_progress_counters(verified_segments, expected_segments,
      verified_bytes, network_bytes) and a method to build a ProgressSnapshot-compatible
      dict. Counters already present; expose them read-only for progress. No new
      persistence semantics beyond existing persist().

  - path: tests/test_progress.py
    targets:
      - type: module
        name: test_progress
    semantic_anchors:
      new_file: "tests/test_progress.py"
    notes: >
      New test module covering parser validation, snapshot invariants, ProgressTracker ETA
      policy, adapter conversion, ProgressManager explicit units, and multi-run anchoring.

  - path: tests/test_hls_downloader.py
    targets:
      - type: class
        name: TestYtdlpProgressParsing
      - type: class
        name: TestYtdlpProgressLineDetection
    semantic_anchors:
      update: "add false TiB/negative ETA/out-of-bounds cases"
    notes: >
      Add RED tests for plan samples and invalid values. Do not weaken existing tests.

  - path: tests/test_progress_display.py
    targets:
      - type: class
        name: TestRichProgressReporter
    semantic_anchors:
      update: "add update_snapshot, phase, ETA unknown, TTY/non-TTY, unicode, batch isolation"
    notes: >
      Add coverage for update_snapshot path. Keep existing update tests passing via adapter.

  - path: tests/test_downloader_throttle.py
    targets:
      - type: class
        name: TestProgressManager
    semantic_anchors:
      update: "replace heuristic expectations with explicit unit"
    notes: >
      Update ProgressManager tests to assert segments render as segments even when > 1024.

  - path: tests/test_packaging.py
    targets:
      - type: constant
        name: EXPECTED_SDIST_ENTRIES
      - type: constant
        name: EXPECTED_WHEEL_ENTRIES
    semantic_anchors:
      add_entries: "src/vkdownloader/services/progress.py and tests/test_progress.py"
    notes: >
      Add services/progress.py and tests/test_progress.py to both manifest sets.

