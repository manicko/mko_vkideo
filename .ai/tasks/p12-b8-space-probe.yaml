source_spec_section: "§6.8 P12-B8 — space at both stages"

# ── Task description ──
description: >
  Two related fixes, one commit:

  (1) Download-stage free-space probe. The segment fan-out has no space
  precondition. Add a probe in segment_downloader._run_download_session, after
  the playlist is parsed and the working tree is created, before the fan-out
  begins. The probe checks shutil.disk_usage on segments_dir, estimates demand
  as segment_count × _DOWNLOAD_SEGMENT_BUDGET_BYTES (2 MB per segment), and
  raises DownloadError with the same hint shape as _check_merge_space when
  free space is insufficient. An unreadable mount logs and proceeds (mirrors
  _check_merge_space's OSError handling).

  (2) Merge multiplier. _required_merge_bytes in ffmpeg_utils.py still returns
  segment_bytes * 2 + margin; the landed additive merge holds segments + batch
  temps + final output = up to 3x. Change to segment_bytes * _MERGE_MULTIPLIER
  where _MERGE_MULTIPLIER = 3, with a named constant shared by
  _merge_segments_batched's batch_size (promoted from a local literal).

  Update the 3 pinned assertions in TestMergeFreeSpaceProbe (all three named
  and explained in the commit body). Update the ART-004 deferral comment in
  _merge_segments_batched to record the sizing is discharged. Add 5 tests in
  TestDownloadSpaceProbe covering the new download-stage probe.

# ── Goals ──
goals:
  - Add _check_download_space function in segment_downloader.py
  - Call _check_download_space in _run_download_session after tree creation, before fan-out
  - Change _required_merge_bytes multiplier from 2 to _MERGE_MULTIPLIER (3)
  - Add _MERGE_MULTIPLIER and _MERGE_BATCH_SIZE named constants in ffmpeg_utils.py
  - Update 3 TestMergeFreeSpaceProbe assertions (declared, not silent)
  - Update ART-004/ART-012 deferral comments in ffmpeg_utils.py
  - Add 5 tests in TestDownloadSpaceProbe in test_segment_downloader.py
  - Download-stage probe logs and proceeds on unreadable mount (no hard failure)

