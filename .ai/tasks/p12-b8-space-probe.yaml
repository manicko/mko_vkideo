# ── Honest judgement required ──
honest_judgement:
  question: >
    Where does the download-stage demand figure come from?
  criterion: >
    Can the download stage fail meaningfully before the merge? Segments are
    resumable, so a download-stage space failure is not catastrophic — unlike
    the merge's. That asymmetry argues for the cheap option (a) or (c), not
    the pump-internal (b).
  recommendation: >
    Option (a): a fixed per-segment budget (2 MB) multiplied by the segment
    count. Simplest, no pump-internal decision, and segments are resumable so
    the estimate's imprecision is survivable. The probe catches catastrophically
    undersized volumes, not edge cases.

