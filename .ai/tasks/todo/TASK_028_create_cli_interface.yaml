id: task_028
title: Create CLI interface with Typer

priority: medium

depends_on:
  - task_027
  - task_030

description: >
  Implement CLI using Typer with download command supporting URL input,
  quality selection, output path configuration, and progress display.

source_reference: .ai\plans\02-implementation-details.md
source_section: 10.4 Phase 4 Tasks (CLI)

files:
  - path: src/vkdownloader/cli.py
    targets:
      - type: function
        name: download
      - type: function
        name: _download
      - type: function
        name: batch_download

changes:
  - action: add_code
    description: Create download CLI command
    code_hint: |
      @app.command()
      def download(
          url: str = typer.Argument(..., help="VK Video URL"),
          quality: QualityEnum = typer.Option(QualityEnum.BEST, help="Video quality"),
          output: Path = typer.Option(".", help="Output directory")
      ):
          async def _download():
              async with VKVideoExtractor() as extractor:
                  video = await extractor.extract_streams(url)
              selector = QualitySelector()
              stream = selector.select(video.streams, quality)
              async with HLSDownloader() as downloader:
                  output_file = await downloader.download_stream(stream, str(output))
              print(f"Downloaded: {output_file}")
          asyncio.run(_download())
  - action: add_code
    description: Add batch download functionality
    code_hint: |
      @app.command()
      def batch(urls_file: Path, quality: QualityEnum = QualityEnum.BEST):
          urls = urls_file.read_text().splitlines()
          results = asyncio.run(batch_download(urls, quality))
          for url, output, status in results:
              print(f"{url}: {status}")

acceptance_criteria:
  - Single video download works via CLI
  - Quality selection parameter functional
  - Batch download from file supported
  - Progress display with tqdm
  - Help text available for all commands