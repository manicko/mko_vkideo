id: TASK_011_cli_002_003_006_exception_handling
source_reference:
  - .ai/audit/99-validation/01-cli-validated.md
  - .ai/audit/99-validation/08-quality-validated.md
source_section: CLI-002, CLI-003, QLT-006
source_finding: CLI-002, CLI-003, QLT-006

title: Add structured exception fields and logging in CLI error handling
priority: medium
status: pending

description: >
  QualityNotAvailableError carries semantic data (requested quality + available list) but only as a
  formatted string. The CLI parses this string using split("'"). Also, generic `except Exception`
  discards errors without logging. Additionally, QLT-006 notes that cli.py reaches into
  ProgressManager._state directly instead of using the public update() method.

goals:
  - Add structured fields (requested, available) to QualityNotAvailableError
  - Replace string parsing with structured field access
  - Add logger.exception() call before user-facing error message
  - Replace direct _state access with public update() method

files:
  - path: src/vkdownloader/exceptions.py
    targets:
      - type: class
        name: QualityNotAvailableError
    semantic_anchors:
      extend:
        type: exception_fields
  - path: src/vkdownloader/cli.py
    targets:
      - type: function
        name: download_or_return_streams
      - type: line_range
        name: QualityNotAvailableError handling 161-172
    semantic_anchors:
      update:
        type: exception_handler
        value: QualityNotAvailableError
  - path: src/vkdownloader/cli.py
    targets:
      - type: function
        name: _run_batch_with_progress
    semantic_anchors:
      update:
        type: direct_attribute_access
        value: _progress_manager._state
  - path: src/vkdownloader/services/downloader_throttle.py
    targets:
      - type: method
        name: ProgressManager.update
    semantic_anchors:
      verify: exists

changes:
  - action: modify_class
    description: >
      Add requested: str and available: list[str] fields to QualityNotAvailableError.
    code_hint: |
      class QualityNotAvailableError(Exception):
          requested: str
          available: list[str]
          def __init__(self, requested: str, available: list[str]):
              self.requested = requested
              self.available = available
              super().__init__(f"Quality '{requested}' not available. Available: {available}")

  - action: modify_handler
    description: >
      Replace string parsing with structured field access.
    code_hint: |
      # Replace lines 163-166:
      requested = error.requested
      available = error.available  # list[str], no parsing needed

  - action: add_logging
    description: >
      Add logger.exception() before the generic error message.
    code_hint: |
      except Exception as e:
          logger.exception("download_failed")
          console.print(f"[red]Error: {e}[/red]")

  - action: modify_access
    description: >
      Replace _progress_manager._state[url_index] = (downloaded, total) with public method.
    code_hint: |
      _progress_manager.update(url_index, downloaded, total)

acceptance_criteria:
  - QualityNotAvailableError has structured fields
  - CLI uses field access instead of string parsing
  - Generic exceptions logged before user message
  - ProgressManager uses public API