id: task_segment_task_dataclass
title: Create SegmentTask dataclass to reduce segment_downloader parameters
priority: medium
source_reference: .ai/audit/99-validation/09-structural-quality-validated-findings.md
source_section: STR-004
description: >
  _download_segment_concurrent has 13 parameters (2.5x limit). Group HTTP
  plumbing, rate-limiting, and identity concerns into cohesive SegmentTask
  and DownloadPolicy dataclasses.
files:
  - path: src/vkdownloader/services/segment_downloader.py
    targets:
      - type: function
        name: _download_segment_concurrent
      - type: function
        name: _create_segment_download_tasks
semantic_anchors:
      - after:
          type: function
          name: _await_first_and_cancel_others
changes:
  - action: add_code
    description: >
      Define SegmentTask and DownloadPolicy dataclasses to bundle related params.
  - action: modify_code
    description: >
      Refactor _download_segment_concurrent and _create_segment_download_tasks
      to use dataclass parameters.
goals:
  - Parameter counts reduced to 5 or fewer
  - Logical grouping of concerns
  - Cleaner call sites
acceptance_criteria:
  - SegmentTask dataclass defined
  - DownloadPolicy dataclass defined
  - Functions refactored
  - Tests pass