id: task_segment_integrity_check
title: Remove size-based early-return to re-fetch potentially corrupt segments
priority: mandatory
source_reference: .ai/audit/99-validation/06-data-flow-validated-findings.md
source_section: DF-004
description: >
  Segment resume treats non-empty .ts files as valid. Partial files from
  interrupted writes would be concatenated silently, producing corrupt output.
  Remove the size-based early return to re-download potentially corrupt segments.
files:
  - path: src/vkdownloader/services/segment_downloader.py
    targets:
      - type: method
        name: _download_segment_concurrent
semantic_anchors:
      - type: if_statement
        condition: "segment_path.exists() and segment_path.stat().st_size > 0"
changes:
  - action: remove_code
    description: >
      Remove the early-return check at line 563-564 that skips re-download
      for non-empty files. Files open in "wb" mode so re-download overwrites.
  - action: modify_code
    description: >
      Remove the size > 0 filter in _create_segment_download_tasks (lines 645-646)
      so partially-written segments are always re-fetched.
goals:
  - Corrupt/partial segments always re-fetched
  - Silent corruption eliminated
  - Merge only processes fresh downloads
acceptance_criteria:
  - No size-based early return
  - Segments re-downloaded on retry
  - Tests pass