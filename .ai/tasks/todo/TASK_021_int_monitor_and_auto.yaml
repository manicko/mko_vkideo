id: TASK_021_int_monitor_and_auto

title: NetworkMonitor size guard and AUTO-mode browser-skip alignment

priority: low

# ── Plan/Audit report source ──
source_reference: .ai/audit/99-validation/05-audit-integrations-validated-findings.md
source_section: INT-007 (advisory), INT-003 (advisory), INT-008 (advisory)
source_blocks:
  - "INT-007: NetworkMonitor intercepts all video JSON responses"
  - "INT-003: auto + cookie_source=BROWSER launches the browser"
  - "INT-008: download_timeout semantics unclear"

description: >
  Three independent integration advisories:
  - INT-007: in `network_monitor.NetworkMonitor._intercept_response`, add a size guard
    (check content-length < ~1MB) before calling `response.json()`, to avoid reading
    oversized/non-JSON bodies.
  - INT-003: in `downloader.perform_download` AUTO case, skip `_resolve_cookies` when
    `settings.cookie_source == CookieSource.NONE` (documented behavior: auto + none should
    not involve the browser).
  - INT-008: in config.py add a clear docstring to the `download_timeout` Field:
    "HTTP client timeout in seconds for individual segment requests and playlist fetches."

  NOTE: INT-004 (CookieSource.FILE) is already consolidated into TASK_001.

goals:
  - monitor does not read oversized JSON bodies
  - AUTO + cookie_source=none does not launch browser
  - download_timeout semantics documented

files:
  - path: src/vkdownloader/infrastructure/network_monitor.py

    targets:
      - type: function
        name: NetworkMonitor._intercept_response

    semantic_anchors:
      insert_before:
        type: function_call
        value: response.json

    changes:
      - action: modify_code
        description: >
          INT-007: add content-length size guard before response.json().

  - path: src/vkdownloader/services/downloader.py

    targets:
      - type: function
        name: perform_download

    semantic_anchors:
      insert_before:
        type: function_call
        value: _resolve_cookies

    changes:
      - action: modify_code
        description: >
          INT-003: in AUTO case, skip _resolve_cookies when cookie_source == NONE.

  - path: src/vkdownloader/config.py

    targets:
      - type: class
        name: Settings

    semantic_anchors:
      insert_after:
        type: function_call
        value: Field

    changes:
      - action: modify_code
        description: >
          INT-008: add descriptive docstring to download_timeout Field.

acceptance_criteria:
  - _intercept_response skips bodies >= 1MB before json parse
  - AUTO + cookie_source=none does not call _resolve_cookies
  - download_timeout Field has explanatory docstring
  - ruff + mypy clean
