id: TASK_005_cfg_002_remove_download_method
source_reference: .ai/audit/99-validation/02-config-validated.md
source_section: CFG-002
source_finding: CFG-002

title: Remove unused download_method field from Settings
priority: medium
status: pending

depends_on_previous_task_in_chain: TASK_004_cfg_005_remove_dead_singleton

description: >
  Settings.download_method (default DownloadMethod.AUTO, env var VKDOWNLOADER_DOWNLOAD_METHOD) is
  documented but never read anywhere. The download method is decided exclusively by the CLI --method
  option. This dead field misleads users about non-functional env var support.

goals:
  - Remove download_method field from Settings class
  - Remove download_method from documentation

files:
  - path: src/vkdownloader/config.py
    targets:
      - type: field
        name: download_method
    semantic_anchors:
      remove:
        type: pydantic_field
        value: download_method
  - path: docs/11-guides/configuration.md
    targets:
      - type: documentation_section
        name: download_method field documentation
    semantic_anchors:
      remove:
        type: env_var_documentation
        value: download_method

changes:
  - action: remove_code
    description: >
      Remove download_method field definition from Settings class.
    code_hint: |
      # Remove lines 75-78:
      # download_method: DownloadMethod = Field(default=DownloadMethod.AUTO, env="VKDOWNLOADER_DOWNLOAD_METHOD")

  - action: remove_code
    description: >
      Remove download_method documentation from configuration.md.
    code_hint: |
      # Remove the download_method row from env var documentation table

acceptance_criteria:
  - download_method field removed from Settings
  - Documentation updated to remove misleading env var
  - CLI still functions with --method option