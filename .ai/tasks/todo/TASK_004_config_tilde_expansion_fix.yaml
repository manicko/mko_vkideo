id: task_config_tilde_expansion
title: Add field_validator for tilde expansion on Path config fields
priority: mandatory
source_reference: .ai/audit/99-validation/02-config-validated-findings.md
source_section: CFG-001
description: >
  download_dir and log_file Path fields do not expand tilde (~) when provided via
  environment variables. Pydantic stores raw Path("~/...") without expanding. Add
  field_validator to call Path.expanduser().resolve() on these fields.
files:
  - path: src/vkdownloader/config.py
    targets:
      - type: field
        name: download_dir
      - type: field
        name: log_file
semantic_anchors:
  - insert_after:
      type: field
      name: download_dir
  - insert_after:
      type: field
      name: log_file
changes:
  - action: add_code
    description: >
      Add field_validator(mode='after') on download_dir and log_file fields to
      expand tildes and resolve paths to absolute form.
    code_hint: |
      @field_validator('download_dir', 'log_file', mode='after')
      @classmethod
      def expand_tilde_paths(cls, v: Path | None) -> Path | None:
          if v is None:
              return v
          return v.expanduser().resolve()
goals:
  - Tilde expansion works for download_dir from .env
  - Tilde expansion works for log_file from .env
  - Paths stored as absolute after validation
acceptance_criteria:
  - Path("~/Downloads/vkdownloader") expands correctly
  - Path("~") / "relative" patterns work
  - No breaking changes to default behavior
  - Tests pass