id: task_029
title: Add unit and integration tests

priority: medium

depends_on:
  - task_028

description: >
  Create comprehensive tests for Video model parsing, QualitySelector logic,
  and HLSDownloader functionality. Include mock fixtures for m3u8 content.

source_reference: .ai\plans\03-testing-and-deployment.md
source_section: 11.1 Unit Tests

files:
  - path: tests/__init__.py
    targets:
      - type: file
        name: __init__.py
  - path: tests/conftest.py
    targets:
      - type: fixture
        name: test_settings
      - type: fixture
        name: sample_video_url
      - type: fixture
        name: mock_m3u8_content
  - path: tests/test_models.py
    targets:
      - type: test_function
        name: test_video_model_creation
      - type: test_function
        name: test_stream_model_with_quality
  - path: tests/test_quality_selector.py
    targets:
      - type: test_function
        name: test_select_best_quality
      - type: test_function
        name: test_select_worst_quality
      - type: test_function
        name: test_fallback_to_best
  - path: tests/test_extractor.py
    targets:
      - type: test_function
        name: test_parse_video_id_valid
      - type: test_function
        name: test_parse_video_id_invalid

changes:
  - action: add_test
    description: Create test fixture for mock m3u8 content
    code_hint: |
      @pytest.fixture
      def mock_m3u8_content():
          return '''#EXTM3U
#EXT-X-STREAM-INF:BANDWIDTH=4684000,RESOLUTION=1920x804
https://example.com/1080p.m3u8'''
  - action: add_test
    description: Test quality selector chooses best stream
    code_hint: |
      def test_select_best_quality():
          selector = QualitySelector()
          streams = [Stream(quality="240", ...), Stream(quality="1080", ...)]
          result = selector.select(streams, QualityEnum.BEST)
          assert result.quality == "1080"

acceptance_criteria:
  - All unit tests pass
  - Integration tests mock network responses correctly
  - Coverage > 80% for core modules
  - pytest-asyncio properly configured