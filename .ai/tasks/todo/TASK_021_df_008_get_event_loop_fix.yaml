  and can cause issues in some async configurations.

goals:
  - Replace get_event_loop() with get_running_loop()
  - Ensure compatibility with async patterns

files:
  - path: src/vkdownloader/services/extractor.py
    targets:
      - type: function
        name: _extract_with_ytdlp
    semantic_anchors:
      modify:
        type: method_call
        value: line 194

changes:
  - action: replace
    description: >
      Replace asyncio.get_event_loop() with asyncio.get_running_loop().
    code_hint: |
      # loop = asyncio.get_event_loop()
      # ->
      loop = asyncio.get_running_loop()

acceptance_criteria:
