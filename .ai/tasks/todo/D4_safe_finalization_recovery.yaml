acceptance_criteria:
  - An independent completeness proof exists for interrupted .part - D3 identity match + ffprobe
    MPEG-TS container/height/duration + DTS continuity (backward jumps <= declared
    discontinuities, final timestamp within duration tolerance).
  - A proven complete TS is remuxed with ffmpeg -c copy (and -bsf:a aac_adtstoasc for AAC) into a
    unique staging temp, validated as MP4, and atomically replaces staging; source TS is preserved
    on any failure.
  - Durable completion evidence reuses the persisted identity fields plus optional
    artifact_expected_duration_seconds (default None for old state files).
  - deep_decode=True is used only on the D4 recovery path or an explicit request; ordinary
    finalization keeps it False.
  - job_lock is held through final validation, state persistence, and cleanup in both
    _download_with_ytdlp_result and the PUBLISH_STAGING recovery path.
  - reconcile_commit_state verifies generation/variant/fingerprint/init-map identity for final and
    staging candidates and returns DESTINATION_CONFLICT when an existing final cannot be proven;
    no overwrite occurs.
  - _ytdlp_candidate_path consults classify_ytdlp_artifacts and does not expose ambiguous or
    foreign .part.
  - CommitRecoveryDirective includes DESTINATION_CONFLICT.
  - test_media_validation, test_workspace, test_download_state, and test_ytdlp_downloader pass
    for remux, completeness proof, lock holding, identity verification, and destination conflict.
  - ruff and mypy pass for changed Python files.
  - Execution plan status for D4 is updated.

verification_steps:
  - uv run ruff check src/vkdownloader/services/media_validation.py src/vkdownloader/services/state_machine.py src/vkdownloader/services/state_migration.py src/vkdownloader/services/ytdlp_downloader.py src/vkdownloader/services/downloader.py
  - uv run mypy src/vkdownloader/services/media_validation.py src/vkdownloader/services/state_machine.py src/vkdownloader/services/state_migration.py src/vkdownloader/services/ytdlp_downloader.py src/vkdownloader/services/downloader.py
  - uv run pytest tests/test_media_validation.py tests/test_workspace.py tests/test_download_state.py tests/test_ytdlp_downloader.py -q

constraints:
  - No production code distortion for tests; do not change production source in this planning task.
  - Preserve old state files via defaults (artifact_expected_duration_seconds defaults to None).
  - No-clobber: never overwrite an existing final; publish_verified_file remains the hard guard.
  - Cleanup only after a confirmed result (final validation + state persistence).
  - Hold job_lock across final validation, persistence, and cleanup; release in finally.
  - Semantic anchors only; no line numbers.
  - Do not change audit phase files.
  - deep_decode remains off for ordinary finalization.
  - Legacy discovery remains read-only.
  - Quarantine remains rename-only; no media copy.
