id: fix_ffmpeg_cookie_exposure
source_reference: .ai/audit/99-validation/04-security-validated-findings.md
source_section: SEC-001
priority: high
status: blocked
blocked_by: TASK_010_research_ffmpeg_header_safety

title: Fix VK session cookies passed as ffmpeg command-line arguments

description: >
  When cookie_source = browser, VK session cookies (including remixsid) are passed
  to ffmpeg as -headers command-line arguments. This exposes session tokens in
  process listings (ps, /proc/<pid>/cmdline, htop, docker inspect).

goals:
  - prevent cookies from appearing in process argument list
  - use file-based header input for ffmpeg instead of CLI args
  - maintain existing download functionality

files:
  - path: src/vkdownloader/services/downloader.py
    targets:
      - type: method
        name: _build_ffmpeg_cmd
  - path: src/vkdownloader/services/downloader.py
    targets:
      - type: method
        name: download_with_ffmpeg

changes:
  - action: add_code
    description: >
      Create temporary file with cookie headers and use @filename syntax
      in ffmpeg invocation, or sanitize headers before subprocess call

acceptance_criteria:
  - no cookies visible in process argument list
  - downloads with browser cookies still work
  - security scan shows no secret exposure vectors

risk_assessment: risky
risk_reason: >
  Modifies process invocation security. Risk of breaking download functionality
  if temporary file handling is incorrect.