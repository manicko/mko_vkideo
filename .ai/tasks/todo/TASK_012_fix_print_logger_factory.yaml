id: fix_print_logger_factory
source_reference: .ai/audit/99-validation/08-quality-validated-findings.md
source_section: QLT-006
priority: low

title: Replace PrintLoggerFactory with proper logging factory

description: >
  setup_logging uses structlog.PrintLoggerFactory() which internally uses print().
  This violates project rule #12 "No print() Statements - use proper logging".

goals:
  - replace PrintLoggerFactory with WriteLoggerFactory or stdlib.LoggerFactory
  - ensure output goes through proper logging layer
  - maintain current console output format

files:
  - path: src/vkdownloader/config.py
    targets:
      - type: function
        name: setup_logging

changes:
  - action: modify_import
    description: >
      Replace structlog.PrintLoggerFactory() with structlog.WriteLoggerFactory(sys.stdout)
      or structlog.stdlib.LoggerFactory() wired to logging.

acceptance_criteria:
  - no print() usage in logging path
  - output format preserved
  - logging integration works correctly