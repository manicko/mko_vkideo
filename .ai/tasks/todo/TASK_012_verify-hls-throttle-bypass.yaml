id: task_012_verify_hls_throttle_bypass
title: Verify HLS throttle bypass implementation

priority: high

type: verification

depends_on:
  - task_008_add_downloader_tests

verifies:
  - task_001_add_hls_throttle_settings
  - task_004_update_ytdlp_options
  - task_006_integrate_browser_cookies_ytdlp
  - task_007_parallelize_segment_download

verification_steps:
  - build: uv build or pytest --collect-only
  - test: pytest tests/test_config.py tests/test_hls_downloader.py -v
