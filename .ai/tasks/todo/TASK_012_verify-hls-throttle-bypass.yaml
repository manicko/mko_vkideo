failure_action: return affected tasks to rework

notes: >
  This verification task validates the complete HLS throttle bypass
  implementation. It should be run after all implementation tasks
  (task_001 through task_008) complete successfully.
  
  The optional AdaptiveThrottle integration (task_010, task_011) is not
  included in this verification as it requires separate research and
  approval before implementation.