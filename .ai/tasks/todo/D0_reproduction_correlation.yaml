acceptance_criteria:
  - Slow HTTP and local file conflict are distinguishable by independent signals (diagnostic events + fixture behaviors).
  - child_started and child_exit events are persisted even on fast process exit.
  - Artifact snapshots are captured only outside active writes and contain relative names + sizes (None on OSError).
  - Bounded final drain enforces time + volume caps and logs truncation.
  - Windows descriptor helper is platform-guarded and omits FILE_SHARE_DELETE.
  - Existing tests remain green; new tests cover fixture behaviors and diagnostic events.
  - Process Monitor guidance documented in docs/11-guides/troubleshooting.md.

