  - id: research_ffmpeg_header_safety
    order: 1
    depends_on: []
    priority: high
    
  # === PHASE 2: Security Implementation (depends on research) ===
  - id: fix_ffmpeg_cookie_exposure
    order: 2
    depends_on:
      - research_ffmpeg_header_safety
    priority: high
    risk: risky
    
  # === PHASE 3: Critical Functionality Fixes ===
  - id: fix_batch_exit_code
    order: 3
    depends_on: []
    priority: high
