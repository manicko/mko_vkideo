# Task Execution Order
# Generated from validated audit findings
# Tasks with no dependencies can execute in parallel

tasks:
  # Phase 01: CLI Fixes (can execute in parallel)
  - id: task_cli_videonotfound
    depends_on: []
    parallel_group: cli-fixes

  - id: task_cli_batch_exception
    depends_on: []
    parallel_group: cli-fixes

  # Phase 02: Config Fixes - CFG-002 must precede CFG-001 (users need correct prefixes)
  - id: task_config_installation_prefix
    depends_on: []
    parallel_group: config-docs

  - id: task_config_tilde_expansion
    depends_on:
      - task_config_installation_prefix
    parallel_group: config-core

  # Phase 02: Config Removal - safe after prefix fix
  - id: task_accept_language_removal
    depends_on:
      - task_config_installation_prefix

  # Phase 03: Services Fixes (low risk, can be parallel with CLI)
  - id: task_cookies_netscape_format
    depends_on: []
    parallel_group: services-fixes

  - id: task_api_reference_cookiesource
    depends_on: []
    parallel_group: docs-fixes

  # Phase 03: Documentation for SSL verify (was in CLI-003)
  - id: task_cli_ssl_verify_docs
    depends_on: []
    parallel_group: docs-fixes

  # Phase 05: Integration Fixes
  - id: task_active_processes_cleanup
    depends_on: []
    parallel_group: integration-fixes

  - id: task_ffmpeg_stdout_devnull
    depends_on: []
    parallel_group: integration-fixes

  - id: task_ytdlp_timeout_config
    depends_on: []
    parallel_group: integration-fixes

  - id: task_browser_wait_config
    depends_on:
      - task_accept_language_removal

  - id: task_auto_cookie_resolution
    depends_on: []
    parallel_group: integration-fixes

  # Phase 05: Segment Observability
  - id: task_segment_retry_result
    depends_on: []
    parallel_group: segment-fixes

  # Phase 06: Data Flow Fixes
  - id: task_segment_integrity_check
    depends_on: []
    parallel_group: segment-fixes

  # Phase 08: Quality Improvements (can be parallel)
  - id: task_dead_code_cleanup
    depends_on: []
    parallel_group: quality-fixes

  # Phase 09: Structural Refactoring (can be parallel)
  - id: task_ffmpeg_helper_extraction
    depends_on: []
    parallel_group: refactoring

  - id: task_download_context_dataclass
    depends_on: []
    parallel_group: refactoring

  - id: task_segment_task_dataclass
    depends_on: []
    parallel_group: refactoring

  - id: task_ytdlp_opts_extraction
    depends_on: []
    parallel_group: refactoring

  # QLT-004 depends on all downloader refactoring being complete
  - id: task_hls_download_request_refactor
    depends_on:
      - task_ffmpeg_helper_extraction
      - task_download_context_dataclass
      - task_segment_task_dataclass
      - task_ytdlp_opts_extraction

  # Verification for multi-stage refactoring work
  - id: task_verify_structural_refactoring
    type: verification
    depends_on:
      - task_hls_download_request_refactor
    verifies:
      - task_ffmpeg_helper_extraction
      - task_download_context_dataclass
      - task_segment_task_dataclass
      - task_ytdlp_opts_extraction
      - task_hls_download_request_refactor

  # Trivial fix last
  - id: task_test_trailing_newline
    depends_on: []

# Parallel Execution Groups
# =========================
# cli-fixes: task_cli_videonotfound, task_cli_batch_exception
# config-docs: task_config_installation_prefix, task_cli_ssl_verify_docs
# config-core: task_config_tilde_expansion, task_accept_language_removal
# services-fixes: task_cookies_netscape_format
# docs-fixes: task_api_reference_cookiesource, task_cli_ssl_verify_docs
# integration-fixes: task_active_processes_cleanup, task_ffmpeg_stdout_devnull, task_ytdlp_timeout_config, task_browser_wait_config, task_auto_cookie_resolution
# segment-fixes: task_segment_retry_result, task_segment_integrity_check
# quality-fixes: task_dead_code_cleanup
# refactoring: task_ffmpeg_helper_extraction, task_download_context_dataclass, task_segment_task_dataclass, task_ytdlp_opts_extraction, task_hls_download_request_refactor