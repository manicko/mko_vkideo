id: TASK_019_int_browser_lifecycle

title: Fix Playwright subprocess leak and browser shutdown on interruption

priority: medium

# ── Plan/Audit report source ──
source_reference: .ai/audit/99-validation/05-audit-integrations-validated-findings.md
source_section: INT-001 (MEDIUM, mandatory resource lifecycle), INT-002 (advisory)
source_blocks:
  - "INT-001: BrowserManager leaks the Playwright subprocess when launch fails in __aenter__"
  - "INT-002: Playwright browser is not stopped on interruption mid-extraction"

description: >
  INT-001: `BrowserManager.__aenter__` assigns `self.playwright` then calls
  `await playwright_instance.chromium.launch(...)`. If launch raises, `__aexit__` is never
  called and the orphaned Playwright subprocess leaks. Wrap the launch in try/except,
  call `await playwright_instance.stop()` on failure before re-raising, and assign to
  `self` only after a successful launch (assign to a local first).

  INT-002: in `extractor._extract_with_browser`, add a shutdown-event check after the
  `browser_pre_interaction_wait` and `browser_post_interaction_wait` sleeps; raise
  `asyncio.CancelledError()` when shutdown is detected so the BrowserManager context
  manager cleanly closes the browser on interruption.

goals:
  - no Playwright subprocess leak on launch failure
  - browser stops cleanly on Ctrl+C mid-extraction

files:
  - path: src/vkdownloader/infrastructure/browser.py

    targets:
      - type: function
        name: BrowserManager.__aenter__

    semantic_anchors:
      insert_after:
        type: function_call
        value: chromium.launch

    changes:
      - action: modify_code
        description: >
          INT-001: try/except around launch; stop playwright on failure; assign to self
          only after success.

  - path: src/vkdownloader/services/extractor.py

    targets:
      - type: function
        name: VKVideoExtractor._extract_with_browser

    semantic_anchors:
      insert_after:
        type: function_call
        value: browser_post_interaction_wait

    changes:
      - action: modify_code
        description: >
          INT-002: check shutdown event after the pre/post interaction waits and raise
          asyncio.CancelledError() when set.

acceptance_criteria:
  - launch failure cleans up the playwright subprocess (no orphan)
  - Ctrl+C during browser extraction triggers clean browser shutdown
  - ruff + mypy clean
