id: task_006_replace_any_with_typechecking
title: Replace Any type hints with TYPE_CHECKING forward references
priority: low
depends_on: []
source_reference: \.ai\audit\99-validation\08-quality-validated.md
source_section: QLT-003
description: >
  Replace Any type hints in dtos.py and downloader.py with proper forward
  references using TYPE_CHECKING imports. This improves type safety and
  follows project rule #9 (Type Safety Everywhere).

goals:
  - Remove Any imports and usage in models/dtos.py
  - Remove Any imports and usage in services/downloader.py
  - Use TYPE_CHECKING for forward references

files:
  - path: src/vkdownloader/models/dtos.py
    targets:
      - type: import_statement
        name: from typing import Any
      - type: function
        name: HLSDownloadRequest
    semantic_anchors:
      - replace_import: use TYPE_CHECKING
      - modify_annotations: use forward references
    changes:
      - action: modify_code
        description: Replace Any with TYPE_CHECKING imports and string annotations
        code_hint: |
          # Before:
          # from typing import Any
          # After:
          from __future__ import annotations
          from typing import TYPE_CHECKING
          
          if TYPE_CHECKING:
              from vkdownloader.config import Settings
              from vkdownloader.services.downloader_throttle import URLBackoffCoordinator
          
          # Then use:
          # settings: Settings | None = None  (instead of Any)
          # backoff_coordinator: URLBackoffCoordinator | None = None

  - path: src/vkdownloader/services/downloader.py
    targets:
      - type: import_statement
        name: from typing import Any
    semantic_anchors:
      - replace_import: remove Any, use TYPE_CHECKING
    changes:
      - action: modify_code
        description: Remove Any and add TYPE_CHECKING imports for backoff_coordinator typing

acceptance_criteria:
  - MyPy type checking passes
  - No Any type hints remain in affected files
  - All imports resolve correctly