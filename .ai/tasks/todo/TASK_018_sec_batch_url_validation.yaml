id: TASK_018_sec_batch_url_validation

title: Validate batch URL file entries before enqueueing

priority: low

# ── Plan/Audit report source ──
source_reference: .ai/audit/99-validation/04-audit-security-validated-findings.md
source_section: SEC-003 (LOW, advisory)
source_blocks:
  - "SEC-003: Batch URL file content is not validated before use"

description: >
  In `batch_download`, the URL list file is read and each non-empty, non-comment line is
  passed straight to the extractor. Malformed/non-VK URLs only fail later inside
  `parse_video_id` with a generic ValueError, and the batch loop swallows per-URL errors
  into a summary, so a bad entry is easy to miss.

  Fix: before enqueueing, validate each batch line against the VK URL pattern (or a
  scheme/host allowlist). Log a clear per-line warning for rejected entries and skip them.
  Reuse the existing `VIDEO_ID_PATTERN` already used by `parse_video_id` in extractor.py.

goals:
  - early reject of malformed/non-VK URLs in batch input
  - clear per-line warning for rejected entries
  - no silent partial failures in batch mode

files:
  - path: src/vkdownloader/cli.py

    targets:
      - type: function
        name: batch_download

    semantic_anchors:
      # The line-splitting loop that enqueues each URL.
      insert_before:
        type: function_call
        value: read_text

    changes:
      - action: add_code
        description: >
          Add per-line VK-URL pattern validation before enqueue; warn and skip rejects.

acceptance_criteria:
  - malformed line produces a clear warning and is skipped (not enqueueed)
  - valid VK URLs still enqueueed normally
  - batch summary reflects skipped entries
  - ruff + mypy clean
