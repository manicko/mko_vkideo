id: fix_cookie_formatting_limits
source_reference: .ai/audit/99-validation/05-integrations-validings.md
source_section: INT-007
priority: medium

title: Fix cookie formatting truncation and hardcoded domain

description: >
  _format_cookies_for_ffmpeg joins only first 20 cookies into ffmpeg headers.
  _cookies_to_netscape hardcodes .vkvideo.ru for all cookies. Both issues
  cause incorrect cookie handling.

goals:
  - remove unconditional 20-cookie limit or add warning
  - use actual cookie domain instead of hardcoded .vkvideo.ru
  - maintain cookie functionality for ffmpeg

files:
  - path: src/vkdownloader/services/extractor.py
    targets:
      - type: function
        name: _format_cookies_for_ffmpeg
  - path: src/vkdownloader/services/cookies.py
    targets:
      - type: function
        name: _cookies_to_netscape

changes:
  - action: modify_code
    description: >
      Remove or warn on cookie truncation. Use cookie.domain per-cookie instead
      of hardcoded .vkvideo.ru in _cookies_to_netscape.

acceptance_criteria:
  - all cookies passed to ffmpeg are included
  - cookie domains are preserved
  - downloads work with browser-sourced cookies