id: TASK_033_df_003_004_resume_fixes
source_reference: .ai/audit/99-validation/06-data-flow-validated.md
source_section: DF-003, DF-004
source_finding: DF-003, DF-004

title: Fix segment resume and integrity validation
priority: high
status: pending

depends_on:
  - TASK_008_qlt_001_max_retries_wiring

description: >
  DF-003: download_hls_with_resume unconditionally cleans up segments on any failure, defeating
  resume functionality. DF-004: Existing segment files are reused without integrity checks; missing
  segments cause silent batch skip in merge.

goals:
  - Preserve segments on download failure (only cleanup on success)
  - Save progress count during download, not just at end
  - Validate segment file integrity (non-zero size) on resume
  - Fail loudly instead of silently skipping missing segments in merge

files:
  - path: src/vkdownloader/services/segment_downloader.py
    targets:
      - type: function
        name: download_hls_with_resume
    semantic_anchors:
      modify:
        type: finally_block
        value: lines 332-336
      modify:
        type: integrity_check
        value: line 261
  - path: src/vkdownloader/services/ffmpeg_utils.py
    targets:
      - type: function
        name: _merge_segments_batched
    semantic_anchors:
      modify:
        type: missing_batch_handling
        value: lines 254-256

changes:
  - action: modify_logic
    description: >
      In finally block, only cleanup on success. On failure, preserve segments.
    code_hint: |
      # Change finally to:
      # if downloaded_count == len(segments):
      #     _cleanup_segments(segments_dir, metadata_file)
      # else:
      #     # preserve for resume

  - action: add_check
    description: >
      Validate segment file is non-empty before reuse.
    code_hint: |
      if segment_path.exists() and segment_path.stat().st_size > 0:
          result = True

  - action: change_behavior
    description: >
      In merge, raise error on missing batch instead of silent continue.
    code_hint: |
      if not all(f.exists() for f in batch_files):
          raise DownloadError(f"Missing segment in batch: {batch_file}")

acceptance_criteria:
  - Segments preserved on failure for resume
  - Progress saved incrementally
  - Segment integrity checked
  - Merge fails on missing segments