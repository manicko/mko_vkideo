id: task_download_context_dataclass
title: Create DownloadContext dataclass for _download_single batch parameters
priority: medium
source_reference: .ai/audit/99-validation/09-structural-quality-validated-findings.md
source_section: STR-003
description: >
  _download_single has 10 parameters (double the limit). Bundle batch-scoped
  fields (index, shared_semaphore, backoff_coordinator, progress_callback) into
  a DownloadContext dataclass.
files:
  - path: src/vkdownloader/cli.py
    targets:
      - type: function
        name: _download_single
semantic_anchors:
      - after:
          type: function
          name: download
changes:
  - action: add_code
    description: >
      Define DownloadContext dataclass bundling batch-scoped fields.
  - action: modify_code
    description: >
      Update _download_single signature to accept DownloadContext.
  - action: modify_code
    description: >
      Update all call sites to use DownloadContext.
goals:
  - _download_single has 5 or fewer parameters
  - Parameter grouping improves readability
  - Dataclass enables clean defaults
acceptance_criteria:
  - DownloadContext defined
  - _download_single refactored
  - All tests pass
  - Call signatures updated