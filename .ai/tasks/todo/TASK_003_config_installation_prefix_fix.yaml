id: task_config_installation_prefix
title: Fix installation guide env-var names to use VKDOWNLOADER_ prefix
priority: high
source_reference: .ai/audit/99-validation/02-config-validated-findings.md
source_section: CFG-002
description: >
  Installation guide documents bare env-var names (USER_AGENT, DOWNLOAD_DIR, etc.)
  that will be silently ignored. Settings.model_config requires VKDOWNLOADER_ prefix.
  Fix the .env examples in installation.md to use correct prefixed names.
files:
  - path: docs/01-tools/installation.md
targets:
  - type: document
    name: installation.md
semantic_anchors:
  - type: env_example_block
    value: .env configuration block
changes:
  - action: modify_document
    description: >
      Replace all documented env-var names in .env block (lines 106-128) with
      VKDOWNLOADER_ prefixed equivalents (VKDOWNLOADER_USER_AGENT,
      VKDOWNLOADER_DOWNLOAD_DIR, etc.). Remove the non-existent DOWNLOAD_METHOD
      and CONCURRENT_FRAGMENTS lines.
goals:
  - .env examples load correctly via Pydantic-settings
  - No spurious ValidationError on uncommented settings
  - Documentation matches actual Settings fields
acceptance_criteria:
  - All documented env vars use VKDOWNLOADER_ prefix
  - Non-existent fields removed from documentation
  - .env examples validated by Pydantic-settings
  - No changes to config.py required