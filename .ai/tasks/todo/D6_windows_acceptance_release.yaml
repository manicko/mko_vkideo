id: task_D6_windows_acceptance_release

title: D6 — Windows acceptance & release (test staleness, lint/format gate, docs, release checklist)

priority: high

depends_on:
  - task_D1_slow_channel_managed_child
  - task_D2_typed_outcome_file_retry
  - task_D3_artifact_compatibility_resume
  - task_D4_safe_finalization_recovery
