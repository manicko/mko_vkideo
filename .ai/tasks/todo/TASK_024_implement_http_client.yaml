id: task_024
title: Implement HTTP client wrapper with aiohttp

priority: high

depends_on:
  - task_023

description: >
  Create async aiohttp ClientSession wrapper with browser-like headers, retry logic,
  and proper session management for downloading m3u8 segments.

source_reference: .ai\plans\03-testing-and-deployment.md
source_section: 9.1 Phase 2 Tasks (Extraction)

files:
  - path: src/vkdownloader/infrastructure/http_client.py
    targets:
      - type: class
        name: HttpClient
      - type: method
        name: __aenter__
      - type: method
        name: __aexit__
      - type: method
        name: get
      - type: method
        name: download_file

changes:
  - action: add_code
    description: Create HttpClient async context manager with headers
    code_hint: |
      class HttpClient:
          def __init__(self, settings: Settings):
              self.settings = settings
              self.session: Optional[ClientSession] = None
          
          async def __aenter__(self):
              self.session = aiohttp.ClientSession(
                  headers={"User-Agent": self.settings.user_agent, "Referer": "https://vkvideo.ru/"},
                  timeout=aiohttp.ClientTimeout(total=self.settings.download_timeout)
              )
              return self
  - action: add_code
    description: Implement download_file with progress tracking
    code_hint: |
      async def download_file(self, url: str, output_path: Path):
          async with self.session.get(url) as resp:
              with open(output_path, "wb") as f:
                  async for chunk in resp.content.iter_chunked(8192):
                      f.write(chunk)

acceptance_criteria:
  - HttpClient works as async context manager
  - Headers include User-Agent and Referer
  - Retry logic implemented for failed requests
  - Download progress tracking supported