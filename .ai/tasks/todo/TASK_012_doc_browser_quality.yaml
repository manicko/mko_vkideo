id: TASK_012_doc_browser_quality

title: Update docs to reflect BROWSER cookie-source quality behavior

priority: medium

depends_on:
  - TASK_011_browser_quality_fix

# ── Plan/Audit report source ──
source_reference: .ai/audit/99-validation/03-audit-services-validated-findings.md
source_section: SRV-005 (Doc Updates)
source_blocks:
  - "SRV-005: quality-selection.md implies numeric qualities work with ffmpeg/browser"

description: >
  Documentation-only update required after TASK_011. Two docs currently contradict the
  fixed behavior:
  - `docs/01-tools/quality-selection.md` (lines ~96-99) shows `--quality 720 --method ffmpeg`
    without warning that this failed with `--cookie-source browser`.
  - `docs/11-guides/vkdownloader-limitations.md` (lines ~115-118) recommends
    `--method ffmpeg --cookie-source browser` which would have triggered the bug.

  Update both to reflect that numeric qualities now work with the BROWSER cookie-source
  (stream URL reused), and remove/qualify any contradictory examples. Also update
  `docs/01-tools/api-reference.md:657` (SEC-002 doc portion) to mark CookieSource.FILE as
  explicitly rejected with an error.

goals:
  - docs match post-fix behavior
  - no contradictory numeric-quality-with-browser examples remain

files:
  - path: docs/01-tools/quality-selection.md

    targets:
      - type: file
        name: quality-selection.md

    semantic_anchors:
      insert_after:
        type: return_statement
        value: "ffmpeg/browser numeric quality example block"

  - path: docs/11-guides/vkdownloader-limitations.md

    targets:
      - type: file
        name: vkdownloader-limitations.md

    semantic_anchors:
      insert_after:
        type: return_statement
        value: "ffmpeg + cookie-source browser recommendation block"

  - path: docs/01-tools/api-reference.md

    targets:
      - type: file
        name: api-reference.md

    semantic_anchors:
      insert_after:
        type: return_statement
        value: "CookieSource.FILE description (placeholder for future enhancement)"

    changes:
      - action: modify_code
        description: >
          Remove/qualify contradictory numeric-quality-with-browser examples; mark
          CookieSource.FILE as rejected-with-error in api-reference.md.

acceptance_criteria:
  - quality-selection.md no longer implies browser+numeric fails
  - vkdownloader-limitations.md examples consistent with fixed behavior
  - api-reference.md marks CookieSource.FILE as rejected (not a future placeholder)
