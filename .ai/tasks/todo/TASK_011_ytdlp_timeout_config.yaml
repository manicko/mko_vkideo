id: task_ytdlp_timeout_config
title: Propagate download_timeout to yt-dlp socket_timeout
priority: medium
source_reference: .ai/audit/99-validation/05-integrations-validated-findings.md
source_section: INT-003
description: >
  Settings.download_timeout is documented as global timeout but yt-dlp path
  hardcodes socket_timeout: 180. Use settings.download_timeout for consistency.
files:
  - path: src/vkdownloader/services/downloader.py
    targets:
      - type: variable
        name: socket_timeout
semantic_anchors:
  - after:
      type: function
      name: _download_with_ytdlp
changes:
  - action: modify_code
    description: >
      Replace hardcoded "socket_timeout": 180 with settings.download_timeout in
      yt-dlp options dict (downloader.py around line 528).
    code_hint: |
      "socket_timeout": self.settings.download_timeout,
goals:
  - download_timeout config applies to yt-dlp
  - Consistent timeout behavior across download methods
acceptance_criteria:
  - yt-dlp respects download_timeout setting
  - No breaking changes to default timeout (300s)
  - Tests pass