id: task_004_update_ytdlp_options
title: Update yt-dlp options with throttling settings and cookies

priority: high

depends_on:
  - task_001_add_hls_throttle_settings
  - task_003_add_cookies_to_netscape_helper

# ── Plan/Audit report source ──
source_reference: .ai\plans\hls-throttle-bypass-implementation.md
source_section: Phase 2 - Task 2.3: Update yt-dlp Options Dictionary
source_file: .ai\research\HLS_THROTTLE_BYPASS_RESEARCH.md
source_blocks:
  - "6.2 yt-dlp Options Update (downloader.py)"

description: >
  Modify the ydl_opts dictionary inside _download_with_ytdlp function to:
  1. Remove "throttledratelimit": 0 (disables throttling detection)
  2. Add "concurrent_fragments": settings.concurrent_fragments
  3. Add "throttledratelimit": settings.throttled_rate
  4. Add "http_chunk_size": settings.http_chunk_size
  5. Add cookies file generation if cookies parameter provided

risk_level: medium

risk_factors:
  - changing throttledratelimit from 0 to positive value may trigger re-extraction behavior
  - cookie file creation involves I/O operations in download path

files:
  - path: src\vkdownloader\services\downloader.py
    targets:
      - type: function
        name: _download_with_ytdlp

    semantic_anchors:
      insert_after:
        type: function_call
        value: user_agent
      insert_before:
        type: dictionary
        value: ydl_opts

changes:
  - action: modify_dictionary
    description: >
      Inside _download() inner function in _download_with_ytdlp, update ydl_opts
      to enable concurrent fragments, throttling detection, and cookie support.

    code_hint: |
      ydl_opts = {
          "outtmpl": str(output_file),
          "quiet": False,
          "no_warnings": True,
          "format": f"best[height<={quality_str}]",
          "nocheckcertificate": True,
          "hls_prefer_native": True,
          "concurrent_fragments": settings.concurrent_fragments,
          "throttledratelimit": settings.throttled_rate,
          "http_chunk_size": settings.http_chunk_size,
          "http_headers": {
              "User-Agent": user_agent,
              "Referer": "https://vkvideo.ru/",
          },
          "socket_timeout": 180,
          "retries": 10,
          "fragment_retries": 10,
      }

      # Add cookies file generation if cookies provided
      if cookies:
          cookie_file = output_file.parent / f".{output_file.stem}_cookies.txt"
          cookie_file.write_text(_cookies_to_netscape(cookies))
          ydl_opts["cookiefile"] = str(cookie_file)

acceptance_criteria:
  - ydl_opts includes concurrent_fragments setting
  - throttledratelimit is configurable (not hardcoded to 0)
  - http_chunk_size is included in options
  - Cookies file is generated and referenced when provided
  - Existing download functionality preserved