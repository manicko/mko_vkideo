id: task_ytdlp_opts_extraction
title: Extract yt-dlp options builder and split _process_downloaded_segments
priority: low
source_reference: .ai/audit/99-validation/09-structural-quality-validated-findings.md
source_section: STR-006
description: >
  _download_with_ytdlp nests a large synchronous _download() closure containing
  the full yt-dlp option dict (114 lines). _process_downloaded_segments combines
  await+cancellation with tally+merge. Extract and split for readability.
files:
  - path: src/vkdownloader/services/downloader.py
    targets:
      - type: function
        name: _download_with_ytdlp
      - type: function
        name: _process_downloaded_segments
semantic_anchors:
      - after:
          type: function
          name: download_with_ytdlp_with_resume_fallback
changes:
  - action: add_code
    description: >
      Extract yt-dlp options dict builder into _build_ytdlp_options helper.
  - action: modify_code
    description: >
      Split _process_downloaded_segments into _await_and_cancel and
      _tally_and_merge helpers.
goals:
  - Function lengths reduced
  - Nesting simplified
  - Parameters reduced
acceptance_criteria:
  - _build_ytdlp_options extracted
  - _process_downloaded_segments split
  - Tests pass
  - Ruff/mypy pass