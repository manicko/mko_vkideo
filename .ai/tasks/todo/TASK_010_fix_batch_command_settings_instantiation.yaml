id: task_010_fix_batch_command_settings_instantiation
title: Fix batch command default value evaluates Settings at import time
priority: low
depends_on: []
source_reference: \.ai\audit\99-validation\06-data-flow-validated.md
source_section: DF-002
description: >
  The batch_download command uses Settings().max_retries as default value for
  max_retries option (line 216), which evaluates at module import time.
  This creates unnecessary Settings instances and captures environment config
  before CLI argument parsing.

goals:
  - Use None as sentinel default instead of Settings().max_retries
  - Resolve actual default value inside _run_batch_with_progress function
  - Avoid B008 lint violation

files:
  - path: src/vkdownloader/cli.py
    targets:
      - type: function
        name: batch_download
    semantic_anchors:
      - modify_parameter: max_retries default value
      - modify_function_body: resolve default inside _run_batch_with_progress
    changes:
      - action: modify_code
        description: >
          Change max_retries: int = typer.Option(Settings().max_retries, ...) to
          max_retries: int | None = typer.Option(None, ...)
        code_hint: |
          # Before (line 215-220):
          # max_retries: int = typer.Option(
          #     Settings().max_retries,
          #     "--max-retries",
          #     ...
          # )
          
          # After:
          max_retries: int | None = typer.Option(
              None,
              "--max-retries",
              "-r",
              help="Maximum retry attempts for failed segment downloads",
          )
          
          # Then inside _run_batch_with_progress or _download_single:
          actual_max_retries = max_retries if max_retries is not None else Settings().max_retries