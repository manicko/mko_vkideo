id: fix_git_env_tracking
source_reference: .ai/audit/99-validation/04-security-validated-findings.md
source_section: SEC-002
priority: medium

title: Remove .env from git index to prevent secret leaks

description: >
  .env is tracked by git despite being in .gitignore. This creates latent
  risk: real secrets added to .env in future would be committed and pushed,
  permanently entering git history.

goals:
  - remove .env from git index
  - ensure .gitignore rule takes effect
  - add developer warning about secret handling

files:
  - path: .gitignore
  - path: .env

changes:
  - action: shell_command
    description: >
      Run `git rm --cached .env` to remove from index without deleting file.
      Add verification in commit hooks or documentation.

acceptance_criteria:
  - `git ls-files --error-unmatch .env` fails (not tracked)
  - `git check-ignore -v .env` shows ignore rule active
  - .env file remains in working directory