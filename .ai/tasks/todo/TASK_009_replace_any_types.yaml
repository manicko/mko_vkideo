id: replace_any_types
source_reference: .ai/audit/99-validation/08-quality-validated-findings.md
source_section: QLT-002
priority: medium

title: Replace Any types with concrete types in network_monitor

description: >
  network_monitor.py uses Any for Playwright response and JSON walker,
  violating project rule #9 "Type Safety Everywhere". This loses type safety
  on the network ingestion boundary.

goals:
  - replace Any with playwright.async_api.Response for response parameter
  - add typed JSON value alias for recursive walker
  - maintain mypy strict mode compliance

files:
  - path: src/vkdownloader/infrastructure/network_monitor.py
    targets:
      - type: function
        name: _intercept_response
  - path: src/vkdownloader/infrastructure/network_monitor.py
    targets:
      - type: function
        name: _extract_urls_from_json

changes:
  - action: add_code
    description: >
      Replace `response: Any` with `response: playwright.async_api.Response`.
      Add JsonValue = dict[str, "JsonValue"] | list["JsonValue"] | str | int |
      float | bool | None type alias and use for data parameter.

acceptance_criteria:
  - mypy passes with strict mode
  - no Any types in network_monitor.py
  - type safety preserved for network responses