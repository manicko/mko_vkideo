id: apply_download_timeout_to_requests
source_reference: .ai/audit/99-validation/05-integrations-validated-findings.md
source_section: INT-001
priority: high

title: Apply download_timeout config to aiohttp requests

description: >
  Settings.download_timeout (default 300s) is never applied to any aiohttp
  request. All session.get() calls in segment_downloader.py and
  downloader_throttle.py lack timeout arguments, risking indefinite hangs.

goals:
  - pass ClientTimeout from settings to all aiohttp requests
  - use settings.download_timeout for request timeout
  - prevent hung connections from blocking downloads

files:
  - path: src/vkdownloader/services/segment_downloader.py
    targets:
      - type: function
        name: _download_segment
  - path: src/vkdownloader/services/downloader_throttle.py
    targets:
      - type: function
        name: _try_single_download_attempt

changes:
  - action: add_code
    description: >
      Import ClientTimeout from aiohttp and add timeout=ClientTimeout(total=settings.download_timeout)
      to all session.get() calls. Pass settings through call chain.

acceptance_criteria:
  - all aiohttp requests have timeout applied
  - downloads timeout after configured period
  - batch mode no longer stalls on hung connections