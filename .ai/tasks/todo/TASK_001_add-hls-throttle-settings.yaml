id: task_001_add_hls_throttle_settings
title: Add HLS throttle settings fields to Settings class

priority: high

depends_on: []

# ── Plan/Audit report source ──
source_reference: .ai\plans\hls-throttle-bypass-implementation.md
source_section: Phase 1 - Configuration Settings (config.py)
source_file: .ai\research\HLS_THROTTLE_BYPASS_RESEARCH.md
source_blocks:
  - "6.1 Settings Configuration (config.py)"

description: >
  Add three new Pydantic fields to the Settings class for HLS throttling bypass:
  concurrent_fragments, throttled_rate, and http_chunk_size. These enable
  concurrent fragment downloads and throttling detection in yt-dlp.

goals:
  - add concurrent_fragments field (default=4, range 1-16)
  - add throttled_rate field (default=100000, range 50000-1000000)
  - add http_chunk_size field (default=10485760, range 1MB-100MB)
  - enable 3-5x download speed improvement via parallel fragments

files:
  - path: src\vkdownloader\config.py
    targets:
      - type: class
        name: Settings

    semantic_anchors:
      insert_after:
        type: field_definition
        value: max_concurrent_downloads

changes:
  - action: add_fields
    description: Add three HLS throttle configuration fields to Settings class

    code_hint: |
      concurrent_fragments: int = Field(
          default=4,
          ge=1,
          le=16,
          description="Concurrent HLS fragment downloads for yt-dlp (reduces throttling)",
      )
      throttled_rate: int = Field(
          default=100000,
          ge=50000,
          le=1000000,
          description="Minimum download rate in bytes/sec before throttling triggers re-extract",
      )
      http_chunk_size: int = Field(
          default=10485760,
          ge=1048576,
          le=104857600,
          description="HTTP chunk size in bytes for segment downloads",
      )

acceptance_criteria:
  - Settings class accepts new fields without validation errors
  - Default values match specification (4, 100000, 10485760)
  - Field constraints enforced (min/max values)
  - Settings with unknown keys still rejected (extra="forbid" preserved)