id: task_031
title: Implement adaptive rate limiting

priority: medium

depends_on:
  - task_024

description: >
  Create AdaptiveThrottle class with dynamic delay adjustment based on response
  patterns. Implements backoff on rate limiting and recovery on success.

source_reference: .ai\plans\05-recommendations-and-improvements.md
source_section: 7.2 Rate Limiter with Dynamic Delay

files:
  - path: src/vkdownloader/infrastructure/adaptive_throttle.py
    targets:
      - type: class
        name: AdaptiveThrottle
      - type: method
        name: wait
      - type: method
        name: on_rate_limited
      - type: method
        name: on_success

changes:
  - action: add_code
    description: Create AdaptiveThrottle with delay adjustment
    code_hint: |
      class AdaptiveThrottle:
          def __init__(self, base_rpm: int = 20, max_rpm: int = 60):
              self.base_rpm = base_rpm
              self.max_rpm = max_rpm
              self.current_delay = 2.0

          async def wait(self):
              delay = self.current_delay + random.uniform(0, 1)
              await asyncio.sleep(delay)

          def on_rate_limited(self):
              self.current_delay = min(self.current_delay * 1.5, 10.0)

          def on_success(self):
              self.current_delay = max(self.current_delay * 0.95, 1.0)

acceptance_criteria:
  - wait() applies random jitter to delay
  - on_rate_limited increases delay up to max 10 seconds
  - on_success gradually reduces delay
  - Works with aiohttp client for request pacing