id: task_segment_retry_result
title: Add SegmentRetryResult enum for differentiated failure modes
priority: medium
source_reference: .ai/audit/99-validation/05-integrations-validated-findings.md
source_section: INT-006
description: >
  _retry_429_with_backoff returns None for both permanent failures and retry
  exhaustion, making failure modes indistinguishable. Add SegmentRetryResult
  StrEnum with SUCCESS, PERMANENT_FAILURE, RETRY_EXHAUSTED.
files:
  - path: src/vkdownloader/models/enums.py
    targets:
      - type: module
        name: enums
semantic_anchors:
  - after:
      type: last_enum_definition
changes:
  - action: add_code
    description: >
      Add SegmentRetryResult(StrEnum) to models/enums.py with values SUCCESS,
      PERMANENT_FAILURE, RETRY_EXHAUSTED.
  - action: modify_code
    description: >
      Modify _retry_429_with_backoff in downloader_throttle.py to return
      SegmentRetryResult instead of Optional[bytes].
  - action: modify_code
    description: >
      Update callers in segment_downloader.py to check result is SegmentRetryResult.SUCCESS.
goals:
  - Failure types distinguishable
  - Clear observability of retry outcomes
acceptance_criteria:
  - SegmentRetryResult enum defined
  - _retry_429_with_backoff returns enum values
  - Callers handle all three states
  - Tests pass