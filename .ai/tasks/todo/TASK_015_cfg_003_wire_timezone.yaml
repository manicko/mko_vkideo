id: TASK_015_cfg_003_wire_timezone
source_reference: .ai/audit/99-validation/02-config-validated.md
source_section: CFG-003
source_finding: CFG-003

title: Wire timezone into browser stealth configuration
priority: medium
status: pending

description: >
  Settings.timezone (default "Europe/Moscow", env var VKDOWNLOADER_TIMEZONE) is documented as
  "Timezone for stealth configuration" but is never applied. BrowserManager.create_stealth_page
  configures viewport, user_agent, locale but not timezone_id.

goals:
  - Pass timezone_id to Playwright browser context
  - Restore documented stealth configuration behavior

files:
  - path: src/vkdownloader/infrastructure/browser.py
    targets:
      - type: method
        name: BrowserManager.create_stealth_page
    semantic_anchors:
      within:
        type: context_creation
        value: new_context

changes:
  - action: modify_call
    description: >
      Add timezone_id=self.settings.timezone to new_context() call alongside user_agent and locale.
    code_hint: |
      context = await self.browser.new_context(
          viewport={"width": 1920, "height": 1080},
          user_agent=self.settings.user_agent,
          locale=self.settings.locale,
          timezone_id=self.settings.timezone  # Add this line
      )

acceptance_criteria:
  - Timezone is passed to browser context
  - Stealth configuration includes timezone
  - Tests pass