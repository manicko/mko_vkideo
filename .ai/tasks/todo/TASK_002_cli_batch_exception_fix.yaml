id: task_cli_batch_exception
title: Add broad exception handler in batch result collection loop
priority: high
source_reference: .ai/audit/99-validation/01-cli-validated-findings.md
source_section: CLI-002
description: >
  _download_single re-raises unexpected exceptions, and _run_batch_with_progress
  only catches CancelledError. Unexpected exceptions propagate with raw traceback
  instead of being captured and reported in batch summary. Wrap per-task await in
  broad exception handler to record failures and continue.
files:
  - path: src/vkdownloader/cli.py
    targets:
      - type: function
        name: _run_batch_with_progress
    semantic_anchors:
      insert_before:
        type: for_loop
        value: asyncio.as_completed
changes:
  - action: modify_code
    description: >
      Wrap the `await coro` at line 216 in a broad `except Exception` that records
      the failure into the results list (url, "", "unexpected_error") and continues.
goals:
  - Batch never crashes with raw traceback
  - All failures reported in batch summary
  - Exit code 1 on any failure
  - Maintains existing CancelledError handling
acceptance_criteria:
  - No unhandled exceptions in batch mode
  - Batch summary prints on any failure
  - Exit code 1 on unexpected errors
  - Tests pass