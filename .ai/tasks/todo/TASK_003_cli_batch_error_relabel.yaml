id: TASK_003_cli_batch_error_relabel

title: Stop relabeling unexpected batch exceptions as cancelled

priority: high

# ── Plan/Audit report source ──
source_reference: .ai/audit/99-validation/01-audit-cli-validated-findings.md
source_section: CLI-001 (HIGH, mandatory)
source_blocks:
  - "CLI-001: Unexpected batch exceptions are silently relabeled as canceled"

# Merged: STR-002 (Phase 09) — deep nesting in _run_batch_with_progress shares
# root cause (batch error/cancellation handling) and is consolidated here.

description: >
  In `_run_batch_with_progress`, `asyncio.gather(*tasks, return_exceptions=True)`
  captures exceptions as objects, but the post-processing list comprehension uses
  `isinstance(r, tuple)` which turns ANY non-tuple result (including a genuine
  Exception/traceback) into `('...', '', 'cancelled')`. Real failures are hidden
  and misreported as user-initiated cancellation.

  Fix: in the post-processing comprehension, check `isinstance(r, BaseException)`.
  Map genuine exceptions to status `'download_error: {str(r)}'` and distinguish
  `asyncio.CancelledError` as `'cancelled'`. Preserve the existing
  `logger.exception` traceback from `_download_single`.

goals:
  - genuine exceptions reported as download_error, not cancelled
  - asyncio.CancelledError still reported as cancelled
  - logger.exception traceback preserved
  - accurate batch summary

files:
  - path: src/vkdownloader/cli.py

    targets:
      - type: function
        name: _run_batch_with_progress

    semantic_anchors:
      # The comprehension that builds the result list from asyncio.gather results.
      # Anchor on the gather call and the result-rewriting comprehension.
      insert_after:
        type: function_call
        value: asyncio.gather

    changes:
      - action: modify_code
        description: >
          Replace the `isinstance(r, tuple)` check in the result-comprehension so that
          `BaseException` results are labeled `download_error: {str(r)}` while
          `asyncio.CancelledError` results remain `cancelled`. Non-exception,
          non-tuple results keep existing handling.

acceptance_criteria:
  - a non-CancelledError exception in a batch task yields status starting with "download_error:"
  - asyncio.CancelledError still yields status "cancelled"
  - batch summary no longer misreports unexpected failures as cancellations
  - existing test_batch_statistics_summary still passes (or is updated)
  - ruff + mypy clean
