changes:
  - action: add_test
    description: Test browser stealth context creation
    code_hint: |
      @pytest.mark.asyncio
      async def test_stealth_context_creation():
          context = await create_stealth_context(playwright, Settings())
          assert context.user_agent != "undefined"
  - action: add_test
    description: Create mock VK server for integration tests
    code_hint: |
      @pytest.fixture
      async def mock_vk_server(aiohttp_client):
          app = web.Application()
          app.router.add_get("/video-{oid}_{vid}", mock_video_page)
          return await aiohttp_client(app)
  - action: add_test
    description: Test ffmpeg command building with headers
    code_hint: |
      def test_ffmpeg_command_build():
          downloader = HLSDownloader(Settings(user_agent="Test Agent"))
          cmd = downloader._build_ffmpeg_cmd("https://example.com/video.m3u8", Path("out.mp4"), "720")
          assert "User-Agent" in " ".join(cmd)

acceptance_criteria:
  - All core components have unit test coverage > 80%
  - Integration tests use mock aiohttp server
  - Tests pass with pytest-asyncio
  - Coverage report generated