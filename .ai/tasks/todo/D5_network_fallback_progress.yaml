acceptance_criteria:
  - http_status is populated on YtdlpLaunchResult for reason-based routing.
  - Confirmed 401/403/410 route through the bounded refresh path, consuming the refresh
    allowance before invoking refresh and verifying the refreshed stream is the same variant.
  - 429 honors Retry-After/coordinator pause and retries yt-dlp without backend switch.
  - 5xx/timeout retries are bounded by the combined budget.
  - Manifest mismatch, integrity errors, cancellation, and local errors route to stop/recovery
    without retry or switch.
  - A network retry is charged only when actually scheduled; segment retries share the combined
    budget (6).
  - At most one segment-backend transition per job (persisted segment_backend_used); a second
    attempt emits backend_switch_blocked and returns None.
  - The original variant binding is propagated and numeric quality is rechecked on switch;
    a compatible segment checkpoint is reused, otherwise a new segment download is reported and
    yt-dlp artifacts are preserved.
  - An incompatible playlist cannot contribute an old fragment to the final MP4 (existing
    checkpoint reconciliation/quarantine).
  - A failed segment switch returns None and preserves artifacts (no unlimited alternation).
  - Missing required fragment after retries yields reason_code missing_required_fragment and
    returns None.
  - JobPhase.FINALIZING exists and is emitted during file retry/publish; verified disk bytes are
    separate from yt-dlp estimates and current-session network bytes; no percent/ETA is used as
    proof.
  - test_progress, test_progress_display, test_hls_downloader, test_ytdlp_downloader, and
    test_download_state pass for the new behaviors.
  - ruff and mypy pass for changed Python files.
  - Execution plan status for D5 is updated.

