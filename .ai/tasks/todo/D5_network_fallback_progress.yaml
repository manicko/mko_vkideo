  - uv run mypy src/vkdownloader/models/enums.py src/vkdownloader/services/state_machine.py src/vkdownloader/services/ytdlp_downloader.py src/vkdownloader/services/segment_downloader.py src/vkdownloader/services/progress.py src/vkdownloader/services/progress_display.py
  - uv run pytest tests/test_progress.py tests/test_progress_display.py tests/test_hls_downloader.py tests/test_ytdlp_downloader.py tests/test_download_state.py -q

constraints:
  - No production code distortion for tests; do not change production source in this planning task.
  - Preserve contracts: _download_with_ytdlp external Path | None; YtdlpLaunchResult additive.
  - Semantic anchors only; no line numbers.
  - Do not change audit phase files.
  - No unlimited alternation; return None after a failed segment switch.
  - deep_decode remains off for ordinary finalization (D4 contract).
  - Legacy discovery remains read-only.
  - Quarantine remains rename-only; no media copy.
  - Verified counters only move forward; never roll back on child restart.
