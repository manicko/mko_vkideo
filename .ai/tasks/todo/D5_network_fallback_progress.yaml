        name: _tally_and_merge
    changes:
      - action: charge_retry_only_when_scheduled
        description: >
          Thread state_machine through _run_download_session (already present) and call
          record_retry(scope="segment", ...) inside _fetch_playlist_with_retry and the segment
          retry loops only when a retry wait is actually about to happen. On
          is_budget_exhausted() return None. Keep per-segment retries inside the existing
          max_retries budget without separate record_retry calls (charge at playlist level
          only) to avoid double-counting.
      - action: honor_combined_budget
        description: >
          Before each retry wait, check state_machine.is_budget_exhausted(); if exhausted,
          persist FAILED_RETRY_BUDGET and return None.
      - action: missing_required_fragment
        description: >
          In _tally_and_merge, when downloaded_count != len(segments) or any segment failed,
          if state_machine is present persist reason_code="missing_required_fragment" and
          error_category=NOT_FOUND (or UNKNOWN) and transition to FAILED/PRESERVE_AND_STOP
          when legal, then return None. Preserve artifacts (already).
      - action: progress_finalizing
        description: >
          Emit a final ProgressSnapshot with phase=JobPhase.FINALIZING and eta_seconds=None
          during merge/publication/finalization in download_hls_with_resume. Keep verified bytes
          from job_state and network bytes from the current session.

