id: task_026
title: Implement quality selection service

priority: medium

depends_on:
  - task_025

description: >
  Create QualitySelector class to select appropriate stream based on quality
  parameter (best, worst, or specific resolution).

source_reference: .ai\plans\04-advanced-and-summary.md
source_section: 18.2 Adaptive Quality Selection

files:
  - path: src/vkdownloader/services/quality.py
    targets:
      - type: class
        name: QualitySelector
      - type: method
        name: select
      - type: method
        name: list_available_qualities

changes:
  - action: add_code
    description: Implement quality selection logic
    code_hint: |
      def select(self, streams: list[Stream], quality: QualityEnum) -> Stream:
          if quality == QualityEnum.BEST:
              return max(streams, key=lambda s: s.height or 0)
          if quality == QualityEnum.WORST:
              return min(streams, key=lambda s: s.height or float('inf'))
          for stream in streams:
              if str(stream.quality) == str(quality):
                  return stream
          return max(streams, key=lambda s: s.height or 0)

acceptance_criteria:
  - select returns best stream when quality="best"
  - select returns worst stream when quality="worst"
  - select returns matching quality when specified
  - Falls back to best available if requested quality not found
  - list_available_qualities returns sorted quality list