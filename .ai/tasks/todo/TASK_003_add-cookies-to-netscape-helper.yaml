source_file: .ai\research\HLS_THROTTLE_BYPASS_RESEARCH.md
source_blocks:
  - "8.2 Making yt-dlp More Browser-Like"

description: >
  Add module-level helper function _cookies_to_netscape() in downloader.py
  to convert cookies string to Netscape HTTP Cookie File format for yt-dlp.
  This enables passing browser-captured cookies to yt-dlp for authenticated downloads.

goals:
  - convert cookies string to Netscape format
  - target .vkvideo.ru domain for cookie entries
  - handle edge cases (empty cookies, malformed entries)

files:
  - path: src\vkdownloader\services\downloader.py
    targets:
      - type: module
        name: downloader

    semantic_anchors:
      insert_after:
        type: variable
        value: MAX_RESUME_RETRIES

changes:
  - action: add_function
    description: >
      Add _cookies_to_netscape function that converts "name=value; name2=value2"
      format to Netscape cookie file format with .vkvideo.ru domain.

    code_hint: |
      def _cookies_to_netscape(cookies_str: str) -> str:
          """Convert cookies string to Netscape HTTP Cookie File format for yt-dlp."""
          lines = [
              "# Netscape HTTP Cookie File",
              "# Generated by vkdownloader",
              "",
          ]
          for cookie in cookies_str.split("; "):
              if "=" in cookie:
                  name, value = cookie.split("=", 1)
                  lines.append(f".vkvideo.ru\tTRUE\t/\tFALSE\t0\t{name}\t{value}")
          return "\n".join(lines)

acceptance_criteria:
  - Function converts valid cookies string to correct Netscape format
  - Function handles empty or malformed cookies gracefully
  - Generated cookie file works with yt-dlp cookiefile option