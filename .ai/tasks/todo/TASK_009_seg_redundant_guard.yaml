id: TASK_009_seg_redundant_guard

title: Remove redundant retry-count guard in download_with_ytdlp_with_resume_fallback

priority: low

# ── Plan/Audit report source ──
source_reference: .ai/audit/99-validation/03-audit-services-validated-findings.md
source_section: SRV-004 (LOW, advisory)
source_blocks:
  - "SRV-004: Dead conditional guard in _attempt_segment_resume"

description: >
  In `download_with_ytdlp_with_resume_fallback`, the `while retry_count <= MAX_RESUME_RETRIES:`
  loop already guarantees the condition inside its body. The inner `if retry_count <= MAX_RESUME_RETRIES:`
  is therefore always true and the branch is unconditional (dead/confusing control flow).
  Remove the redundant guard.

goals:
  - remove dead/confusing guard
  - preserve existing retry/segment-resume behavior exactly

files:
  - path: src/vkdownloader/services/downloader.py

    targets:
      - type: function
        name: download_with_ytdlp_with_resume_fallback

    semantic_anchors:
      # Anchor on the inner if that duplicates the while-loop condition.
      insert_after:
        type: function_call
        value: _attempt_segment_resume

    changes:
      - action: modify_code
        description: >
          Delete the redundant `if retry_count <= MAX_RESUME_RETRIES:` wrapper and
          dedent its body (the _attempt_segment_resume call + return).

acceptance_criteria:
  - inner guard removed; body executes unconditionally as before
  - retry semantics unchanged (MAX_RESUME_RETRIES still bounds the loop)
  - ruff + mypy clean
