id: task_accept_language_removal
title: Remove unused accept_language field from Settings
priority: medium
source_reference: .ai/audit/99-validation/02-config-validated-findings.md
source_section: CFG-003
cross_reference:
  - .ai/audit/99-validation/05-integrations-validated-findings.md INT-002
  - .ai/audit/99-validation/08-quality-validated-findings.md QLT-003
description: >
  accept_language field is defined and documented but never consumed by
  BrowserManager.create_stealth_page. Playwright's locale parameter already
  controls Accept-Language header, making this field redundant. Remove it.
files:
  - path: src/vkdownloader/config.py
    targets:
      - type: field
        name: accept_language
    semantic_anchors:
      after:
        type: imports
  - path: .env
    targets:
      - type: env_line
        value: VKDOWNLOADER_ACCEPT_LANGUAGE
  - path: docs/11-guides/configuration.md
    targets:
      - type: config_documentation
    semantic_anchors:
      - type: config_table_row
        name: accept_language
  - path: docs/01-tools/api-reference.md
    targets:
      - type: config_documentation
changes:
  - action: remove_code
    description: >
      Remove accept_language field definition from Settings class (lines 27-30)
      in config.py.
  - action: remove_line
    description: >
      Remove VKDOWNLOADER_ACCEPT_LANGUAGE line from .env (line 10).
  - action: remove_document
    description: >
      Remove accept_language rows from configuration.md and api-reference.md.
goals:
  - Remove dead accept_language field from Settings
  - Remove accept_language from .env template
  - Remove accept_language documentation
  - Clean up redundant configuration surface
acceptance_criteria:
  - Config loads without accept_language field
  - No runtime impact on browser automation
  - Docs no longer reference unused field
  - Tests pass