id: task_006_integrate_browser_cookies_ytdlp
title: Integrate browser cookies with yt-dlp in perform_download

priority: medium

depends_on:
  - task_005_update_ytdlp_fallback_signature

# ── Plan/Audit report source ──
source_reference: .ai\plans\hls-throttle-bypass-implementation.md
source_section: Phase 3 - Task 3.1: Integrate Browser Cookies with yt-dlp in YTDLP Branch
source_file: .ai\research\HLS_THROTTLE_BYPASS_RESEARCH.md
source_blocks:
  - "8.3 Implementation for Human-Like yt-dlp"

description: >
  Modify the DownloadMethod.YTDLP case in perform_download to call
  extract_streams_with_cookies and pass cookies to the yt-dlp download
  function. This enables authenticated downloads with fresh browser session.

risk_level: medium

risk_factors:
  - changes download flow for YTDLP method
  - introduces dependency on browser extraction before yt-dlp download

files:
  - path: src\vkdownloader\services\downloader.py
    targets:
      - type: function
        name: perform_download

    semantic_anchors:
      insert_after:
        type: match_statement
        value: DownloadMethod.YTDLP
      insert_before:
        type: return_statement
        value: download_with_ytdlp_with_resume_fallback

changes:
  - action: modify_match_case
    description: >
      Update DownloadMethod.YTDLP case to use extract_streams_with_cookies
      and pass cookies to download function.

    code_hint: |
      case DownloadMethod.YTDLP:
          browser_streams, cookies = await extractor.extract_streams_with_cookies(url)
          if browser_streams:
              m3u8_url = str(browser_streams[0].url)
          return await download_with_ytdlp_with_resume_fallback(
              url, m3u8_url, output_file, quality, extractor, settings,
              cookies=cookies
          )

acceptance_criteria:
  - YTDLP case calls extract_streams_with_cookies
  - cookies are passed to download_with_ytdlp_with_resume_fallback
  - Fresh m3u8 URL used when browser_streams available
  - FFMPEG and AUTO cases remain unchanged