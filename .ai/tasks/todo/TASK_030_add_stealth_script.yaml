# Task: Add stealth script for browser automation
id: task_030
title: Add Playwright stealth script for anti-detection

priority: high

depends_on:
  - task_023

description: |
  Download or create stealth.min.js script for Playwright to bypass
  VK's anti-bot detection. This script removes webdriver flags and
  automation indicators from browser context.

files:
  - path: src/vkdownloader/stealth.min.js
    targets:
      - type: file
        name: stealth.min.js

changes:
  - action: add_code
    description: Add stealth JavaScript to remove webdriver properties from navigator
    code_hint: |
      // Removes navigator.webdriver flag
      Object.defineProperty(navigator, 'webdriver', {get: () => undefined})
      // Removes automation extension identification
      delete navigator.__proto__.webdriver

acceptance_criteria:
  - stealth.min.js present in package
  - Browser automation undetected by simple bot checks
  - Can navigate to VK video pages without blocking