changes:
  - action: add_code
    description: >
      Create services/workspace.py implementing DownloadWorkspace dataclass,
      stable_job_id, make_workspace, JobLock/acquire_job_lock, publish_verified_file,
      cleanup_owned_job_artifacts, and dry-run discover_legacy_artifacts.
    code_hint: |
      from dataclasses import dataclass
      from pathlib import Path
      from hashlib import sha256
      import os, shutil

      try:
          from filelock import FileLock, Timeout
      except ImportError:  # pragma: no cover - fallback path
          FileLock = None  # type: ignore[assignment]

      @dataclass(frozen=True)
      class DownloadWorkspace:
          final_path: Path
          root: Path
          ytdlp_dir: Path
          segments_dir: Path
          staging_dir: Path
          diagnostics_dir: Path
          state_path: Path
          log_path: Path
          lock_path: Path

      def stable_job_id(video_id: str, quality: str, final_basename: str) -> str:
          logical = f"{video_id}|{quality}|{final_basename.casefold()}"
          digest = sha256(logical.encode("utf-8")).hexdigest()[:12]
          safe_vid = "".join(c if c.isalnum() or c in "-_" else "_" for c in str(video_id))[:32]
          return f"video-{safe_vid}-q{quality}-{digest}"

      def make_workspace(final_path: Path, video_id: str, quality: str) -> DownloadWorkspace:
          final_path = validate_output_path(final_path)
          tmp = final_path.parent / "tmp"
          job = tmp / "jobs" / stable_job_id(video_id, quality, final_path.name)
          ws = DownloadWorkspace(
              final_path=final_path,
              root=job,
              ytdlp_dir=job / "ytdlp",
              segments_dir=job / "segments",
              staging_dir=job / "staging",
              diagnostics_dir=job / "diagnostics",
              state_path=job / "state.json",
              log_path=tmp / "logs" / f"{job.name}.jsonl",
              lock_path=job / "lock",
          )
          for d in (ws.root, ws.ytdlp_dir, ws.segments_dir, ws.staging_dir,
                    ws.diagnostics_dir, tmp / "logs"):
              d.mkdir(parents=True, exist_ok=True)
          return ws

      def acquire_job_lock(workspace, timeout: float = 10.0):
          if FileLock is not None:
              lock = FileLock(str(workspace.lock_path), timeout=timeout)
              lock.acquire()
              return lock
          # Fallback: os.open O_EXCL + PID owner file
          ...

      def publish_verified_file(staged: Path, final: Path) -> Path:
          if final.exists():
              raise FileExistsError(f"Refusing to overwrite existing output: {final}")
          staged.replace(final)  # same filesystem
          return final

      def cleanup_owned_job_artifacts(workspace) -> None:
          try:
              if workspace.root.exists():
                  shutil.rmtree(workspace.root)
          except OSError:
              pass

      @dataclass(frozen=True)
      class LegacyArtifact:
          path: Path
          size: int
          kind: str

      def discover_legacy_artifacts(output_dir: Path) -> list[LegacyArtifact]:
          # Dry-run only: report, never move or delete.
          ...

  - action: modify_code
    description: >
      Replace _ytdlp_temp_name with YtdlpArtifacts class tracking the actual
      temp path and fragments under the workspace ytdlp_dir. Update
      _has_recoverable_ytdlp_artifacts to use it and account for the
      .part-FragN.part in-progress suffix.
    code_hint: |
      @dataclass(frozen=True)
      class YtdlpArtifacts:
          directory: Path
          final_name: str

          @property
          def temp_path(self) -> Path:
              return self.directory / (self.final_name + ".part")

          @property
          def ytdl_path(self) -> Path:
              return self.directory / (self.final_name + ".ytdl")

          def fragment_paths(self) -> list[Path]:
              try:
                  return sorted(
                      p for p in self.directory.iterdir()
                      if p.name.startswith(self.final_name + ".part-Frag")
                  )
              except OSError:
                  return []

          def has_artifacts(self) -> bool:
              try:
                  if self.temp_path.exists() and self.temp_path.stat().st_size > 0:
                      return True
              except OSError:
                  pass
              if self.fragment_paths():
                  return True
              try:
                  if self.ytdl_path.exists():
                      return True
              except OSError:
                  pass
              return False

  - action: modify_code
    description: >
      Update _build_ytdlp_cli_command to accept workspace and route via -P
      home/temp plus a relative -o template. Keep all existing args.
    code_hint: |
