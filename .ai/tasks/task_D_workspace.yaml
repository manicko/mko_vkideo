id: block_d_workspace

title: "Block D — output/tmp workspace and safe yt-dlp artifact routing"

priority: P0

depends_on:
  - block_b_preserve_partials
  - block_c_diagnostics

source_reference: .ai/plans/MKO_VKIDEO_Refactoring_Plan.md
source_section: "Block D — New output/tmp workspace and safe yt-dlp artifact routing"
source_blocks:
  - "Block D — New output/tmp workspace and safe yt-dlp artifact routing"

description: >
  Introduce a single per-job workspace contract under output/tmp so every
  in-progress artifact (.part, .part-Frag*, .ytdl, segments, staging, state,
  lock, diagnostics) lives inside tmp/jobs/<job> and never at the output root.
  Route yt-dlp through its native home/temp path mapping (-P) with a relative
  output template, and replace the guessed _ytdlp_temp_name helper with a
  YtdlpArtifacts object that tracks the real temp path and related fragments
  (including the .part-FragN.part in-progress suffix). Thread the workspace
  through downloader/segment/ytdlp paths, publish the final file via an atomic
  collision-safe rename only after validation, and add filelock-based exclusive
  job locking with a Windows-compatible fallback. Legacy root artifacts are
  treated as user data: discovery is dry-run only, no auto-move, no deletion.
  Scope is strictly Block D: no checkpoint (E), quality (F), state machine (G),
  FFmpeg transport (H), or progress (I) changes.

goals:
  - All new in-progress data lives under output/tmp/jobs/<job>; output root holds only the validated final video (plus unrelated pre-existing files and tmp/).
  - Stable job id derived from video_id + quality + final basename (never tokens).
  - yt-dlp invoked with -P home:<staging> -P temp:<ytdlp_dir> and a relative -o template; fragments land in ytdlp_dir.
  - _ytdlp_temp_name replaced by YtdlpArtifacts tracking the actual temp path and fragments.
  - Segment backend uses workspace.segments_dir; FFmpeg merge output targets workspace.staging_dir.
  - Final publish uses os.replace only after validation, with collision safety (no overwrite of existing user file).
  - Exclusive per-job lock via filelock (Windows supported), with os.open O_EXCL + PID-owner fallback if filelock unavailable.
  - Legacy artifacts discovered via dry-run only; never moved or deleted automatically.
  - tmp/ root and tmp/logs/ remain after success; only the owned job dir is removed on successful commit.

