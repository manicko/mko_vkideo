# ── Architectural constraints ──
architectural_constraints:

  intent_guard_not_exception_type: >
    The _cleanup_segments fix must be phrased by intent — `is_file()` guard
    to skip non-regular entries — NOT by catching `IsADirectoryError`.
    `IsADirectoryError` is POSIX-only; on Windows, unlinking a directory
    raises `PermissionError [WinError 5]`. The existing `try/except OSError`
    on `rmdir()` is NOT a model — it silently swallows `PermissionError` on
    Windows. This is plan §2.3 and §5.1 risk I1.

  d4_option_i_poo: >
    PoO decision D-4 = option (i): narrow only the merge-decision count in
    _tally_and_merge. The _log_preserve_segments count stays a raw
    working-directory inventory. ALL THREE TestPreserveSegmentsReporter
    tests stay green unchanged. This is the binding decision — do not narrow
    both counts.

  cleanup_call_sites_unchanged: >
    _cleanup_segments is still called only under `if result:` (segment_downloader.py:867-868).
    This block adds NO new call sites — P12-B7 owns those. Stated so the two
    blocks are not confused. Plan §6.6 acceptance criterion 7.

  signature_short_circuit_is_b6_only: >
    The .signature short-circuit in _clear_stale_segments is the ONLY
    short-circuit any block in this plan may change, and that block is B6
    (§4.3 conflict-matrix row 8). The Implementer must decide whether the
    .ts.tmp sweep in _clear_stale_segments needs to run even when the
    signature matches (currently the short-circuit returns before any glob
    runs). If addressed, the .ts.tmp sweep must run before the short-circuit
    return. This is an honest judgement point, not a mechanical requirement.

  no_os_replace_or_durability: >
    No test anywhere uses os.replace (0 results in tests/). Do not introduce
    fsync, a temp-dir abstraction, or a lock file (§2.2 C5). The is_file()
    guard is about correctness of the unlink, not about durability.

  leaf_safety: >
    segment_downloader.py imports from ..config, ..models.*, ..utils.*,
    .concurrency, .downloader_throttle, .ffmpeg_utils, .quality. No new import
    is introduced — is_file(), missing_ok, glob, and Final are already
    in scope or already imported.

  no_file_line_references: >
    Anchors are symbol names: _cleanup_segments, _tally_and_merge,
    _clear_stale_segments, _log_preserve_segments, _merge_segments_batched,
    _SEGMENT_TEMP_SUFFIX. No file:line references in the commit message.

