# Implementation task for P12-B6
# Block 6 in execution order (after P12-B5; preceded by B3→B1→B10→B2→B4→B5)
# Source plan: .ai/plans/12-filesystem-artifacts-audit-fixes_fix.md §6.6
# PoO decision D-4: option (i) — narrow only the merge-decision count
#
# Three findings, one commit:
#   ART-003 — bare f.unlink() over glob("*") raises on non-regular entries (Windows PermissionError [WinError 5])
#   ART-004 — glob("*.ts") merge-decision count includes batch_*.ts temps, causing merge SKIP on resume
#   ART-013 — NNNNN.ts.tmp residue is unmatched by any sweep

id: p12-b6

title: P12-B6 — make the sweeps match what the tree contains (ART-003 cleanup guard, ART-004 tally exclusion, ART-013 .ts.tmp sweep)

priority: high

depends_on:
  - p12-b5   # execution-order predecessor; no hard code dependency — B6 writes segment_downloader.py and ffmpeg_utils.py only, not utils/security.py

status: done

assignee: Implementer

# ── Plan / Audit source ──
source_reference: .ai/plans/12-filesystem-artifacts-audit-fixes_fix.md
source_section: "§6.6 P12-B6 — the sweeps match the tree"
source_audit_section: "§9 P12-B6 Auditor context (context_a)"

# ── Task description (returned to Tech Lead) ──
description: >
  Three related reconciliations in one commit:

  (1) ART-003 — `_cleanup_segments` bare `f.unlink()` over `glob("*")`:
      Add an intent guard — skip non-regular entries (`is_file()`) and tolerate
      already-gone files (`missing_ok=True`). Must be phrased by INTENT, not
      by catching `IsADirectoryError` (POSIX-only). On Windows the operative
      failure is `PermissionError [WinError 5]` from unlinking a directory.

  (2) ART-004 — `_tally_and_merge` `downloaded_count` derived from
      `glob("*.ts")`: `batch_*.ts` matches it exactly as `NNNNN.ts` does.
      Exclude merge temps from THIS count only (PoO decision D-4 = option (i)).
      The reporter `_log_preserve_segments`'s count stays a raw working-directory
      inventory, keeping `TestPreserveSegmentsReporter` green unchanged.

  (3) ART-013 — `NNNNN.ts.tmp` residue unmatched by any sweep: The two `os.replace`
      publish sites produce `output_path.with_suffix(output_path.suffix + ".tmp")`.
      Extend `_clear_stale_segments`'s sweep to cover `*.ts.tmp` alongside `*.ts`.
      Also ensure `_cleanup_segments` sweeps `.ts.tmp` correctly (its `glob("*")`
      already matches the temp suffix, but the `is_file()` guard from change (1)
      is what makes it safe to unlink them). One suffix constant for the `.tmp`
      pattern, shared at both publish sites and the new glob.

  Additionally: update the two in-code deferral comments that still point at
  `ART-004` as unfixed — in `ffmpeg_utils._merge_segments_batched` and
  `segment_downloader._log_preserve_segments` — to record that the deferral is
  discharged by this block's tally exclusion.

# ── Goals ──
goals:
  - _cleanup_segments no longer raises PermissionError on a directory entry inside the segments tree
  - _tally_and_merge's merge-decision count excludes batch_*.ts temps so a resumed run reaches the merge
  - _clear_stale_segments reconciles NNNNN.ts.tmp residue alongside *.ts files
  - The .tmp suffix constant is shared at both publish sites and the new glob
  - The ART-004 deferral comments in _merge_segments_batched and _log_preserve_segments are updated to discharged
  - _cleanup_segments is still called only under if result: (no new call sites — B7 owns those)
  - TestPreserveSegmentsReporter's three tests stay green unchanged (D-4 = option i)
  - TestMergeSegmentsBatched's batch-failure-preservation test stays green unchanged (D-13 oracle)

# ── Implementation sequence ──
implementation_sequence:

  # ── Phase 1: introduce the suffix constant ──
  - phase: 1
    step: 1
    action: add_constant
    target: src/vkdownloader/services/segment_downloader.py → module level
    description: >
      Add `_SEGMENT_TEMP_SUFFIX: Final = ".tmp"` near the existing
      `_PLAYLIST_SIGNATURE_FILE` constant (segment_downloader.py:110).
      `Final` is already imported (line 14). This constant replaces the
      hard-coded ".tmp" at both os.replace publish sites and is used in the
      new *.ts.tmp glob in _clear_stale_segments.

  # ── Phase 2: ART-003 — _cleanup_segments guard ──
  - phase: 2
    step: 1
    action: modify_code
    target: src/vkdownloader/services/segment_downloader.py → _cleanup_segments
    description: >
      Replace the bare `for f in segments_dir.glob("*"): f.unlink()` with an
      intent-guarded loop: skip entries that are not files (`if not f.is_file():
      continue`) and call `f.unlink(missing_ok=True)`. This prevents the
      PermissionError [WinError 5] on directory entries. The `glob("*")`
      already matches `*.ts.tmp` files; the `is_file()` guard is what makes
      unlinking them safe. The `rmdir()` tail with its existing try/except
      is untouched.

  # ── Phase 3: ART-004 — _tally_and_merge count exclusion ──
  - phase: 3
    step: 1
    action: modify_code
    target: src/vkdownloader/services/segment_downloader.py → _tally_and_merge → downloaded_count
    description: >
      Replace `downloaded_count = len(list(segments_dir.glob("*.ts")))` with a
      filtered comprehension that excludes batch_*.ts temps: `downloaded_count =
      len([f for f in segments_dir.glob("*.ts") if not f.name.startswith("batch_")])`.
      D-4 = option (i): narrow only this merge-decision count. The progress
      callback still receives this narrowed count so progress reporting is
      consistent with the merge decision.

  # ── Phase 4: ART-013 — _clear_stale_segments .ts.tmp sweep ──
  - phase: 4
    step: 1
    action: modify_code
    target: src/vkdownloader/services/segment_downloader.py → _clear_stale_segments
    description: >
      After the existing `for stale_file in segments_dir.glob("*.ts")` loop,
      add a second loop for the temp residue:
      `for stale_temp in segments_dir.glob(f"*.ts{_SEGMENT_TEMP_SUFFIX}"):
      stale_temp.unlink(missing_ok=True)`. The .ts.tmp files are always stale
      residue (never a valid segment), so sweeping them alongside *.ts is
      correct. Update the docstring to mention *.ts.tmp coverage.

  - phase: 4
    step: 2
    action: modify_code
    target: src/vkdownloader/services/segment_downloader.py → _download_segment_sequential and _download_segment_parallel → publish sites
    description: >
      Replace the hard-coded `".tmp"` at the two `os.replace` publish sites
      (lines ~204 and ~267: `output_path.with_suffix(output_path.suffix + ".tmp")`)
      with `_SEGMENT_TEMP_SUFFIX`. Both sites now derive the temp name from the
      same constant, so the sweep glob and the publish sites cannot drift.

  # ── Phase 5: comment updates (discharge ART-004 deferral) ──
  - phase: 5
    step: 1
    action: modify_code
    target: src/vkdownloader/services/ffmpeg_utils.py → _merge_segments_batched → D-13 deferral comment
    description: >
      Update the ART-004 deferral note (around line 631-640) to record that
