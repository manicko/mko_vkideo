# ── Honest judgement required ──
honest_judgement:

  signature_short_circuit:
    question: >
      The .signature short-circuit in _clear_stale_segments returns before
      any glob runs when the signature matches. A failed run that wrote a
      matching .signature leaves everything — including .ts.tmp residue.
      Does B6 need to make the .ts.tmp sweep run even on a matching
      signature?
    criterion: >
      B6 is the only block allowed to change the short-circuit (§4.3 row 8).
      If the Implementer moves the .ts.tmp sweep before the short-circuit,
      the sweep runs regardless of signature match — which is the safer
      choice, since .ts.tmp files are always stale residue. If the sweep
      stays after the short-circuit, a matching-signature run with a .ts.tmp
      residue will not clean it — but that residue was created by a crash
      between open() and os.replace(), which is the same window where the
      signature was NOT yet written for the current playlist (the signature
      is written at the end of _clear_stale_segments). So the residue only
      survives if a PREVIOUS run's signature matches the current playlist.
      Recommendation: keep the sweep inside the existing clearing path (after
      the short-circuit check) for the smallest diff, and note the residual
      case in the commit body. The .ts.tmp sweep is still correct for the
      non-matching-signature case, which is the case the sweep exists to
      handle.
    recommendation: >
      Keep the .ts.tmp sweep inside the existing clearing path. The matching-
      signature + .ts.tmp-residue case is a narrow edge: the .ts.tmp is only
      created during an active download, and if the download was progressing
      far enough to write the signature, the segment is either complete (.ts
      on disk, no .ts.tmp) or the crash happened before the signature write.
      Declare the residual in the commit body if the Implementer disagrees.

  d4_option_i_confirmed:
    question: >
      Is _log_preserve_segments's number a working-directory inventory or a
      resumable-segment count?
    criterion: >
      Its docstring, its next_action ("clear the working directory"), and
      its pinned test (test_count_includes_merge_temps_and_says_so, which
      asserts working_dir_ts_count == 3 with batch_00000.ts present) all
      say inventory. Choose option (i): narrow only the merge-decision count.
    recommendation: >
      Option (i) is the PoO decision for this task. Do NOT narrow the
      reporter's count. The count_note text stays true: it says the count
      includes batch_*.ts and is "not a count of resumable segments" —
      that remains accurate even after the merge-decision count is narrowed.

