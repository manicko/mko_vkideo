      _cleanup_segments from services.downloader at line 31.)

  - phase: 6
    step: 2
    action: add_tests
    target: tests/test_segment_downloader.py → new Test class or section
    description: >
      Add two oracles. (a) Merge-reached oracle: a tree with the expected
