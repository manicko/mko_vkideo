  # ── Phase 6: tests ──
  - phase: 6
    step: 1
    action: add_tests
    target: tests/test_hls_downloader.py → TestCleanupSegments
    description: >
      Extend the existing class with a directory-entry oracle: create a
      subdirectory inside segments_dir alongside segment files, call
