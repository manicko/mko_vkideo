# Task spec for Block G — retry state machine
# Generated by Planner. id: block_g_retry_state_machine

id: block_g_retry_state_machine

title: "Block G — Replace nested retries with an observable download state machine"

priority: P1

depends_on:
  - block_c_diagnostics
  - block_e_checkpoint
  - block_f_quality_refresh

source_reference: .ai/plans/MKO_VKIDEO_Refactoring_Plan.md
source_section: "Block G — Replace nested retries with an observable download state machine"
source_blocks:
  - "Block G — Replace nested retries with an observable download state machine"

description: >
  Replace the unbounded nested retry/reset loops in the yt-dlp and segment
  backends with one observable, budgeted download state machine. Introduce a
  DownloadState StrEnum (in models/enums.py), an ErrorCategory StrEnum, a
  DownloadJobState Pydantic model, and a DownloadStateMachine with validated
  transitions and atomic persistence to workspace.state_path. Enforce a single
  combined retry budget across yt-dlp, segment, and refresh attempts; set
  internal yt-dlp retries (-R/--fragment-retries) to 1; cap stream refreshes
  at 2. Classify errors (connection timeout/reset, auth expiry, 429, 5xx,
  404, slow throughput, disk full, permission, cancellation, incompatible
  playlist/codec, integrity failure) and drive state transitions from them.
  Emit the diagnostic events retry_scheduled, refresh_requested, and
  refresh_completed with the required fields. Expose job-wide counters that
  Block I (progress/ETA) can consume. Preserve artifacts on every terminal
  failure. Scope is strictly Block G: no FFmpeg transport (Block H) and no
  progress/ETA rendering (Block I).

goals:
  - DownloadState is a StrEnum with the planned states and is kept in models/enums.py.
  - ErrorCategory is a StrEnum covering the Block G classification table.
  - DownloadJobState is a Pydantic v2 model with validated fields and counters.
  - DownloadStateMachine validates transitions against an explicit allow-list.
  - Every state change is atomically persisted to workspace.state_path when a workspace is attached.
  - A single combined retry budget bounds yt-dlp, segment, and refresh attempts.
  - Internal yt-dlp retries (-R and --fragment-retries) are set to 1.
  - Stream refreshes are capped at 2.
  - Error classification detects disk-full, cancellation, 404 playlist re-verification, and slow throughput.
  - retry_scheduled, refresh_requested, and refresh_completed events carry the required fields.
  - State and counters survive child restarts and are reloadable from disk.
  - No artifacts are deleted on any terminal state.
  - Counters needed by Block I (verified segments/bytes, network bytes, attempt id, fragment counts) are exposed.

files:
  - path: src/vkdownloader/models/enums.py
    targets:
      - type: enum
        name: DownloadState
      - type: enum
        name: ErrorCategory
    semantic_anchors:
      add_after: ErrorCode
    notes: >
      Add two StrEnums alongside the existing enums. Keep them separately in
      models per project rules. Do not alter existing enum values.

  - path: src/vkdownloader/services/state_machine.py
    targets:
      - type: class
        name: DownloadJobState
      - type: class
        name: DownloadStateMachine
      - type: constant
        name: YTDLP_INTERNAL_RETRIES
      - type: constant
        name: REFRESH_CAP
      - type: constant
        name: COMBINED_RETRY_BUDGET
    semantic_anchors:
      persistence: "write_state_atomic(workspace.state_path, job_state)"
      load: "DownloadStateMachine.load(workspace)"
      transition: "transition(new_state, *, reason_code=None, error_category=None)"
      classify: "classify_error(error, *, http_status=None)"
      retry: "record_retry(scope, reason_code, delay_seconds, ...)"
      refresh: "request_refresh(reason_code) / record_refresh_completed(...)"
    notes: >
      New module. DownloadJobState is a Pydantic BaseModel mirroring
      checkpoint.JobCheckpoint's atomic-write convention. DownloadStateMachine
      owns the allow-list of transitions, the combined budget, refresh cap,
      error classification, slow-throughput observation, 404 playlist
      re-verification, cancellation, and disk-full handling. It reuses
      write_state_atomic from services/checkpoint.py for atomic persistence and
      never deletes artifacts. Diagnostic events are emitted through structlog
      with the standardized field contract.

  - path: src/vkdownloader/services/ytdlp_downloader.py
    targets:
      - type: function
        name: download_with_ytdlp_with_resume_fallback
      - type: function
        name: _download_with_ytdlp
      - type: function
        name: _attempt_segment_resume
    semantic_anchors:
      internal_retries: "-R and --fragment-retries arguments in _build_ytdlp_cli_command"
      retry_loop: "while retry_count <= settings.max_retries"
      refresh_cap: "request_refresh calls in _attempt_segment_resume"
    notes: >
      Set internal yt-dlp retries (-R and --fragment-retries) to 1. Thread a
      DownloadStateMachine through the fallback loop. Replace ad-hoc retry
      counting with record_retry/combined budget checks. Emit retry_scheduled
      on each retry. Preserve partials (Block B) on every terminal state.

  - path: src/vkdownloader/services/segment_downloader.py
    targets:
      - type: function
        name: download_hls_with_resume
      - type: function
        name: _run_download_session
      - type: function
        name: _download_segment
      - type: function
        name: _refresh_token_and_retry
      - type: function
        name: _fetch_playlist_with_retry
    semantic_anchors:
      refresh_cap: "_refresh_token_and_retry uses request_refresh (cap 2)"
      classification: "classify_error drives 404 re-verification and disk-full stop"
      events: "retry_scheduled, refresh_requested, refresh_completed"
    notes: >
      Route refreshes through the state machine's refresh cap. Classify segment
      failures and drive transitions (retry same segment, rate-limit wait,
      refresh, preserve-and-stop, disk-full, cancelled). Emit retry_scheduled,
      refresh_requested, refresh_completed with required fields. 404 on a
      segment triggers playlist re-verification before failing safely. Slow
      throughput is observed over time, not from a single sample.

  - path: src/vkdownloader/services/downloader.py
    targets:
      - type: function
        name: perform_download
      - type: function
        name: download_video
    semantic_anchors:
      state_machine_threading: "create/load DownloadStateMachine and pass to backends"
    notes: >
      Instantiate or load the DownloadStateMachine in perform_download, attach
      the workspace, and thread it through yt-dlp, auto, and segment paths so a
      backend switch reuses the same job state and attempt id. Emit
      job_started/backend_started/backend_stopped with attempt_id.

  - path: src/vkdownloader/services/retry_policies.py
    targets:
      - type: function
        name: _retry_429_with_backoff
    semantic_anchors:
      budget_awareness: "respect combined budget; do not multiply retries"
    notes: >
      Keep per-segment HTTP retries, but ensure they count against the combined
      budget via the state machine rather than multiplying with app-level loops.
      No new retry policy abstractions beyond what is needed.

  - path: tests/test_state_machine.py
    targets:
      - type: module
        name: test_state_machine
    notes: >
      New test module. Covers transition validation, budget exhaustion,
      refresh cap, error classification (disk-full, cancellation, 404, slow
      throughput, auth, 429, 5xx, timeout, reset), atomic persistence and
      reload, terminal-state artifact preservation, diagnostic event fields,
      and counter exposure.

  - path: tests/test_packaging.py
    targets:
      - type: constant
        name: EXPECTED_SDIST_ENTRIES
      - type: constant
        name: EXPECTED_WHEEL_ENTRIES
    semantic_anchors:
      add_entries: "src/vkdownloader/services/state_machine.py and tests/test_state_machine.py"
    notes: >
      Add the new module and its test to both manifest sets, as required by
      the packaging oracle.

changes:
  - action: add_code
    description: >
      Add DownloadState and ErrorCategory StrEnums to models/enums.py.
    code_hint: |
      class DownloadState(StrEnum):
          CREATED = "created"
          RESOLVE_STREAM = "resolve_stream"
          VALIDATE_VARIANT = "validate_variant"
          DOWNLOAD = "download"
          RETRY_SAME_SEGMENT = "retry_same_segment"
          REFRESH_STREAM = "refresh_stream"
          RATE_LIMIT_WAIT = "rate_limit_wait"
          RETRY = "retry"
          VERIFY_MEDIA = "verify_media"
          COMMIT = "commit"
          DONE = "done"
          PRESERVE_AND_STOP = "preserve_and_stop"
          CANCELLED = "cancelled"
          DISK_FULL = "disk_full"
          FAILED_RETRY_BUDGET = "failed_retry_budget"
          INTEGRITY_FAILED = "integrity_failed"
          FAILED = "failed"

      class ErrorCategory(StrEnum):
          CONNECTION_TIMEOUT = "connection_timeout"
          CONNECTION_RESET = "connection_reset"
          AUTH_EXPIRED = "auth_expired"
          RATE_LIMITED = "rate_limited"
          SERVER_ERROR = "server_error"
          NOT_FOUND = "not_found"
          SLOW_THROUGHPUT = "slow_throughput"
          DISK_FULL = "disk_full"
          PERMISSION_ERROR = "permission_error"
          INVALID_OUTPUT_PATH = "invalid_output_path"
          CANCELLED = "cancelled"
          INCOMPATIBLE_PLAYLIST = "incompatible_playlist"
          INCOMPATIBLE_CODEC = "incompatible_codec"
          INTEGRITY_FAILURE = "integrity_failure"
          UNKNOWN = "unknown"

  - action: add_code
    description: >
      Create services/state_machine.py with DownloadJobState, DownloadStateMachine,
      and the retry-budget constants.
    code_hint: |
      YTDLP_INTERNAL_RETRIES = 1
      REFRESH_CAP = 2
      COMBINED_RETRY_BUDGET = 6

      class DownloadJobState(BaseModel):
          model_config = ConfigDict(extra="forbid")
          schema_version: int = 1
          job_id: str
          state: DownloadState = DownloadState.CREATED
          error_category: ErrorCategory | None = None
          attempt_id: int = 0
          backend: str | None = None
          stream_variant_id: str | None = None
          quality_requested: str | None = None
          verified_segments: int = 0
          expected_segments: int | None = None
          verified_bytes: int = 0
          network_bytes_this_session: int = 0
          fragment_done: int | None = None
          fragment_total: int | None = None
          refresh_count: int = 0
          refresh_cap: int = REFRESH_CAP
          ytdlp_internal_retries: int = YTDLP_INTERNAL_RETRIES
          combined_retry_budget: int = COMBINED_RETRY_BUDGET
          retries_used: int = 0
          reason_code: str | None = None
          last_error_code: str | None = None
          retry_in_seconds: float | None = None
          http_status: int | None = None
          host: str | None = None
          path: str | None = None
          resume_bytes: int | None = None
          elapsed_seconds: float | None = None
          disk_full: bool = False
          cancelled: bool = False
          slow_throughput_observed: bool = False
          playlist_reverified: bool = False
          preserve_artifacts: bool = True
          created_at: str | None = None
          updated_at: str | None = None

      class DownloadStateMachine:
          _TRANSITIONS = { ... }  # explicit allow-list
          def __init__(self, job_state, workspace=None, logger=None): ...
          @classmethod
          def create(cls, *, job_id, quality_requested=None, workspace=None, ...): ...
          @classmethod
          def load(cls, workspace): ...  # reads workspace.state_path
          @property
          def state(self) -> DownloadState: ...
          def can_transition(self, new_state) -> bool: ...
          def transition(self, new_state, *, reason_code=None, error_category=None, persist=True): ...
          def classify_error(self, error, *, http_status=None) -> ErrorCategory: ...
          def record_retry(self, scope, reason_code, delay_seconds, *, http_status=None) -> bool: ...
          def request_refresh(self, reason_code) -> bool: ...
          def record_refresh_completed(self, *, quality_match, variant_match) -> None: ...
          def record_cancellation(self) -> None: ...
          def record_disk_full(self) -> None: ...
          def observe_throughput(self, rate_bytes_per_sec, *, now=None) -> bool: ...
          def reverify_playlist_on_404(self) -> None: ...
          def is_budget_exhausted(self) -> bool: ...
          def persist(self) -> None: ...  # write_state_atomic

  - action: modify_code
    description: >
      Set internal yt-dlp retries to 1 in _build_ytdlp_cli_command.
    code_hint: |
      "-R", "1",
      "--fragment-retries", "1",

  - action: modify_code
    description: >
      Thread DownloadStateMachine through download_with_ytdlp_with_resume_fallback,
      _attempt_segment_resume, and the segment backend; replace ad-hoc retry
      counting with record_retry/combined-budget checks and emit retry_scheduled.
    code_hint: |
      state_machine = state_machine or DownloadStateMachine.create(
          job_id=job_id, quality_requested=quality, workspace=workspace
      )
      ...
      if state_machine.is_budget_exhausted():
          state_machine.transition(DownloadState.FAILED_RETRY_BUDGET, ...)
          return None
      state_machine.record_retry("yt-dlp", reason_code, delay_seconds, ...)

  - action: modify_code
    description: >
      Apply the refresh cap (2) via request_refresh in _refresh_token_and_retry
      and _attempt_segment_resume; emit refresh_requested and refresh_completed
      with required fields. Re-verify the playlist on a 404 before failing.
    code_hint: |
      if not state_machine.request_refresh(reason_code):
          state_machine.transition(DownloadState.FAILED_RETRY_BUDGET, ...)
          return None
      logger.info("refresh_requested", job_id=..., attempt_id=..., reason_code=reason_code)
      ...
      logger.info("refresh_completed", job_id=..., attempt_id=..., quality_match=..., variant_match=...)

  - action: modify_code
    description: >
      Classify errors in the segment backend: disk-full/permission/invalid path
      stops immediately and preserves the checkpoint; cancellation reaps the
      child and retains working files; 404 re-verifies the playlist; slow
      throughput is observed over a window instead of restarting on one sample.
    code_hint: |
      category = state_machine.classify_error(exc, http_status=status)
      if category is ErrorCategory.DISK_FULL:
          state_machine.record_disk_full()
          state_machine.transition(DownloadState.DISK_FULL, error_category=category)
          return None
      if category is ErrorCategory.CANCELLED:
          state_machine.record_cancellation()
          state_machine.transition(DownloadState.CANCELLED, error_category=category)
          return None
      if category is ErrorCategory.NOT_FOUND:
          state_machine.reverify_playlist_on_404()

  - action: modify_code
    description: >
      Instantiate or load the DownloadStateMachine in perform_download and thread
      it (plus attempt_id) through backends. Create it from workspace.state_path
      when resuming.
    code_hint: |
      state_machine = DownloadStateMachine.load(workspace) if workspace is not None else None
      if state_machine is None and workspace is not None:
          state_machine = DownloadStateMachine.create(job_id=job_id, ..., workspace=workspace)

  - action: modify_code
    description: >
      Add state_machine.py and test_state_machine.py to the packaging manifest sets.
    code_hint: |
      "src/vkdownloader/services/state_machine.py",
      "tests/test_state_machine.py",
      "vkdownloader/services/state_machine.py",

