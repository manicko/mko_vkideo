# ── Task description (returned to Tech Lead) ──
description: >
  yt-dlp writes downloads to `<name>.part` and only renames to the final
  name on success. The partial-file probe in
  ``download_with_ytdlp_with_resume_fallback`` and the DF-008 cleanup at
  the retry loop's end both target the final name, missing the actual
  temp file. Under Decision C (route (a) chosen), add a helper
  ``_ytdlp_temp_name`` that derives the ``.part`` name mirroring yt-dlp's
  own ``FileDownloader.temp_name``, and repoint both the probe and the
  cleanup to use it. ``_attempt_segment_resume``'s stat() and unlink()
  inside the function are updated to target ``.part`` as well, while the
  ``download_hls_with_resume`` call still receives the final name.

# ── Goals ──
goals:
  - Add _ytdlp_temp_name helper function in ytdlp_downloader.py
  - Repoint partial-file probe to check .part temp file (not final name)
  - Repoint DF-008 cleanup to unlink .part temp file
  - Update _attempt_segment_resume to stat/unlink .part, pass final name to download_hls_with_resume
  - Add TestYtdlpTempName class with 5 oracles including yt-dlp temp_name match
  - Update TestYtDlpRetryBackoff, TestB13ResumeErrorHandling, TestPerformDownload, TestBatchDownloaderSemaphore tests to create .part files
  - All standing gates green

# ── Implementation sequence ──
implementation_sequence:
  - step: 1
    action: modify_code
    target: src/vkdownloader/services/ytdlp_downloader.py
    description: Add _ytdlp_temp_name helper function deriving the .part name.
  - step: 2
    action: modify_code
    target: src/vkdownloader/services/ytdlp_downloader.py → download_with_ytdlp_with_resume_fallback
    description: Repoint the partial-file probe to check temp_file (.part), not validated_output (final name).
  - step: 3
    action: modify_code
    target: src/vkdownloader/services/ytdlp_downloader.py → download_with_ytdlp_with_resume_fallback → DF-008 cleanup
    description: Repoint the cleanup to unlink temp_file (.part), not validated_output.
  - step: 4
    action: modify_code
    target: src/vkdownloader/services/ytdlp_downloader.py → _attempt_segment_resume
    description: Update stat() and unlink() to target _ytdlp_temp_name(output_file) while passing output_file (final name) to download_hls_with_resume.
  - step: 5
    action: add_tests
    target: tests/test_hls_downloader.py → TestYtdlpTempName
    description: 5 oracles: suffix, yt-dlp temp_name match, directory preservation, no-extension, roundtrip unlink.
  - step: 6
    action: modify_tests
    target: tests/test_hls_downloader.py, tests/test_downloader.py, tests/test_batch_downloader.py
    description: Update tests that simulate yt-dlp partial files to create .part files instead of final name.
  - step: 7
    action: verify
    target: standing gate §7.1
    description: Run pytest, ruff check, ruff format --check, mypy src, mypy src tests, ruff check . — confirm G1-G6 green.

