# ── Required tests ──
required_tests:
  suffix_append: >
    _ytdlp_temp_name(Path("/tmp/video.mp4")) == Path("/tmp/video.mp4.part")
  yt_dlp_match: >
    _ytdlp_temp_name matches the installed yt-dlp FileDownloader.temp_name output.
  directory_preserved: >
    _ytdlp_temp_name preserves the parent directory.
  no_extension: >
    _ytdlp_temp_name handles paths with no extension.
  roundtrip_unlink: >
    Write to temp, unlink, assert no residue.
  partial_probe_unreachable_without_part: >
    When only the final name exists (not .part), the probe returns False (exits retry loop).
  cleanup_targets_part: >
    DF-008 cleanup unlinks .part, not the final name.
  standing_gate: >
    G1 (pytest): exit 0, pass count >= pre-block, skip count 3. G2 (ruff check src tests): exit 0. G4 (mypy src): exit 0. G6 (ruff check .): exit 0. G5 non-increasing. G3 unchanged from red baseline.

# ── Honest judgement required ──
honest_judgement:
  question: >
    Route (a) repoint vs (b) --no-part vs (c) probe both.
  criterion: >
    Route (b) removes yt-dlp's own resumability, replacing it with the segment
    path's resume, which needs a fresh browser token. Route (c) leaves residue.
    Route (a) is the default.
  recommendation: >
    Route (a): add _ytdlp_temp_name, repoint probe and cleanup. Minimal, correct.

