## Phase 1 — Facade fix (28 errors, 6 names)

**File:** `src/vkdownloader/services/downloader.py`

**Problem:** The `__all__` tuple names 20 symbols. Six private names are imported
from `services/ytdlp_downloader.py` on lines 51–61 but omitted from `__all__`,
so mypy reports `Module does not explicitly export attribute` at 28 import sites
in `tests/test_hls_downloader.py`.

**The 6 omitted names (28 total error sites):**
1. `_create_temp_cookie_file` — 1 site
2. `_download_with_ytdlp` — 23 sites (used as `downloader._download_with_ytdlp` patched
   at 23 call sites)
3. `_echo_ytdlp_line` — 1 site
4. `_is_ytdlp_progress_line` — 1 site
5. `_parse_ytdlp_progress` — 1 site
6. `_resolve_cookies` — 1 site (also missing `# noqa: F401` on its import)

**Steps:**
1. Read `src/vkdownloader/services/downloader.py` — locate `__all__` and the
   ytdlp_downloader import block.
2. Add all 6 names to the `__all__` tuple, preserving the existing ordering
   convention (alphabetical within the import block's position).
3. Add `# noqa: F401` to the `_resolve_cookies` import line (line 59).
4. Run `uv run mypy src tests` — confirm the 28 errors drop to 0 and the count
   goes 200 → 172.
5. Run `uv run ruff check src vkdownloader/services/downloader.py` — confirm the
   `# noqa: F401` suppresses the unused-import warning.

**Acceptance (Phase 1):**
- All 6 private names present in `__all__`, each verified as genuinely re-exported
  (i.e., the name is imported from `ytdlp_downloader` on the import line that
  precedes `__all__`).
- `_resolve_cookies` import line carries `# noqa: F401`.
- `mypy src tests` error count drops by exactly 28 (200 → 172).
- `ruff check src` clean.

