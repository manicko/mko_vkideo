## Context

`mypy src tests` reports **200 errors in 13 test files**, 0 in `src/`. The single
root cause of the 28-error subset is `commit 1b8c339`, which added `__all__` to
`services/downloader.py` naming 20 symbols but omitting 6 private names imported
from `ytdlp_downloader.py`. The remaining 172 errors are test-side type issues
introduced by code commits between `cdf0697` and `468d6dd`.

This block owns the entire delta. It is hoisted to the front of W6 because every
subsequent block's delta-gate report is harder to attribute while 200 errors remain
unexplained.

