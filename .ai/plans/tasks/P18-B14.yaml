62 residuals in this file are the Phase 2 contribution.

**Steps per file:**
1. Run `uv run mypy src tests --show-error-codes` to get the exact current
   error list for the target file.
2. For each error, classify as FIX or JUSTIFY.
3. Apply the fix or inline `# type: ignore[<code>]` with a one-line justification
   starting with `# WHY: `.
4. Re-run mypy — confirm the error count for that file dropped to 0.
5. After all 13 files edited: `uv run mypy src tests` → 0 errors.

**Acceptance (Phase 2):**
- `mypy src tests` → 0 errors.
