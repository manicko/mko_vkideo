## Phase 2 — 172 residual test-side errors

**Goal:** Each of the 172 remaining errors is either **fixed** (FIX tag) or
**inline-justified** (JUSTIFY tag with `# type: ignore[<code>]` + one-line reason).

**Rule (C11):** The remedy is the owning module's `__all__` or the test's import
site for facade errors. For residuals:
- **(a) FIX:** When the test passes a wrong value (str vs enum, str vs Path,
  dict vs Cookie), fix the test fixture or add a `cast()`. Prefer fixing the test
  over the production signature.
- **(b) JUSTIFY:** When a mock/monkey-patch pattern inherently requires `Any` or
  attribute access on a mock return, add an inline `# type: ignore[<code>]` with a
  one-line justification.
- **NEVER:** blanket `type: ignore`, `ignore_errors = true`, or `pyproject.toml`
  relaxation.

### Error code distribution (172 residuals)

| Code | Count | Primary root cause |
|---|---|---|
| explicit-any | 81 | mock/monkey-patch fixtures typed as `Any` |
| arg-type | 58 | test passes `str` for `enum`, `dict` for `Cookie`, `list[dict]` for `list[Cookie]`, `Semaphore` for `SemaphoreLike` |
| attr-defined | 4 | `aclose` on `AsyncIterator[bytes]` (2), `close` on `object` (2) |
| operator | 8 | `SupportsLen + int`, `str | None` in arithmetic |
| call-arg | 5 | mock `__init__`/`call` missing required args |
| misc | 4 | generator item type, missing type parameter |
| union-attr | 3 | attribute access on `Optional[...]` without narrowing |
| method-assign | 2 | assigning function to `Callable` field on mock |
| assignment | 2 | incompatible assignment to fixture variable |
| no-any-return | 1 | returning `Any` from mocked function |
| no-untyped-def | 1 | test helper function missing type annotations |
| comparison-overlap | 1 | redundant comparison detected by mypy |
| valid-type | 1 | invalid type used as `isinstance` guard |
| unused-ignore | 1 | stale `# type: ignore` on `test_quality_spec.py` |

